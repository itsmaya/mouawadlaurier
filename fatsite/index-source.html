": "Barcelona"}, {"id": "rob", "name": "Rob", "lastName": "Chandler", "company": "Bon-Bon", "title": "Video", "description": "Video Director.", "photo": "material/Collective/Rob.jpg", "photoBack": "material/Collective/RobB.jpg", "city": "London"}, {"id": "daniel", "name": "Daniel", "lastName": "Bernal", "company": "Fat-Man", "title": "Interactive", "description": "Developer.", "photo": "material/Collective/Daniel.jpg", "photoBack": "material/Collective/DanielB.jpg", "city": "Bogota"}, {"id": "carlos", "name": "Carlos", "lastName": "Rivas", "company": "Fat-Man", "title": "Print", "description": "Designer.\nIllustrator.", "photo": "material/Collective/Carlos.jpg", "photoBack": "material/Collective/CarlosB.jpg", "city": "Bogota"}, {"id": "barnier", "name": "Barnier", "lastName": "Geerling", "company": "Iam studio", "title": "Sound", "description": "Sound Designer.\nComposer.", "photo": "material/Collective/Barnier.jpg", "photoBack": "material/Collective/BarnierB.jpg", "city": "Amsterdam"}], "studios": [{"name": "Fat-Man (London)", "lines": ["35 Brittannia Row", "London W1 ASD", "+44 (0)207 226 6222"], "mail": "info@fat-man-collective.com"}, {"name": "Fat-Man (Barcelona)", "lines": ["Passatge de la Pau 10 Bis (1-2)", "Barcelona 08002", "+34 93 302 316"], "mail": "info@fat-man-colectivo.com"}, {"name": "Fat-Bitch", "lines": ["Carrera 40 #21 off302", "Bogota, Colombia", "UK: +44 (0)207 226 6222"], "mail": "info@fat-bitch.com"}, {"name": "Bon-Bon", "lines": ["35 Brittannia Row", "London W1 ASD", "+44 (0)207 226 6222"], "mail": "info@bon-bon.tv"}, {"name": "Fat-Hosting", "lines": ["35 Brittannia Row", "London W1 ASD", "+44 (0)207 226 6222"], "mail": "info@fat-hosting.com"}]};</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
/*
 * Fat-Man Collective - site 3D, version de novembre 2008 (StageView3D_10)
 * Portage Three.js du code ActionScript 3 / Papervision3D de Maya Benaïnous.
 * Structure reprise de l'original : StyleSheets, Parameters, providers de données, Root3D/SectionObject3D,
 * CarrousselleView3D, LineView3D, CrossView3D, DistributeView3D, PostView, StageView3D, Assets, PostView2D, StageView.
 * Les easings "par frame" sont calés sur les 42 fps du SWF.
 */
import * as THREE from 'three';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const DATA = window.FAT_DATA;
const ASSETS = window.FAT_ASSETS || null;

/* ================================================================ StyleSheets */
const FPS = 42;
const STYLE = {
  object3DDistance: 800, object3DMaxHeight: 800,
  planeDistance: 500, planeDisOrder: 125,
  planeFrameThickness: 1, planeFrameColor: 0xf1f1f1, planeFrameSelectColor: 0x999999, planeFrameDistance: 1,
  planeSpeed: 1,
  cameraDistance: 600, cameraDistanceProportion: 600,
  cameraEaseSpeed: 7, cameraSpeed: 2.0,
  cameraHeight: 350, cameraTargetHeight: 400,
  cameraKeyboardSpeed: 3, cameraZoomMin: 500, cameraZoomMax: 2000,
  lineThickness: 1, lineColor: 0xdedede, locatorColor: 0xf1b800,
  margin: 20, easing: 6, tween: 1,
  animationMode: true,
};
const CAMERA = { zoom: 2, focus: 300 };
const MODEL_SCALE = 100;            // Papervision affichait les fichiers Maya (cm) x100
const POST_STAGGER = 0.08;          // ouverture post par post, comme le chargement séquentiel d'origine
const SAVED = {};
function setAnimationMode(value) {
  if (STYLE.animationMode === value) return;
  const keys = ['cameraEaseSpeed', 'cameraSpeed', 'planeSpeed', 'cameraKeyboardSpeed', 'planeDisOrder', 'easing', 'tween'];
  if (value) keys.forEach(k => { STYLE[k] = SAVED[k]; });
  else {
    keys.forEach(k => { SAVED[k] = STYLE[k]; });
    Object.assign(STYLE, { easing: 1, tween: 0, cameraEaseSpeed: 1, cameraSpeed: 0, planeSpeed: 0, cameraKeyboardSpeed: 1, planeDisOrder: 0 });
  }
  STYLE.animationMode = value;
}

/* ================================================================ Données (providers) */
const PEOPLE = DATA.people;
const personById = id => PEOPLE.find(p => p.id === id);
class Provider {
  constructor(posts, { maxPostPage = 8, defaultCategory = 'ALL', byColumn = false } = {}) {
    this.all = posts; this.max = maxPostPage; this.defaultCategory = defaultCategory;
    this.categoryList = []; this.postCategory = [];
    const add = (cat, post) => {
      let id = this.categoryList.findIndex(c => c.toUpperCase() === cat.toUpperCase());
      if (id === -1) { this.categoryList.push(cat); this.postCategory.push([]); id = this.categoryList.length - 1; }
      this.postCategory[id].push(post);
    };
    if (byColumn) {   // DataPeopleProvider : catégories construites colonne par colonne
      const maxCat = Math.max(...posts.map(p => p.category.length));
      for (let j = 0; j < maxCat; j++) for (const p of posts) { if (j >= p.category.length) break; add(p.category[j], p); }
    } else posts.forEach(p => p.category.forEach(c => add(c, p)));
    this.selected = 0;
    this.changeCategory(defaultCategory);
  }
  changeCategory(name) {
    const i = this.categoryList.findIndex(c => c.toUpperCase() === name.toUpperCase());
    if (i !== -1) { this.currentCategory = i; this.list = this.postCategory[i]; }
    else { this.currentCategory = 0; this.list = this.postCategory[0] || this.all; }
    this.first = 0;
    this.posts = this.list.slice(0, this.max);
    this.last = this.posts.length;
  }
  get currentCatName() { return this.categoryList[this.currentCategory] || ''; }
  get currentPost() { return this.posts[this.selected]; }
  hasNewer() { return this.first > 0; }                   // nextEntries de l'original
  hasOlder() { return this.last < this.list.length; }     // previousEntries de l'original
  newer() {
    if (!this.hasNewer()) return false;
    this.last = this.first; this.first = Math.max(0, this.last - this.max);
    this.posts = this.list.slice(this.first, this.last); return true;
  }
  older() {
    if (!this.hasOlder()) return false;
    this.first = this.last; this.last = Math.min(this.list.length, this.first + this.max);
    this.posts = this.list.slice(this.first, this.last); return true;
  }
}
const projectPosts = DATA.projects.map(p => ({ ...p, kind: 'project', team: p.team.map(personById).filter(Boolean) }));
const peoplePosts = PEOPLE.map(p => ({ kind: 'person', category: ['ALL', p.company, p.title], title: 'Team', team: [p] }));
const blogPosts = DATA.blog.map(p => ({ ...p, kind: 'blog' }));
const contactPosts = DATA.contacts.map(p => ({ ...p, kind: 'contact' }));

/* ================================================================ Parameters */
const SECTIONS = [
  { name: 'Our work',            model: 'material/Colladas/hedra.dae', layout: 'CARROUSSELLE', make: () => new Provider(projectPosts, { defaultCategory: 'Featured Works' }) },
  { name: 'Meet the collective', model: 'material/Colladas/hand.dae',  layout: 'LINE',         make: () => new Provider(peoplePosts, { maxPostPage: 20, byColumn: true }) },
  { name: 'From the blog',       model: 'material/Colladas/arrow.dae', layout: 'CROSS',        make: () => new Provider(blogPosts) },
  { name: 'Contact',             model: 'material/Colladas/world.dae', layout: 'DISTRIBUTE',   make: () => new Provider(contactPosts) },
];
const P = {
  currentSection: 0, degreeCamera: Math.PI, actualDeg: Math.PI, cameraY: STYLE.cameraHeight,
  postOpen: false, datas: [],
  get data() { return this.datas[this.currentSection]; },
  get section() { return SECTIONS[this.currentSection]; },
  get selected() { return this.data.selected; },
  set selected(i) { this.data.selected = i; },
  resetData() {
    if (!this.datas[this.currentSection]) this.datas[this.currentSection] = this.section.make();
    else this.data.changeCategory(this.data.defaultCategory);
  },
};
const cam = { x: 0, y: 0, z: 0, zoom: CAMERA.zoom };
const camTarget = { x: 0, y: 0, z: 0 };

/* ================================================================ TweenLite / TweenMax */
let clock = 0;
const tweens = [];
const EASE = {
  linear: t => t,
  quadOut: t => -t * (t - 2),
  quartOut: t => 1 - Math.pow(1 - t, 4),
  quintInOut: t => (t < .5 ? 16 * t ** 5 : 1 + 16 * (t - 1) ** 5),
  expoOut: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  circOut: t => Math.sqrt(1 - (t - 1) * (t - 1)),
};
function to(obj, time, props, o = {}) {
  for (const tw of tweens) if (tw.obj === obj) for (const k in props) delete tw.props[k];
  const tw = { obj, props: { ...props }, bezier: o.bezier || null, time, start: clock + (o.delay || 0), ease: EASE[o.ease || 'quadOut'], onUpdate: o.onUpdate, onComplete: o.onComplete, from: null };
  tweens.push(tw); return tw;
}
function delayedCall(t, fn) { return to({}, t, {}, { onComplete: fn, ease: 'linear' }); }
function killTweensOf(obj) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1); }
function isTweening(obj) { return tweens.some(t => t.obj === obj && clock >= t.start); }
function stepTween(tw, force) {
  if (!force && clock < tw.start) return false;
  if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
  const raw = force || tw.time <= 0 ? 1 : Math.min(1, (clock - tw.start) / tw.time);
  const t = raw >= 1 ? 1 : tw.ease(raw);
  for (const k in tw.props) {
    const b = tw.from[k], e = tw.props[k];
    tw.obj[k] = tw.bezier && k in tw.bezier ? b + t * (2 * (1 - t) * (tw.bezier[k] - b) + t * (e - b)) : b + (e - b) * t;
  }
  if (tw.onUpdate) tw.onUpdate();
  return raw >= 1;
}
function updateTweens() {
  for (const tw of tweens.slice()) {
    if (stepTween(tw, false)) { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); if (tw.onComplete) tw.onComplete(); }
  }
}
function killAllTweens() {   // TweenMax.killAllTweens(true) : les tweens en cours sont terminés d'un coup
  const list = tweens.splice(0);
  for (const tw of list) { stepTween(tw, true); }
}
function cameraGoto(mx, my, mz, tx, ty, tz, speed) {
  killTweensOf(cam);
  to(cam, speed, { x: mx, y: my, z: mz }, { ease: 'quadOut', bezier: { x: (mx - cam.x) / 2, y: my + 500, z: (mz - cam.z) / 2 } });
  cameraTarget(tx, ty, tz, speed);
}
function cameraTarget(x, y, z, speed) { killTweensOf(camTarget); to(camTarget, speed * 3 / 4, { x, y, z }, { ease: 'quartOut' }); }
function cameraOnlyGoto(mx, my, mz, speed) { killTweensOf(cam); to(cam, speed, { x: mx, y: my, z: mz }, { ease: 'quadOut' }); }

let frames = 1;
const ease = k => (k <= 1 ? 1 : 1 - Math.pow(1 - 1 / k, frames));
const D2R = Math.PI / 180;
const pv = (x, y, z) => new THREE.Vector3(x, y, -z);          // Papervision (main gauche) -> Three.js
const postLocal = (x, y, z) => [-x, y, z];                    // conteneur de posts tourné de 180°

/* ================================================================ Rendu */

const LINE_MATS = [lineMatCenter, lineMatFrame, lineMatSelect];
function resolveAsset(url) {
  const key = url.replace(/^\.\//, '').replace(/\/\.\//g, '/');
  return (ASSETS && ASSETS[key]) || url;
}
const manager = new THREE.LoadingManager();
manager.setURLModifier(resolveAsset);
const texLoader = new THREE.TextureLoader(manager);
const texCache = new Map();
function prepTex(t) { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t; }
function loadTex(url) {
  if (!texCache.has(url)) texCache.set(url, texLoader.loadAsync(url).then(prepTex));
  return texCache.get(url);
}
const imgCache = new Map();
function loadImage(url) {
  if (!imgCache.has(url)) imgCache.set(url, new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = resolveAsset(url); }));
  return imgCache.get(url);
}

/* ================================================================ Root3D / SectionObject3D */
class SectionObject3D {
  constructor(def, i) { this.def = def; this.idTable = i; this.container = new THREE.Group(); this.p = { x: 0, y: 0, z: 0 }; this.blockers = []; }
  async load(loader) {
    const url = this.def.model;
    const collada = ASSETS && ASSETS[url] ? loader.parse(ASSETS[url], url.slice(0, url.lastIndexOf('/') + 1)) : await loader.loadAsync(url);
    const shape = collada.scene;
    shape.scale.setScalar(MODEL_SCALE);
    shape.traverse(o => {
      if (!o.isMesh) return;
      const conv = m => {
        const map = m.map || m.emissiveMap || null;
        // les locators de world.dae sont des WireframeMaterial jaunes (locatorColor) dans l'original
        if (!map) return new THREE.MeshBasicMaterial({ color: STYLE.locatorColor, wireframe: true });
        return new THREE.MeshBasicMaterial({ map });
      };
      o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      this.blockers.push(o);
    });
    this.container.add(shape);
    shape.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(shape);
    if (box.max.y - box.min.y > STYLE.object3DMaxHeight) shape.scale.multiplyScalar(STYLE.object3DMaxHeight / (box.max.y - box.min.y));
  }
  place(i) {
    this.p.x = i * 5 * STYLE.object3DDistance;
    this.p.z = (Math.pow(-1, i + 1) - 1) * i * STYLE.object3DDistance;
    this.container.position.copy(pv(this.p.x, 0, this.p.z));
  }
}

/* ================================================================ Textures dessinées (MovieClips de la bibliothèque) */
function fontsReady() { return document.fonts && document.fonts.load ? Promise.all([document.fonts.load('22px Gelasio'), document.fonts.load('italic 22px Gelasio')]).catch(() => {}) : Promise.resolve(); }
function wrapLines(ctx, text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function canvasTex(w, h, draw, scale = 2) {
  const c = document.createElement('canvas'); c.width = w * scale; c.height = h * scale;
  const ctx = c.getContext('2d'); ctx.scale(scale, scale); draw(ctx);
  return prepTex(new THREE.CanvasTexture(c));
}
const SERIF = 'Georgia, Gelasio, "Times New Roman", serif';
const UI = '"Lucida Grande", "Lucida Sans Unicode", Verdana, sans-serif';
async function blogThumbTextures(post) {
  const [photo, logo] = await Promise.all([loadImage(post.thumb).catch(() => null), loadImage('assets/logo.svg').catch(() => null)]);
  await fontsReady();
  const title = post.title.trim();
  const front = canvasTex(312, 78, ctx => {
    ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 312, 78);
    if (photo) ctx.drawImage(photo, 13, 12.75, 53, 53);
    ctx.fillStyle = '#fff'; ctx.font = `21px ${SERIF}`; ctx.textBaseline = 'top';
    wrapLines(ctx, title, 233).slice(0, 3).forEach((l, i) => ctx.fillText(l, 72, 12 + i * 22));
  });
  const back = canvasTex(312, 78, ctx => {
    ctx.translate(312, 0); ctx.scale(-1, 1);   // le dos est vu de derrière : on le dessine en miroir pour que le texte se lise
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(0, 0, 312, 78);
    if (logo) { ctx.globalAlpha = .35; ctx.drawImage(logo, 10, 10, 58, 58); ctx.globalAlpha = 1; }
    ctx.fillStyle = '#cccccc'; ctx.font = `21px ${SERIF}`; ctx.textBaseline = 'top';
    wrapLines(ctx, title, 233).slice(0, 3).forEach((l, i) => ctx.fillText(l, 72, 9 + i * 22));
  });
  return [front, back];
}
function htmlToLines(html) {   // pour les fiches dessinées dans le canvas
  return html.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').split('\n').map(s => s.trim()).filter(Boolean);
}
function contactInfoTexture(post) {   // MovieClip "contact" (380 x 300) plaqué sur un plan de 165 x 130
  return fontsReady().then(() => canvasTex(380, 300, ctx => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 380, 300); ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.font = `50px ${SERIF}`; ctx.fillText(post.title + '.', 32, 18);
    ctx.fillStyle = '#979797'; ctx.font = `20px ${SERIF}`; ctx.fillText(post.autor, 32, 82);
    ctx.fillStyle = '#ffcc00'; ctx.font = `14px ${UI}`; ctx.fillText((post.link || '').replace('http://', ''), 32, 128);
    htmlToLines(post.html).forEach((l, i) => {
      const m = l.match(/^([te]\.)\s*(.*)$/);
      if (m) { ctx.fillStyle = '#999'; ctx.fillText(m[1], 32, 170 + i * 20); ctx.fillStyle = '#fff'; ctx.fillText(m[2], 52, 170 + i * 20); }
      else { ctx.fillStyle = '#fff'; ctx.fillText(l, 32, 170 + i * 20); }
    });
    ctx.fillStyle = '#ffcc33'; ctx.font = `15px ${UI}`; ctx.fillText(post.date, 32, 260);
  }, 1.5));
}
function peopleInfoTexture(person) {  // MovieClip "people" (200 x 200)
  return fontsReady().then(() => canvasTex(200, 200, ctx => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 200, 200); ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.font = `22px ${SERIF}`; ctx.fillText(`${person.name} ${person.lastName}.`, 18, 14);
    ctx.fillStyle = '#8c8c8c'; ctx.font = `17px ${SERIF}`;
    person.description.split('\n').forEach((l, i) => ctx.fillText(l, 19, 44 + i * 21));
  }));
}
async function washedTexture(url) {   // Load3DMaterial avec filtre : voile blanc à 80 % sur le dos des posts
  const im = await loadImage(url);
  return canvasTex(im.naturalWidth, im.naturalHeight, ctx => { ctx.drawImage(im, 0, 0); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(0, 0, im.naturalWidth, im.naturalHeight); }, 1);
}

/* ================================================================ PostView */
function makeSegments(points, material) {
  const g = new LineSegmentsGeometry(); g.setPositions(points);
  const l = new LineSegments2(g, material); l.computeLineDistances(); return l;
}
class PostView {
  constructor(view, w, h, id) {
    this.view = view; this.id_ = id; this.width = w; this.height = h;
    this.thumb = { x: 0, y: 0, z: 0, rotX: 0, rotY: 0, rotZ: 0, scale: 1 };
    this.p2 = { x: 0, y: 0, z: 0, rotX: 0, rotY: 0, rotZ: 0 };
    this.group = new THREE.Group(); this.group.rotation.order = 'YXZ';
    this.meshes = []; this.ready = false;
  }
  build(texFront, texBack) {
    const geo = new THREE.PlaneGeometry(this.width, this.height);
    const front = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texFront, side: THREE.FrontSide }));
    const back = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texBack, side: THREE.BackSide }));
    front.userData = { post: this, face: 'front' }; back.userData = { post: this, face: 'back' };
    this.width += STYLE.planeFrameDistance; this.height += STYLE.planeFrameDistance;
    const w = this.width / 2, h = this.height / 2;
    const pts = [-w, -h, 0, w, -h, 0, -w, -h, 0, -w, h, 0, w, -h, 0, w, h, 0, -w, h, 0, w, h, 0];
    this.frame = makeSegments(pts, lineMatFrame);
    this.group.add(front, back, this.frame);
    this.meshes.push(front, back);
    this.ready = true;
  }
  setPosition(x, y, z, rotY, rotX = 0, rotZ = 0) { Object.assign(this.p2, { x, y, z, rotY, rotX, rotZ }); }
  apply() {
    const t = this.thumb, g = this.group;
    g.position.set(...postLocal(t.x, t.y, t.z));
    g.rotation.y = -(t.rotY + 180) * D2R;
    g.rotation.x = -t.rotX * D2R;
    g.rotation.z = t.rotZ * D2R;
    g.scale.setScalar(Math.max(1e-4, t.scale));
  }
  selectIt() {
    if (!this.frame) return;
    this.frame.material = lineMatSelect;
    delayedCall(0.8, () => { if (this.frame) this.frame.material = lineMatFrame; });
  }
  turnAround(axis, degree) {
    const key = { x: 'rotX', y: 'rotY', z: 'rotZ' }[axis];
    this.thumb.rotX = this.p2.rotX; this.thumb.rotY = this.p2.rotY; this.thumb.rotZ = this.p2.rotZ;
    to(this.thumb, STYLE.tween, { [key]: this.p2[key] + degree }, { ease: 'quartOut' });
  }
  moveToCamera(distance, time = 0) {
    killTweensOf(this.thumb);
    const D = STYLE.cameraDistance, p = this.p2;
    const len = Math.sqrt(p.x * p.x + (p.z - D) * (p.z - D));
    to(this.thumb, time, { x: p.x * distance / len, y: p.y, z: (p.z - D) * distance / len + D, rotY: p.rotY + 720 }, { ease: 'quartOut' });
  }
  moveBack(time = 0) {
    killTweensOf(this.thumb);
    const p = this.p2;
    to(this.thumb, time, { x: p.x, y: p.y, z: p.z, rotX: p.rotX, rotY: p.rotY, rotZ: p.rotZ }, { ease: 'quartOut' });
  }
  jump(x, y, z) {
    to(this.thumb, STYLE.tween / 2, { x, y, z }, { ease: 'quartOut', onComplete: () => to(this.thumb, STYLE.tween / 2, { x: this.p2.x, y: this.p2.y, z: this.p2.z }, { ease: 'quartOut' }) });
  }
  dispose() {
    killTweensOf(this.thumb);
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && !LINE_MATS.includes(o.material)) o.material.dispose(); });
  }
}

        pv.setPosition(STYLE.planeDistance * Math.sin(view.angle * i + 2 * Math.PI), Math.pow(-1, i + 1) * Math.random() * STYLE.planeDisOrder + STYLE.planeDistance,
          STYLE.planeDistance * Math.cos(view.angle * i + 2 * Math.PI), view.angle * i / D2R + 180 + 360);
      });
    },
    position: (view, pv) => pv.p2,
    lineEnd: p => [p.x / 3, p.y / 3, p.z / 3],
    lineStart: (pv, t) => [t.x, t.y, t.z],
    open: 'twoStep',
    focus(view, id) { focusFacing(view, id); },

    open: 'oneStep',

      P.selected = id; P.degreeCamera = Math.PI;
      if (!pv.ready) return;
      P.cameraY = pv.p2.y;
      pv.selectIt();
      const xp = pv.p2.x * (pv.width / 2) / Math.sqrt(pv.p2.x ** 2 + pv.p2.y ** 2) + pv.p2.x;
      pv.jump(xp, pv.p2.y * xp / pv.p2.x, pv.p2.z);
      pv.turnAround('y', 360);
    },
    move(view, dx, dy, k) {
      view.postViews.forEach((pv, i) => {

    },

function focusFacing(view, id) {   // focus() du carrousel et de la croix : la caméra se place face au post
  const pv = view.postViews[id]; if (!pv) return false;
  let rot = pv.p2.rotY * D2R; if (rot === 0) rot = 2 * Math.PI;
  let delta = (rot - P.degreeCamera) % (2 * Math.PI);
  if (delta > Math.PI) delta -= 2 * Math.PI; else if (delta < -Math.PI) delta += 2 * Math.PI;
  P.selected = id; P.cameraY = pv.p2.y; P.degreeCamera += delta;
  pv.selectIt();
  return true;
}

class PostsView3D {
  constructor(section) {
    this.section = section;
    this.L = layouts[section.def.layout];
    this.posts = P.data.posts.slice();
    this.n = this.posts.length;
    this.container = new THREE.Group();
    this.container.position.copy(section.container.position);
    scene.add(this.container);
    const [w, h] = this.L.size();
    this.postViews = this.posts.map((_, i) => new PostView(this, w, h, i));
    this.lines = []; this.following = new Set(); this.infos = [];
    this.alive = true;
    this.L.preset.call(this.L, this);
    this.openPosts();
  }
  async openPosts() {
    for (let i = 0; i < this.n; i++) {
      let tex;
      try { tex = await this.L.textures(this.posts[i]); } catch (e) { continue; }
      if (!this.alive) return;
      const pv = this.postViews[i];
      pv.build(tex[0], tex[1]);
      this.animeOpenPost(pv, i);
      if (STYLE.planeSpeed > 0) { const until = clock + POST_STAGGER; while (clock < until) { await new Promise(r => requestAnimationFrame(r)); if (!this.alive) return; } }
    }
  }
  animeOpenPost(pv, i) {
    const L = this.L;
    if (L.position !== layouts.CARROUSSELLE.position) { const p = L.position.call(L, this, pv, i); pv.setPosition(p.x, p.y, p.z, p.rotY); }
    const p = pv.p2;
    Object.assign(pv.thumb, { x: p.x / 2, y: 10, z: p.z / 2, rotY: p.rotY, rotX: 90 - 2 * 360, rotZ: 0, scale: 0.5 });
    const timeAnim = 2 * STYLE.planeSpeed;
    let pending;
    const done = () => { if (--pending <= 0) { this.following.delete(pv); if (L.lineEnd) this.followLine(pv, i); } };
    if (L.open === 'twoStep') {
      pending = 2;
      to(pv.thumb, timeAnim, { y: p.y, rotX: 0 }, { delay: STYLE.planeSpeed / 3, ease: 'expoOut', onComplete: done });
      to(pv.thumb, timeAnim, { x: p.x, z: p.z, rotY: p.rotY, scale: 1 }, { ease: 'circOut', onComplete: done });
    } else {
      pending = 1;
      to(pv.thumb, timeAnim, { x: p.x, y: p.y, z: p.z, rotY: p.rotY, rotX: 0, scale: 1 }, { ease: 'circOut', onComplete: done });
    }
    pv.apply();
    this.container.add(pv.group);
    if (L.lineEnd) { this.following.add(pv); this.followLine(pv, i); }
    if (this.section.def.layout === 'DISTRIBUTE') this.openInfo(pv, i, timeAnim);
  }
  followLine(pv, i) {
    const a = this.L.lineStart(pv, pv.thumb), b = this.L.lineEnd.call(this.L, pv.p2, this, i);
    const pts = [...postLocal(...a), ...postLocal(...b)];
    let l = this.lines[i];
    if (!l) { l = this.lines[i] = makeSegments(pts, lineMatCenter); this.container.add(l); } else l.geometry.setPositions(pts);
  }
  async openInfo(pv, i, timeAnim) {   // fiche du studio à côté du logo
    const tex = await contactInfoTexture(this.posts[i]);
    if (!this.alive) return;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(165, 130), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));

const sections = SECTIONS.map((d, i) => new SectionObject3D(d, i));
let postsView = null;
let easeSpeed = STYLE.cameraEaseSpeed;
let isClicking = false, closeTurn = false;
let mouseX = 0, mouseY = 0, prevX = 0, prevY = 0;
let started = false, inputEnabled = false;
const curSec = () => sections[P.currentSection];

function setUpper() { const h = STYLE.cameraHeight; P.cameraY = P.cameraY + h / 7 <= 3 * h ? P.cameraY + h / 7 : h * 3; }
function setDowner() { const h = STYLE.cameraHeight; P.cameraY = P.cameraY - h / 7 >= h / 7 ? P.cameraY - h / 7 : h / 7; }
function placeCameraOnOrbit() { const s = curSec(); cam.x = s.p.x + STYLE.cameraDistance * Math.sin(P.actualDeg); cam.z = s.p.z + STYLE.cameraDistance * Math.cos(P.actualDeg); }
function changeSection3D() {
  sections.forEach((s, i) => { if (i === P.currentSection) { if (!s.container.parent) scene.add(s.container); } else if (s.container.parent) scene.remove(s.container); });
  isClicking = false; closeTurn = false; canvas.classList.remove('dragging');
  if (postsView) postsView.destroy();
  postsView = new PostsView3D(curSec());
  focusPost(P.selected);
  P.actualDeg = P.degreeCamera;
  cameraChangeSection();
}
function cameraChangeSection() {
  const s = curSec();
  P.cameraY = STYLE.cameraHeight;
  cameraGoto(STYLE.cameraDistance * Math.sin(P.degreeCamera) + s.p.x, P.cameraY, STYLE.cameraDistance * Math.cos(P.degreeCamera) + s.p.z, s.p.x, STYLE.cameraTargetHeight, s.p.z, STYLE.cameraSpeed);
}
function focusPost(i) { P.selected = i; if (postsView) postsView.focus(i); }
function selectPost(dir) {
  if (!postsView) return;
  closeTurn = true;
  postsView.checkPostSelected();
  easeSpeed = STYLE.cameraKeyboardSpeed;
  focusPost(dir === 'NEXT' ? postsView.goNext() : postsView.goPrev());
}
function setCamera() {
  const hmax = 1000, max = 680, div = STYLE.cameraDistanceProportion / (hmax - 720);
  STYLE.cameraDistance = Math.round((H < max ? hmax - H : hmax - max) * div);
}
function onStageResize3D() {
  closeTurn = false;
  setCamera();
  if (!started) return;
  const s = curSec();
  if (P.postOpen && P.section.layout === 'LINE' && postsView) postsView.postViews[P.selected].moveToCamera(100, 0);
  cameraOnlyGoto(s.p.x + STYLE.cameraDistance * Math.sin(P.actualDeg), cam.y, s.p.z + STYLE.cameraDistance * Math.cos(P.actualDeg), STYLE.cameraSpeed / 2);
}
function renderMachine() {
  if (!inputEnabled) { if (Math.abs(cam.y - P.cameraY) > 0.007 && !isTweening(cam)) cam.y -= (cam.y - P.cameraY) * ease(STYLE.cameraEaseSpeed); return; }
  if (isClicking) {
    easeSpeed = STYLE.cameraEaseSpeed;
    const deg = P.degreeCamera;
    P.degreeCamera += (mouseX - prevX) / 150;
    P.actualDeg -= (P.actualDeg - deg) * ease(easeSpeed);
    placeCameraOnOrbit();
    P.cameraY += (mouseY - prevY) * 2;
    const h = STYLE.cameraHeight;
    if (P.cameraY < h / 3) P.cameraY = h / 3; else if (P.cameraY > h * 4) P.cameraY = 4 * h;
    cam.y -= (cam.y - P.cameraY) * ease(easeSpeed);
    if (STYLE.animationMode && postsView) postsView.movePosts((prevX - mouseX) / Math.max(frames, .25), (prevY - mouseY) / Math.max(frames, .25), easeSpeed);
    prevX = mouseX; prevY = mouseY;
  } else if (closeTurn) {
    if (Math.abs(P.actualDeg - P.degreeCamera) <= 0.007) closeTurn = false;
    P.actualDeg -= (P.actualDeg - P.degreeCamera) * ease(STYLE.cameraEaseSpeed);
    placeCameraOnOrbit();
    cam.y -= (cam.y - P.cameraY) * ease(easeSpeed);
    if (STYLE.animationMode && postsView) postsView.movePosts(0, 0, STYLE.cameraEaseSpeed);
  } else if (Math.abs(cam.y - P.cameraY) > 0.007) {
    cam.y -= (cam.y - P.cameraY) * ease(STYLE.cameraEaseSpeed);
  }
}
function mainEntrance() {   // le zoom d'entrée : la focale passe de 6 à 2 en 1 s
  const real = CAMERA.zoom, time = 1;
  cam.zoom = 6;
  const p0 = postsView && postsView.postViews[0] ? postsView.postViews[0].p2.y : STYLE.planeDistance;
  cam.y = p0 + 100; camTarget.y = p0 + 100;
  cameraTarget(camTarget.x, STYLE.cameraTargetHeight, camTarget.z, time);
  inputEnabled = false;
  to(cam, time, { zoom: real }, { ease: 'expoOut' });
  delayedCall(time, () => { inputEnabled = true; });
}

/* Caméra Papervision : focale = zoom x focus (en pixels), oeil placé "focus" unités derrière la caméra. */
const _p = new THREE.Vector3(), _t = new THREE.Vector3(), _dir = new THREE.Vector3();
function updateCamera() {
  _p.copy(pv(cam.x, cam.y, cam.z)); _t.copy(pv(camTarget.x, camTarget.y, camTarget.z));
  _dir.subVectors(_t, _p); if (_dir.lengthSq() < 1e-6) _dir.set(0, 0, -1); _dir.normalize();
  camera.position.copy(_p).addScaledVector(_dir, -CAMERA.focus);
  camera.lookAt(_t);
  const narrow = Math.min(1, W / 900);   // seul ajout : sur écran étroit, la focale se réduit pour garder la scène
  const fov = 2 * Math.atan(H / 2 / (cam.zoom * CAMERA.focus * narrow)) / D2R;
  if (Math.abs(camera.fov - fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); }
}
function resizeViewport() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  LINE_MATS.forEach(m => m.resolution.set(W, H));
}

// médias encore disponibles : images locales et la vidéo Dodaq convertie ; les .flv/.swf et images distantes de 2008 ont disparu
const playable = src => !/^https?:/i.test(src) && !/\.(flv|swf)$/i.test(src);
function splitContent(html) {   // Builders.processingTexte : découpe le HTML entre textes et images
  const out = []; const re = /<img[^>]*src=['"]([^'"]+)['"][^>]*\/?>/gi; let last = 0, m;
  const s = html.replace(/<div[^>]*>|<\/div>/gi, '');

  const t = s.slice(last); if (t.replace(/<[^>]+>/g, '').trim()) out.push({ type: 'text', html: t });
  return out.map(c => {
    if (c.type !== 'text') return c;
    let h = c.html.trim().replace(/^(<\/p>\s*)+/i, '').replace(/(<p>\s*)+$/i, '');
    if (!/^<p[\s>]/i.test(h)) h = '<p>' + h;

function paginate(html, width, heights, measure) {   // PaginatorHtml : remplit chaque panneau mot par mot
  const box = document.createElement('div'); box.className = 'body'; box.style.cssText = `position:static;width:${width}px`;
  measure.innerHTML = ''; measure.appendChild(box);
  const src = document.createElement('div'); src.innerHTML = html.replace(/<br\s*\/?>\s*<br\s*\/?>/gi, '</p><p>');
  const blocks = [];
  let run = null;
  src.childNodes.forEach(n => {
    if (n.nodeType === 1 && (n.nodeName === 'P' || n.nodeName === 'DIV')) { run = null; if (n.textContent.trim()) blocks.push(n); return; }
    if (n.nodeType === 1 && n.nodeName === 'BR') { run = null; return; }
    if (n.nodeType === 3 && !n.textContent.trim() && !run) return;
    if (!run) { run = document.createElement('p'); blocks.push(run); }
    run.appendChild(n.cloneNode(true));
  });
  const pages = []; let page = 0;
  const limit = () => heights[Math.min(page, heights.length - 1)];
  const flush = () => { pages.push(box.innerHTML); box.innerHTML = ''; page++; };
  for (const b of blocks) {
    const clone = b.cloneNode(true); box.appendChild(clone);
    if (box.offsetHeight <= limit()) continue;
    box.removeChild(clone);
    // découpe du paragraphe mot par mot
    const words = []; (function walk(node, path) { node.childNodes.forEach(c => { if (c.nodeType === 3) c.textContent.split(/(\s+)/).forEach(w => w && words.push({ w, path })); else walk(c, [...path, c]); }); })(b, []);
    let p = document.createElement('p'); box.appendChild(p);
    const append = ({ w, path }) => { let parent = p; for (const el of path) { let last = parent.lastChild; if (!last || last.nodeType !== 1 || last.dataset.src !== el.outerHTML) { last = el.cloneNode(false); last.dataset.src = el.outerHTML; parent.appendChild(last); } parent = last; } parent.appendChild(document.createTextNode(w)); };
    for (const item of words) {
      append(item);
      if (box.offsetHeight > limit()) {
        const lastText = (function deep(n) { return n.lastChild && n.lastChild.nodeType === 1 ? deep(n.lastChild) : n; })(p);
        lastText.removeChild(lastText.lastChild);
        flush(); p = document.createElement('p'); box.appendChild(p); if (item.w.trim()) append(item);
      }
    }
  }
  if (box.textContent.trim() || !pages.length) pages.push(box.innerHTML);
  return pages.map(h => h.replace(/ data-src="[^"]*"/g, ''));
}
let mouse2D = 0;

/* ================================================================ StageView : navigation générale */
function getToSectionView(index = -1, indexPost = 0) {

}

function changeCategory(name) { P.data.changeCategory(name); catName.textContent = P.data.currentCatName; refreshSectionPosts(); initCategorieData(); }
function openThatPost(id) { checkPostOpenAndClose(); P.selected = id; openPost(); }
function openPost() {
  if (!postsView || !P.data.posts[P.selected]) return;

}
function zoomOut() { if (STYLE.cameraDistanceProportion < STYLE.cameraZoomMax) { STYLE.cameraDistanceProportion = Math.trunc(STYLE.cameraDistanceProportion * 1.5); onStageResize3D(); } }
function zoomIn() { if (STYLE.cameraDistanceProportion > STYLE.cameraZoomMin) { STYLE.cameraDistanceProportion = Math.trunc(STYLE.cameraDistanceProportion / 1.5); onStageResize3D(); } }
let touchedKeyboard = false;
function keyBoardNavigation(e) {
  if (!inputEnabled) return;

  const kb2D = P.postOpen && P.section.layout !== 'LINE';
  switch (e.code) {
    case 'ArrowLeft':
      release('ArrowLeft');
      if (!kb2D) { const reopen = P.postOpen && P.section.layout === 'LINE'; checkPostOpenAndClose(); selectPost('PREVIOUS'); if (reopen) openPost(); }
      else post2D.action('LEFT');
      break;
    case 'ArrowRight':
      release('ArrowRight');
      if (!kb2D) { const reopen = P.postOpen && P.section.layout === 'LINE'; checkPostOpenAndClose(); selectPost('NEXT'); if (reopen) openPost(); }
      else post2D.action('RIGHT');
      break;
    case 'ArrowUp': release('ArrowUp'); if (!kb2D) setUpper(); break;
    case 'ArrowDown': release('ArrowDown'); if (!kb2D) setDowner(); break;
    case 'Tab':
      release('Tab');
      if (!kb2D) { checkPostOpenAndClose(); getToSectionView((P.currentSection + 1) % SECTIONS.length); }
      else { closePost(); selectPost('NEXT'); openPost(); }
      break;
    case 'KeyK': kb.classList.contains('open') ? closeKeyboard() : openKeyboard(); break;
    case 'KeyA': release('KeyA'); changeActivity(); break;
    case 'Equal': case 'NumpadAdd': release('Equal'); if (!kb2D) zoomIn(); break;
    case 'Minus': case 'NumpadSubtract': release('Minus'); if (!kb2D) zoomOut(); break;
    case 'Space':
      release('Space');
      if (postsView) postsView.checkPostSelected();

// après un clic souris sur un bouton de l'interface, le clavier revient à la scène (comme focusRect = false dans Flash)

/* Souris sur la scène 3D */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  if (!started || !postsView) return null;
  ndc.set((x / W) * 2 - 1, -(y / H) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([...curSec().blockers, ...postsView.meshes], false)[0];

}
let dragId = null, downHit = null, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', e => {
  if (!inputEnabled || dragId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  mouseX = downX = e.clientX; mouseY = downY = e.clientY;
  const hit = pick(e.clientX, e.clientY);
  checkPostOpenAndClose();
  downHit = hit && hit.post ? hit : null;
  if (downHit && downHit.face === 'back') { downHit.post.view.focus(downHit.post.id_); closeTurn = true; }
  dragId = e.pointerId; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');

});
function endDrag(e) {
  if (e.pointerId !== dragId) return;

canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
let hoverQueued = false;
canvas.addEventListener('pointermove', e => {

  mouseX = e.clientX; mouseY = e.clientY;

/* ================================================================ Home : bullshit slogans */
const home = document.getElementById('home'), enterBtn = document.getElementById('enter');
const ticker = document.getElementById('ticker'), tctx = ticker.getContext('2d');

  studiosEl.appendChild(el);
});
const SLOGAN_KEY = 'fat-bullshit-slogans';
let slogans = ['BULLSHIT SLOGAN', 'WE CREATE STRATEGIES THAT UNITE THE BRANDING EXPERIENCE', 'APPVERTISING IS WHAT WE DO', 'THINKERS. DESIGNERS. DEVELOPERS.'];
try { const saved = JSON.parse(localStorage.getItem(SLOGAN_KEY) || '[]'); if (Array.isArray(saved) && saved.length) slogans = saved.concat(slogans).slice(0, 12); } catch (e) {}
let tickerDots = null, tickerX = 0, tickerDpr = 1;
function buildTickerDots() {   // texte rasterisé sur 7 lignes, puis affiché en points LED
  const text = slogans.map(s => s.toUpperCase()).join('   ✚   ') + '   ✚   ';
  const off = document.createElement('canvas'), o = off.getContext('2d');
  o.font = 'bold 8px "Lucida Console", Monaco, monospace';
  const w = Math.ceil(o.measureText(text).width) + 2;
  off.width = w; off.height = 8;
  o.font = 'bold 8px "Lucida Console", Monaco, monospace'; o.textBaseline = 'top'; o.fillStyle = '#fff'; o.fillText(text, 0, 0);
  const data = o.getImageData(0, 0, w, 8).data;

}
function sizeTicker() { tickerDpr = Math.min(window.devicePixelRatio || 1, 2); ticker.width = Math.round(window.innerWidth * tickerDpr); ticker.height = Math.round(24 * tickerDpr); }
function drawTicker(dt) {
  if (homeGone) return;
  const pitch = 3, cols = Math.ceil(window.innerWidth / pitch) + 1;
  tickerX = (tickerX + dt * 22) % tickerDots.w;
  tctx.setTransform(tickerDpr, 0, 0, tickerDpr, 0, 0);
  tctx.fillStyle = '#000'; tctx.fillRect(0, 0, window.innerWidth, 24);
  const start = Math.floor(tickerX), frac = (tickerX - start) * pitch;
  for (let c = 0; c < cols; c++) {
    const sx = (start + c) % tickerDots.w;
    for (let r = 0; r < 7; r++) {
      tctx.fillStyle = tickerDots.on(sx, r) ? '#f1b800' : '#1d1700';
      tctx.fillRect(c * pitch - frac, 2 + r * pitch, 2, 2);
    }
  }
}
document.getElementById('bs-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('bs'), v = input.value.trim();
  if (!v) return;
  slogans.unshift(v.toUpperCase()); slogans = slogans.slice(0, 12);
  try { localStorage.setItem(SLOGAN_KEY, JSON.stringify(slogans.slice(0, 8))); } catch (err) {}
  buildTickerDots(); tickerX = 0; input.value = '';
  document.getElementById('bs-sent').textContent = 'Ton slogan défile en haut de la page.';
