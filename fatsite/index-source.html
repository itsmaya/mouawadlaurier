<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fat-Man Collective 2008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Fat-Man Collective, site de novembre 2008 : home "bullshit slogan", scène 3D, fiches 2D sur bandes noires de 355 px. */
:root {
  --bg: #ffffff;
  --ink: #111111;
  --band: #0b0b0b;
  --panel: #000000;
  --menu-on: #555555;
  --menu-off: #a8a8a8;
  --rule: #b0b0b0;
  --yellow: #ffcc00;
  --amber: #f1b800;
  --grey-1: #cccccc;
  --grey-2: #999999;
  --grey-3: #666666;
  --serif: Georgia, Gelasio, "Times New Roman", serif;
  --ui: "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", Verdana, sans-serif;
  --grotesk: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--ui); color: var(--ink); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#stage.hover { cursor: pointer; }
#stage.dragging { cursor: grabbing; }
.ui { position: fixed; user-select: none; -webkit-user-select: none; }
button { font: inherit; }
:focus-visible { outline: 1px dotted var(--grey-3); outline-offset: 2px; }

/* --- Slogan, logo, menu --- */
#slogan { z-index: 5; left: calc(23.2px + env(safe-area-inset-left, 0px)); top: calc(26px + env(safe-area-inset-top, 0px)); width: 248px; pointer-events: none; opacity: 0; transition: opacity 2s cubic-bezier(.17,.84,.44,1); }
#slogan.on { opacity: 1; }
#logo { z-index: 5; right: calc(20px + env(safe-area-inset-right, 0px)); top: calc(20px + env(safe-area-inset-top, 0px)); width: 160px; height: 160px; pointer-events: none; }
#menu { left: 60px; top: 548px; margin: 0; padding: 0; list-style: none; z-index: 6; transition: opacity .4s; }
#menu::before { content: ""; position: absolute; left: 0; top: 2px; width: 1px; height: 0; background: var(--rule); transition: height .6s; }
#menu.ready::before { height: calc(var(--n) * 21.5px - 8px); }
#menu li { margin: 0; padding: 0; }
#menu li:first-child { margin-top: -3px; }
#menu button { display: block; font: 15px/21.5px var(--serif); color: var(--menu-off); background: none; border: 0; padding: 0 0 0 9px; margin: 0; text-align: left; cursor: pointer; white-space: nowrap; }
#menu button:hover, #menu button[aria-current="true"] { color: var(--menu-on); }
#menu button[aria-current="true"] { cursor: default; }

/* --- Catégories + pagination (Category.fla) --- */
#cats { right: calc(97px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 6px; z-index: 6; transition: opacity 1s; }
#cats.hidden { opacity: 0; pointer-events: none; }
.pg { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #9a9a9a; background: #fff; color: #777; padding: 0; cursor: pointer; display: grid; place-items: center; margin-bottom: 1px; }
.pg svg { width: 8px; height: 10px; }
.pg:disabled { opacity: .6; cursor: default; }
.pg[hidden] { display: none; }
#cat-box { position: relative; width: 150px; }
#cat-open { display: flex; align-items: center; gap: 7px; width: 100%; height: 24px; padding: 0 8px; border: 0; background: #eeeeee; color: #333; font: bold 10px/24px var(--ui); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; }
#cat-open .tri { width: 0; height: 0; border-left: 5px solid var(--amber); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; transition: transform .25s; flex: none; }
#cat-box.open #cat-open .tri { transform: rotate(-90deg); }
#cat-list { position: absolute; left: 0; bottom: 28px; width: 100%; margin: 0; padding: 4px 0; list-style: none; background: #f4f4f4; border-top: 2px solid #dcdcdc; transform-origin: bottom; transform: scaleY(0); opacity: 0; transition: transform .45s cubic-bezier(.77,0,.18,1), opacity .3s; }
#cat-box.open #cat-list { transform: scaleY(1); opacity: 1; }
#cat-list button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 2px 10px 2px 20px; font: bold 10px/15px var(--ui); letter-spacing: .06em; color: #777; cursor: pointer; text-transform: uppercase; }
#cat-list button:hover, #cat-list button[aria-current="true"] { color: #222; }

/* --- Guide clavier (keyboard2) --- */
#kb { right: calc(20px + env(safe-area-inset-right, 0px)); bottom: 0; width: 77px; z-index: 7; }
#kb-toggle { display: block; width: 77px; height: 36px; border: 0; padding: 0; background: url("assets/keyboard.svg") center/63px auto no-repeat; cursor: pointer; opacity: .9; margin-bottom: calc(2px + env(safe-area-inset-bottom, 0px)); }
#kb-toggle:hover { opacity: 1; filter: brightness(.85); }
#kb-panel { position: absolute; right: 0; bottom: 38px; width: 77px; background: #f2f2f2; border-top: 2px solid #dcdcdc; padding: 10px 0 12px; display: grid; justify-items: center; gap: 4px; transform: translateY(calc(100% + 40px)); transition: transform .5s cubic-bezier(.77,0,.18,1); }
#kb.open #kb-panel { transform: translateY(0); }
#kb-panel .lbl { font: bold 9px/11px var(--ui); color: #555; letter-spacing: .04em; text-transform: uppercase; margin-top: 6px; text-align: center; }
#kb-panel .sub { font: 8px/9px var(--ui); color: #777; margin-top: -4px; }
.key { min-width: 14px; height: 14px; padding: 0 3px; border: 1px solid #555; border-radius: 2px; background: #8d8d8d; color: #f2f2f2; font: bold 8px/12px var(--ui); cursor: pointer; box-shadow: inset 0 1px 0 #b4b4b4; }
.key.down, .key:active { background: #555; }
.key.wide { min-width: 36px; }
.key.space { min-width: 49px; }
.key.anim.off { background: #f2f2f2; color: #555; }
.row { display: flex; gap: 2px; align-items: center; }
.row .lbl { margin: 0 3px; }

/* --- Fiches 2D --- */
#whiteboard { position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 3; cursor: pointer; }
#post2d { position: fixed; left: 20px; top: 150px; right: 0; height: 400px; z-index: 4; overflow: visible; transition: opacity .8s; cursor: url("assets/hand-open.svg") 8 8, grab; }
#post2d.grabbing { cursor: url("assets/hand-closed.svg") 8 8, grabbing; }
#post2d.closing { opacity: 0; }
#strip { position: absolute; left: 0; top: 0; height: 355px; will-change: transform; }
.pnl { position: absolute; top: 0; height: 355px; overflow: hidden; }
.pnl .bgx { position: absolute; inset: 0; background: var(--panel); transform-origin: left; transform: scaleX(0); opacity: 0; transition: transform .2s linear, opacity .3s linear; }
.pnl.open .bgx { transform: scaleX(1); opacity: 1; }
.pnl .in { position: absolute; inset: 0; opacity: 0; transition: opacity .3s linear; }
.pnl.open .in { opacity: 1; }
.pnl.media .bgx { background: rgba(0,0,0,.45); }
.pnl.media img, .pnl.media video { display: block; height: 355px; width: auto; user-select: none; -webkit-user-drag: none; }
.txt .ttl { position: absolute; font: 30px/36px var(--serif); color: #fff; margin: 0; text-wrap: balance; }
.txt .body { position: absolute; font: 14px/18px var(--serif); color: #fff; overflow: hidden; }
.txt .body p { margin: 0 0 18px; }
.txt .body a, .txt .posted span, .banda a, .contact .site a { color: var(--yellow); text-decoration: none; }
.txt .body a:hover, .banda a:hover { text-decoration: underline; }
.txt .fecha { position: absolute; font: 13px/18px var(--serif); color: var(--grey-1); }
.txt .posted { position: absolute; font: 10px/14px var(--ui); color: var(--grey-2); letter-spacing: .03em; }
.team .bgx { background: rgba(48,48,48,.9); }
.team .ttl { position: absolute; left: 100px; top: 64px; font: 30px/36px var(--serif); color: #fff; margin: 0; }
.team .names { position: absolute; left: 100px; top: 125px; width: 385px; font: 11px/15px var(--ui); color: #fff; }
.team .names span { color: var(--grey-3); }
.face { position: absolute; width: 48px; height: 48px; padding: 0; border: 0; background: #fff; transform-origin: 0 0; transition: transform .2s cubic-bezier(.19,1,.22,1); cursor: inherit; }
.face img { position: absolute; left: 3px; top: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: cover; }
.face .tab { position: absolute; left: 0; top: 100%; width: 115px; padding: 5px; box-sizing: border-box; background: #000; color: #fff; text-align: left; font: 11px/14px var(--ui); transform: scale(.42); transform-origin: 0 0; opacity: 0; pointer-events: none; }
.face .tab small { display: block; color: var(--grey-2); font-size: 10px; white-space: pre-line; }
.face.big { z-index: 2; transform: scale(2.4); }
.face.big .tab { opacity: 1; }
.contact .bgx { background: #000; }
.contact div { position: absolute; left: 32px; width: 323px; }
.contact .cn { top: 16px; font: 50px/58px var(--serif); color: #fff; }
.contact .ac { top: 80px; font: 20px/26px var(--serif); color: #979797; }
.contact .site { top: 126px; font: 14px/20px var(--ui); color: var(--yellow); }
.contact .ad { top: 168px; font: 14px/20px var(--ui); color: #fff; }
.contact .ad font { color: #999; }
.contact .ad a { color: #fff; text-decoration: none; }
.contact .ct { top: 258px; font: 15px/20px var(--ui); color: #ffcc33; }
.banda { position: absolute; top: 373px; height: 18px; padding: 0 7px; background: #000; color: #fefefe; font: 11px/18px var(--ui); white-space: nowrap; transform-origin: right; animation: grow .25s linear both; }
@keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

/* --- Home "bullshit slogan" --- */
#home { position: fixed; inset: 0; z-index: 20; background: var(--bg); transition: transform 1s cubic-bezier(.17,.84,.44,1); }
#home.out { transform: translateY(calc(100% + 402px)); }
#ticker { position: absolute; left: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: 24px; display: block; background: #000; }
#home-top { position: absolute; left: 0; right: 0; top: 24px; height: calc(50% - 18px); display: grid; place-content: center; justify-items: center; gap: 0; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
#bs-form { margin: 0; }
#bs { width: min(560px, 86vw); border: 0; border-left: 1px solid #333; padding: 0 0 0 10px; font: bold clamp(26px, 5.2vw, 50px)/1.15 var(--grotesk); letter-spacing: -0.04em; color: var(--ink); background: transparent; outline: none; caret-color: #333; text-align: left; }
#bs::placeholder { color: var(--ink); opacity: 1; }
#bs:focus::placeholder { color: #c8c8c8; }
#bs-eg { margin: 18px 0 0; font: bold clamp(12px, 1.6vw, 15px)/1.3 var(--grotesk); color: #aaa; letter-spacing: -0.01em; }
#bs-rss { margin: 52px 0 0; font: 11px/16px var(--grotesk); color: #000; display: flex; align-items: center; gap: 4px; }
#bs-rss svg { width: 14px; height: 14px; }
#bs-sent { height: 16px; margin: 6px 0 0; font: 11px/16px var(--grotesk); color: #999; }
#home-band { position: absolute; left: 0; right: 0; bottom: 0; top: calc(50% + 6px); background: var(--band); color: #777; overflow: hidden; padding-inline: max(28px, env(safe-area-inset-left, 0px)) max(28px, env(safe-area-inset-right, 0px)); }
#home-band .sl { position: absolute; top: 18px; font: 30px/34px var(--serif); color: #ddd; margin: 0; }
#home-band .sl span { display: block; color: #777; font-size: 25px; line-height: 28px; padding-left: 2px; }
#home-band .lg { position: absolute; top: 160px; display: flex; align-items: center; gap: 18px; }
#home-band .lg img { width: 52px; height: 52px; }
#enter { border: 0; padding: 3px 6px; background: var(--yellow); color: #000; font: bold 9px/11px var(--ui); letter-spacing: .04em; cursor: pointer; }
#enter:hover { background: #fff; }
#enter.wait { background: #333; color: var(--yellow); cursor: progress; }
#studios { position: absolute; left: max(28px, env(safe-area-inset-left, 0px)); right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; row-gap: 16px; }
#studios section { padding: 0 16px 0 15px; border-left: 1px solid #1f1f1f; min-width: 0; }
#studios section:first-child { padding-left: 0; border-left: 0; }
#studios h3 { margin: 0 0 6px; font: 15px/20px var(--serif); color: #777; font-weight: normal; }
#studios p { margin: 0; font: 11px/16px var(--serif); color: #444; white-space: nowrap; }
#studios p.m { font-style: italic; color: #4d4d4d; margin-top: 2px; }
#load-error { left: 50%; top: 45%; transform: translateX(-50%); max-width: 80vw; margin: 0; font: 15px/1.4 var(--serif); color: var(--menu-on); text-align: center; z-index: 30; }
@media (max-width: 700px) {
  #slogan { width: 160px; }
  #logo { width: 96px; height: 96px; }
  #home-band { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-block: 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
  #home-band .sl, #home-band .lg, #studios { position: static; }
  #studios section { flex: 1 1 45%; border-left: 0; padding-left: 0; }
  #studios p { white-space: normal; }
  #home-band .sl { font-size: 24px; line-height: 28px; }
  #home-band .sl span { font-size: 20px; line-height: 23px; }
}
@media (max-height: 640px) and (min-width: 701px) { #studios { display: none; } }
@media (prefers-reduced-motion: reduce) { #home { transition-duration: .01s; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="Scène 3D : glisser pour tourner autour de l'objet, flèches pour passer d'un post à l'autre, espace pour ouvrir"></canvas>
<div id="whiteboard" hidden></div>
<div id="post2d" class="ui" hidden><div id="strip"></div></div>
<img id="slogan" class="ui" src="assets/fatman.svg" alt="Fat-Man Collective. Thinkers. Designers. Developers.">
<img id="logo" class="ui" src="assets/logo.svg" alt="">
<ul id="menu" class="ui" aria-label="Sections"></ul>
<div id="cats" class="ui hidden">
  <button class="pg" id="pg-prev" type="button" aria-label="Posts précédents"><svg viewBox="0 0 8 10"><path d="M7 0 0 5l7 5z" fill="currentColor"/></svg></button>
  <button class="pg" id="pg-next" type="button" aria-label="Posts suivants"><svg viewBox="0 0 8 10"><path d="M1 0l7 5-7 5z" fill="currentColor"/></svg></button>
  <div id="cat-box"><ul id="cat-list"></ul><button id="cat-open" type="button" aria-haspopup="true"><span class="tri"></span><span id="cat-name"></span></button></div>
</div>
<div id="kb" class="ui" hidden>
  <div id="kb-panel" aria-label="Raccourcis clavier">
    <div class="lbl">Animation</div><div class="sub">on/off</div><button class="key anim" data-k="KeyA" type="button">A</button>
    <div class="lbl">Section</div><button class="key wide" data-k="Tab" type="button">⇥ TAB</button>
    <div class="lbl" style="margin-top:10px"></div>
    <button class="key" data-k="ArrowUp" type="button" aria-label="Monter">▴</button>
    <div class="row"><button class="key" data-k="ArrowLeft" type="button" aria-label="Post précédent">◂</button><span class="lbl">Move</span><button class="key" data-k="ArrowRight" type="button" aria-label="Post suivant">▸</button></div>
    <button class="key" data-k="ArrowDown" type="button" aria-label="Descendre">▾</button>
    <div class="lbl">Zoom</div><div class="row"><button class="key" data-k="Equal" type="button" aria-label="Zoom avant">+</button><button class="key" data-k="Minus" type="button" aria-label="Zoom arrière">−</button></div>
    <div class="lbl">Open / Close</div><button class="key space" data-k="Space" type="button">SPACE BAR</button>
  </div>
  <button id="kb-toggle" type="button" aria-label="Afficher les raccourcis clavier" aria-expanded="false"></button>
</div>
<p id="load-error" class="ui" role="alert" hidden></p>

<div id="home">
  <canvas id="ticker" aria-label="Bullshit slogans"></canvas>
  <div id="home-top">
    <form id="bs-form" autocomplete="off"><input id="bs" type="text" maxlength="70" placeholder="type bullshit slogan here" aria-label="Tape ton bullshit slogan, puis Entrée"></form>
    <p id="bs-eg">e.g We create strategies that unite the branding experience</p>
    <p id="bs-sent" aria-live="polite"></p>
    <p id="bs-rss"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#f26522"/><circle cx="4.2" cy="11.8" r="1.7" fill="#fff"/><path d="M2.6 6.6a6.8 6.8 0 0 1 6.8 6.8M2.6 2.9a10.5 10.5 0 0 1 10.5 10.5" stroke="#fff" stroke-width="2" fill="none"/></svg>Subscribe to the <b>Bullshit RSS</b> feed</p>
  </div>
  <div id="home-band">
    <p class="sl">Fat-Man Collective.<span>Thinkers.</span><span>Designers.</span><span>Developers.</span></p>
    <div class="lg"><img src="assets/logo.svg" alt=""><button id="enter" type="button">ENTER</button></div>
    <div id="studios"></div>
  </div>
</div>

<script>window.FAT_DATA = {"projects": [{"id": 0, "category": ["All", "Web", "Featured Works"], "title": "The Fat-Site 2008", "autor": "David Okuniev", "date": "August 8th 2008", "link": null, "team": ["maya", "emi", "fernando", "david", "barnier", "beatriz", "adam", "yann", "philine"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/fatsite/fatsite1.jpg'/>Released on 08.08.08, the new Fat-Site is built in Papervision 3D (opensource), is still in beta, but with new features to come. In fact the first upgrade will be: to feed all content from our blog into the flash site. We also plan to share our code for connecting Papervision 3D to a blog, at some point in the near future.<br /> <br />If you have any comments, suggestion or constructive critique, please do so @ <a href=\"http://fat-man-collective.com/blog/uncategorized/08080808-new-fat-site-beta/373\">this post<\/a><\/p><\/div>", "thumb": "material/Projects/thumbnails/fatsite.jpg"}, {"id": 1, "category": ["All", "Web", "Featured Works"], "title": "Nokia - Navigator", "autor": "David Okuniev", "date": "July 2nd 2008", "link": "http://www.nokia.co.uk/maps/about-maps", "team": ["emi", "maya", "david", "fernando", "adam", "yann"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/nokianavigator/nokianavigator2.jpg'/><img src='material/Projects/nokianavigator/nokianavigator3.jpg'/>Digital Ad Agency Work Club came to us with a Nokia challenge, to create an interactive video player that involves pulling a thin Irishman around Canvey Island, Essex.<br /><br />The Nokia Personal Navigators guide us around the site, showing the lost beginner how to use Nokia Maps. The site hosts a range of online content all designed to show how new technology should be remarkably simple.<\/p><\/div>", "thumb": "material/Projects/thumbnails/nokianavigator.jpg"}, {"id": 2, "category": ["All", "Web", "Featured Works", "Branding"], "title": "Qajack - the sociable knowledge game", "autor": "David Okuniev", "date": "April 2008", "link": "http://qajack.com", "team": ["daniel", "david", "adam", "beatriz", "yann"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/qajack/qajack1.jpg'/><img src='material/Projects/qajack/qajack2.jpg'/><img src='material/Projects/qajack/qajack3.jpg'/>Qajack is our Fat start-up & the bastard offspring of Poker and video Q&A. It enables you to build a reputation and bet on it. Qajackers can answer or post questions by video only. The Qajack community validates your knowledge or not, top answers take home the jackpot. With each question you pose or answer, you gamble with what you know and meet like minded people along the way.<\/p><\/div>", "thumb": "material/Projects/thumbnails/qajack.jpg"}, {"id": 3, "category": ["All", "Web", "Featured Works"], "title": "Bacardi - Murmansk Route", "autor": "David Okuniev", "date": "July 23rd 2007", "link": "http://murmanskroute.com.s14047.gridserver.com/", "team": ["emi", "fernando", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/murmansk/murmansk1.jpg'/><img src='material/Projects/murmansk/murmansk2.jpg'/><img src='material/Projects/murmansk/murmansk3.jpg'/>Design and Development of a microsite for Bacardi Spain to coincide with the launch of a new campaign: Murmansk Route.<\/p><\/div>", "thumb": "material/Projects/thumbnails/murmansk.jpg"}, {"id": 4, "category": ["All", "Web", "Featured Works"], "title": "United Agents", "autor": "David Okuniev", "date": "January 2008 ", "link": "http://unitedagents.co.uk", "team": ["philine", "david", "adam"], "externalTeam": ["Ed Verilo"], "html": "<div class=\"description\"><p><img src='material/Projects/ua/ua1.jpg'/><img src='material/Projects/ua/ua2.jpg'/><img src='material/Projects/ua/ua3.jpg'/>Brief: Build us a website with 1000 client cv’s, pictures, showreels and all the Agents within 4 weeks. We like a creative and technical challenge. Solution: flexible enough to accommodate the various clients’ needs. UA wanted to tell the world about their clients so a blogging platform seemed like the obvious choice. We chose elegant simplicity for the design, let the content engage the user and make Search the focus of the site. We stretched Wordpress further than Gutenberg or Mullenweg ever would have dreamed of!<\/p><\/div>", "thumb": "material/Projects/thumbnails/ua.jpg"}, {"id": 5, "category": ["All", "CG animation", "Featured Works"], "title": "cEVO", "autor": "Adam Martin", "date": "June 5th 2008 ", "link": null, "team": ["andres", "ivan", "barnier"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='http://fat-man-collective.com/video_cache/fat_site/cevo.flv'/><img src='material/Projects/cevo/cevo1.jpg'/><img src='material/Projects/cevo/cevo2.jpg'/><img src='material/Projects/cevo/cevo3.jpg'/><img src='material/Projects/cevo/cevo4.jpg'/><img src='material/Projects/cevo/cevo5.jpg'/><img src='material/Projects/cevo/cevo6.jpg'/><strong>DreamKraft®, Inc.<\/strong> was formed to develop and promote a technology called Cognitive Evolution, or <strong>cEvo<\/strong>. cEvo is a fundamental new computing methodology able to solve longstanding problems in artificial intelligence, cognitive science &amp; machine learning.<\/p><p>Fat-Bitch was asked to create a metaphor which reflects this everlasting evolution.<\/p><p>The music was composed by <strong>Barnier<\/strong> from the Collective (<a href=\"http://iam-studios.com\">iam studios<\/a>).<\/p><\/div>", "thumb": "material/Projects/thumbnails/cevo.jpg"}, {"id": 6, "category": ["All", "Branding", "Featured Works"], "title": "Zwyer Caviar", "autor": "Beatriz Farfan", "date": "July 17th 2008 ", "link": null, "team": ["beatriz", "fernando", "carlos"], "externalTeam": ["Milos Covic"], "html": "<div class=\"description\"><p><img src='material/Projects/zwyer/zwyer1.jpg'/><img src='material/Projects/zwyer/zwyer2.jpg'/><img src='material/Projects/zwyer/zwyer3.jpg'/><img src='material/Projects/zwyer/zwyer4.jpg'/><img src='material/Projects/zwyer/zwyer5.jpg'/>We don’t actually eat caviar, not after 7am but the this year has seen Fat-Man develop a branding package for a new luxury food start-up Zwyer.<\/p><p>We developed the branding strategy, and collaborated with <a href=\"http://bon-bon.tv\">Bon-Bon<\/a> to create a motion piece for the launch. The project required us to dress up and pretend to be expensive fish in order to research Zwyer caviar’s rich family history. We strived to create a stand-out brand in a highly competitive market.<\/p><\/div>", "thumb": "material/Projects/thumbnails/zwyer.jpg"}, {"id": 7, "category": ["All", "Print"], "title": "Music Tank (Annual Report)", "autor": "Beatriz Farfan", "date": "May 20th 2008", "link": null, "team": ["beatriz"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/musictank/musictank1.jpg'/><img src='material/Projects/musictank/musictank2.jpg'/><img src='material/Projects/musictank/musictank3.jpg'/>A new identity was needed for the 2008 MusicTank report. A fresh layout with a bit of humour for the inside illustrations made for a very songful client.<\/p><\/div>", "thumb": "material/Projects/thumbnails/musictank.jpg"}, {"id": 8, "category": ["All", "Branding"], "title": "Candy for Bon-Bon", "autor": "Beatriz Farfan", "date": "December 10th 2007", "link": null, "team": ["carlos", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/bonbon/bonbon1.jpg'/><img src='material/Projects/bonbon/bonbon2.jpg'/>The creation of a logo and identity for motion graphics studio Bon Bon (part of the collective).<\/p><p>The design brief: ‘Charlie and The Chocolate Motion Graphics Factory, sugary sweet and it makes you feel funny when viewed in 3D’. We always listen to the clients needs. <\/p><\/div>", "thumb": "material/Projects/thumbnails/bonbon.jpg"}, {"id": 9, "category": ["All", "Branding"], "title": "Digimooooo....", "autor": "Beatriz Farfan", "date": "May 15th 2007", "link": null, "team": ["beatriz", "carlos", "fernando", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/digimoo/digimoo1.jpg'/><img src='material/Projects/digimoo/digimoo2.jpg'/><img src='material/Projects/digimoo/digimoo3.jpg'/>The challenge: to re-brand a product called ‘iam-solutions’ into something fun, original & accessible. Digimoo delivers fresh audio/video media to commercial spaces, all done with clever software and an Internet connection. Our task was to come up with a new name, a new brand and shortly... a new site.<\/p><\/div>", "thumb": "material/Projects/thumbnails/digimoo.jpg"}, {"id": 10, "category": ["All", "CG animation", "Featured Works"], "title": "Dodaq, a diamond's best friend", "autor": "Beatriz Farfan", "date": "June 3rd 2008", "link": null, "team": ["fernando", "david", "barnier"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='media/dodaq.mp4'/><img src='material/Projects/dodaq/dodaq1.jpg'/><img src='material/Projects/dodaq/dodaq2.jpg'/><img src='material/Projects/dodaq/dodaq4.jpg'/><img src='material/Projects/dodaq/dodaq5.jpg'/>Dodaq is a new start-up aimed at transforming the world diamond market into an electronic commodity exchange. We have been tasked with creating a teaser which introduces this revolutionary concept. Further development will include a community site and online marketing campaign.<\/p><\/div>", "thumb": "material/Projects/thumbnails/dodaq.jpg"}, {"id": 11, "category": ["All", "Web", "Featured Works"], "title": "Nokia - N-gage", "autor": "David Okuniev", "date": "August 8th 2008", "link": "http://www.n-gage.com/fifa08", "team": ["david", "fernando", "yann"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/ngage/ngage1.jpg'/><img src='material/Projects/ngage/ngage2.jpg'/>Video wall micro-site for a Uk poster campaign promoting awareness for the Nokia n-gage handsets. Notice the addictive and unselfconscious  mind control of Fifa 08. Created in collaboration with Work Club<\/p><\/div>", "thumb": "material/Projects/thumbnails/ngage.jpg"}, {"id": 12, "category": ["All", "Web", "Featured Works"], "title": "iam-studios.nl", "autor": "David Okuniev", "date": "January 3rd 2006", "link": "http://iam-studios.nl", "team": ["fernando", "david", "andres", "ivan", "carlos", "barnier"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/iamweb/iamweb1.jpg'/><img src='material/Projects/iamweb/iamweb2.jpg'/><img src='material/Projects/iamweb/iamweb3.jpg'/><img src='material/Projects/iamweb/iamweb4.jpg'/><img src='material/Projects/iamweb/iamweb5.jpg'/><img src='material/Projects/iamweb/iamweb6.jpg'/>iam studios is a music production studio based in Holland (and part of the collective!). Director, Barnier Geerling, was looking for a strong identity for his company, to coincide with the re-launch of the site in 2006. The barking speaker nearly won us prizes too numerable to list.<\/p><\/div>", "thumb": "material/Projects/thumbnails/iamweb.jpg"}, {"id": 13, "category": ["All", "Print", "Branding"], "title": "iam-studios", "autor": "David Okuniev", "date": "January 3rd 2006", "link": "http://iam-studios.nl", "team": ["beatriz", "andres", "carlos", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/iamprint/iamprint1.jpg'/><img src='material/Projects/iamprint/iamprint2.jpg'/><img src='material/Projects/iamprint/iamprint3.jpg'/><img src='material/Projects/iamprint/iamprint4.jpg'/>iam studios is a music production studio based in Holland (and part of the collective!). Director, Barnier Geerling, was looking for a strong identity for his company, to coincide with the re-launch of the site in 2006. The barking speaker nearly won us prizes too numerable to list.<\/p><\/div>", "thumb": "material/Projects/thumbnails/iamprint.jpg"}, {"id": 14, "category": ["All", "CG animation", "Featured Works"], "title": "Zwyer Caviar Video", "autor": "Beatriz Farfan", "date": "July 17th 2008 ", "link": null, "team": ["rob", "fernando"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/zwyervideo/zwyervideo1.jpg'/><img src='http://fat-man-collective.com/video_cache/fat_site/zwyer.flv'/><img src='material/Projects/zwyervideo/zwyervideo2.jpg'/><img src='material/Projects/zwyervideo/zwyervideo3.jpg'/>Fat-Man & Bon-Bon bon produced this animation piece as part of a global launch for a new caviar brand.<\/p><\/div>", "thumb": "material/Projects/thumbnails/zwyervideo.jpg"}, {"id": 15, "category": ["All", "Branding"], "title": "Jove", "autor": "David Okuniev", "date": "June 4th 2007", "link": null, "team": ["beatriz", "fernando"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/jove/jove1.jpg'/>Journal of Visualized Experiments (JoVE) is a peer reviewed, open access, online journal devoted to the publication of biological research in a video format. Fat-Man came up with a logo designed to stand out from the traditional aesthetic of the scientific world.<\/p><\/div>", "thumb": "material/Projects/thumbnails/jove.jpg"}, {"id": 16, "category": ["All", "Branding"], "title": "DreamKraft", "autor": "Beatriz Farfan", "date": "August 3rd 2007", "link": null, "team": ["beatriz", "fernando", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/dream/dream1.jpg'/><img src='material/Projects/dream/dream2.jpg'/><img src='material/Projects/dream/dream3.jpg'/><img src='material/Projects/dream/dream4.jpg'/><img src='material/Projects/dream/dream5.jpg'/>DreamKraft®, Inc. is the developer of Cognitive Evolution a fundamental new computing methodology able to solve longstanding problems in artificial intelligence, cognitive science & machine learning.<\/p><br /><p>They were looking for an identity so we asked our Macs, but they weren’t intelligent enough, so we asked ourselves and created an innovative corporate communications package and branding.<\/p><\/div>", "thumb": "material/Projects/thumbnails/dream.jpg"}, {"id": 17, "category": ["All", "Web", "Branding"], "title": "Cunxtuesday [V.3]", "autor": "Fernando Calvi", "date": "June 4th 2008", "link": "http://cunxtuesday.com/", "team": ["daniel", "david", "fernando"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/cunx/cunx1.jpg'/><img src='material/Projects/cunx/cunx2.jpg'/><img src='material/Projects/cunx/cunx3.jpg'/><img src='material/Projects/cunx/cunx4.jpg'/><img src='material/Projects/cunx/cunx5.jpg'/>Well… Thought we might give a sneak peak of the new interface &amp; re-develop for cunxtuesday.com, a student community site.<\/p><p>Keep your eyes peeled and your ears healthy! Beta is released in July 2008<\/p><\/div>", "thumb": "material/Projects/thumbnails/cunx.jpg"}, {"id": 18, "category": ["All", "Web"], "title": "One Shot (coming soon)", "autor": "David Okuniev", "date": "August 4th 2008", "link": null, "team": ["beatriz", "emi", "maya", "david", "fernando", "carlos"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/oneshotweb/oneshotweb1.jpg'/><img src='material/Projects/oneshotweb/oneshotweb2.jpg'/><img src='material/Projects/oneshotweb/oneshotweb3.jpg'/>Everything looks better with tequila vision.<br /><br />Logo, individual shots design and 4 pack packaging created by Fat drunken Men... The website, still under development is awaiting a couple more shots from the client before launching into a bar fight.<\/p><\/div>", "thumb": "material/Projects/thumbnails/oneshotweb.jpg"}, {"id": 19, "category": ["All", "Branding", "Print"], "title": "One Shot", "autor": "David Okuniev", "date": "August 4th 2008", "link": null, "team": ["beatriz", "carlos", "fernando", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/oneshotprint/oneshotprint1.jpg'/><img src='material/Projects/oneshotprint/oneshotprint2.jpg'/><img src='material/Projects/oneshotprint/oneshotprint3.jpg'/><img src='material/Projects/oneshotprint/oneshotprint4.jpg'/><img src='material/Projects/oneshotprint/oneshotprint5.jpg'/>Everything looks better with tequila vision.<br /><br />Logo, individual shots design and 4 pack packaging created by Fat drunken Men... The website, still under development is awaiting a couple more shots from the client before launching into a bar fight.<\/p><\/div>", "thumb": "material/Projects/thumbnails/oneshotprint.jpg"}, {"id": 20, "category": ["All", "Branding"], "title": "O-Post", "autor": "David Okuniev", "date": "November 4th 2006", "link": null, "team": ["andres", "david"], "externalTeam": [], "html": "<div class=\"description\"><p><img src='material/Projects/opost/opost1.jpg'/><img src='material/Projects/opost/opost2.jpg'/><img src='material/Projects/opost/opost3.jpg'/>O-post are a UK post-production facility specialising in high end production. The brief specified: using current company colour scheme to produce a modern but organic logo. Fat-Man created a mercury-like iconic droplet of water in a 3D environment.<\/p><\/div>", "thumb": "material/Projects/thumbnails/opost.jpg"}], "contacts": [{"id": 0, "category": ["All"], "title": "Fat-Man", "autor": "Web Development. Print. Motion.", "date": "Barcelona", "link": "", "team": [], "externalTeam": [], "html": "<div><font color=\"#999999\">t. <\/font>+34 93 302 3160<br/><font color=\"#999999\">e.  <\/font><a href='mailto:david@fat-man-collective.com'>david@fat-man-collective.com<\/a><\/div>", "thumb": "material/Logos/fatman.jpg"}, {"id": 1, "category": ["All"], "title": "Fat-Man", "autor": "Web Development. Print. Motion.", "date": "London", "link": "", "team": [], "externalTeam": [], "html": "<div><font color=\"#999999\">t. <\/font>+44 (0)7515 384714<br/><font color=\"#999999\">e.  <\/font><a href='mailto:adam@fat-man-collective.com'>adam@fat-man-collective.com<\/a><\/div>", "thumb": "material/Logos/fatman.jpg"}, {"id": 2, "category": ["All"], "title": "Fat-Bitch", "autor": "CG Animation.", "date": "Bogota", "link": "", "team": [], "externalTeam": [], "html": "<div><font color=\"#999999\">t. <\/font>+34 93 302 3160<br/><font color=\"#999999\">e.  <\/font><a href='mailto:david@fat-man-collective.com'>david@fat-man-collective.com<\/a><\/div>", "thumb": "material/Logos/fatbitch.jpg"}, {"id": 3, "category": ["All"], "title": "Iam-Studios", "autor": "Sound design. Scoring.", "date": "Amsterdam", "link": "http://www.iam-studios.nl", "team": [], "externalTeam": [], "html": "<div><font color=\"#999999\">t. <\/font>+31 (0) 71 513 25 6<br/><font color=\"#999999\">e.  <\/font><a href='mailto:barnier@fat-man-collective.com'>barnier@fat-man-collective.com<\/a><\/div>", "thumb": "material/Logos/iam.jpg"}, {"id": 4, "category": ["All"], "title": "Bon-Bon", "autor": "Film & TV production", "date": "London", "link": "http://www.bon-bon.tv", "team": [], "externalTeam": [], "html": "<div><font color=\"#999999\">t. <\/font>+44 (0)20 7226 6222<br/><font color=\"#999999\">e.  <\/font><a href='mailto:paul@bon-bon.tv'>paul@bon-bon.tv<\/a><\/div>", "thumb": "material/Logos/bonbon.jpg"}], "blog": [{"id": 0, "category": ["All", "2 Minute Critique", "Appvertising", "Design Porn"], "title": "WAaaaay", "autor": "Adam Martin", "date": "September 29th 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/fwaaaaay/391", "team": [], "externalTeam": [], "html": "<div><p>When you know you're going to be read by more people than have read you before, you feel compelled to be funnier.<\/p><br/><p>You also start referring to yourself in the third person, thus casting yourself as a fictional character in your own semi-demi-fat-fiction or as my history teacher Mr Rumblelow once said, 'Adam, you're in danger of becoming a caricature of your own self'.<\/p><br/><img src='http://img.ffffound.com/static-data/assets/6/c1fa1759f4319bb5ceb90285572fc98909e07be8_m.jpg' alt=''/><p>I had a caricature done once, at the Epcot Centre - Disney World, when I was 13, by a computer. It was very ‘technically advanced'. It threatened the livelihood of those total twonks on bridges and plazas in every major city with a degree in pastel shading.<\/p><br/><p>Whilst the rest of my family came out unscathed, I was delivered a damning caricature. The sentient Mickey da Vinci Machine had not managed to give me any eyes. Nothing. Eyebrows, sure, but eyes… nah.<\/p><br/><p>How the sweaty folk in their vermin and wild fowl costumes must have laughed!<\/p><br/><p>How technology and optometry have moved on since then.<\/p><br/><p>So has Fat Man. We've had 12 tumultuous months and we're sure to have 12 more. We're growing up, but at our core is a Collective of unsurpassed interactive talent, from conception through creation to delivery.<\/p><br/><p>We've developed a concept and made up a term, whose trajectory we monitor on Google: Appvertising is what we do. <\/p><br/><p>Simply put it's developing applications from social networks and visionary ecommerce sites through to sublime papervisionary and interactive entertainment formats that further a brands reach. We're technical creatives with a 3D understanding of the digital native.<\/p><br/><p>We also believe in pushing our creative boundaries with our own project <a href='http://qajack.com'>Qajack<\/a>, which I hope will be a platform to develop e-learning applications, incorporating video, networking and mobile and enabling students to learn using the digital tools that shape their daily lives.<\/p><br/><p>We're also expanding the Collective ethos of our title to create a one-stop agency for digital talent and are actively looking to find the best interactive creatives from around the world.<\/p><br/><p>A single fat man might possibly be labelled greedy. A Collective of Fat Men are a genetic mutation pre-disposed to general digital genius.<\/p><br/><p>If that sounds a little too much, wait till you see what we've got for desert! and subscribe to our feed, bookmark our waist line or if none of that makes any sense, just check back when you can for more obese, obscene-lite, techno, marketing, start-uppity musings.<\/p><br/><\/div>", "thumb": "material/Blog/lady.jpg"}, {"id": 1, "category": ["All", "Me"], "title": "Me Wrestling Human Milk", "autor": "Adam Martin", "date": "September 26th 2008 ", "link": "http://fat-man-collective.com/blog/me/me-wrestling-human-milk/390", "team": [], "externalTeam": [], "html": "<div><p>It's Friday, previously a day celebrated with funny videos (see below) and now joining the videotronic hilarity is a new blog post category ‘Me'.<\/p><br/><p>Like most people, who would if they could, I have set up Google Alerts to inform me of how my good name is being used and abused on the web. Vanity dictates that I must read what other Adam Martin's are writing about and compare it to my own tech media musings.<\/p><br/><img src='http://fat-man-collective.com/blog/imagedump/blender.jpg' alt=''/><p>For sometime I have been aware of my namesake who writes for <a href='http://www.wnlradio.com/blog/?p=163'>Wrestling News Live - For The Fans, By The Fans.<\/a> He partners with the fictional sounding Trey Dawg to write about well oiled men making rude gestures to one another. Trey and Adam are sometimes joined by Kurt Angle. It warms my heart that Adam does not feel he needs to change his name to something more wrestle friendly like Angry Adam. He does the name proud, though I do have issues with the fact that the site does not report live making it's title something of a misnomer.<\/p><br/><p>Next up is foodie Adam who writes for Menu <a href=''>Pages<\/a>. He says things like:<\/p><br/><p>'If it weren't for that pesky financial crash, this Chinese food safety thing would be really big news.'<\/p><br/><p>and this classic:<\/p><br/><p>Damn the melting financial markets! I will now never know what I clearly need to know about how to safely consume a spring roll and when will I get to drink human milk in a Swiss chalet?<\/p><br/><p>'So, um, remember that Swiss Chef we reported on, who was playing with the idea of using human milk in his restaurant dishes?'<\/p><br/><p>I think we Adam Martin's can be proud of our virtual literary heritage and if you're listening Wrestle Adam or Human Milk Adam, please do leave a comment. If you're not, well I'll continue to monitor your work like some weird virtual stalker and share it with our 10,000 other readers.<\/p><br/><\/div>", "thumb": "material/Blog/blender.jpg"}, {"id": 2, "category": ["All", "2 Minute Critique"], "title": "Dame Barbara Cartland Is Dead", "autor": "Adam Martin", "date": "September 25th 2008 ", "link": "http://fat-man-collective.com/blog/uncategorized/dame-barbara-cartland-is-dead/389", "team": [], "externalTeam": [], "html": "<div><p>Last night my 3 year old daughter informed me that she was ‘dropping Tina off at Barbara Cartland's house.'<\/p><br/><p>Tina is a cabbage patch doll with it's face coloured blue and Barbara Cartland is a dead ‘…successful English author, known for her numerous romance novels. She also became one of the United Kingdom's most popular media personalities, appearing often at public events and on television, dressed in her trademark pink and discoursing on love, health and social issues.' So says <a href='http://en.wikipedia.org/wiki/Barbara_Cartland'>Wikipedia<\/a> <\/p><br/><img src='http://farm4.static.flickr.com/3024/2349074228_4ed17c78ac.jpg?v=0' alt=''/><p>If she were alive today I'm sure she'd be presenting a show on sexually transmitted disease on BBC3.<\/p><br/><p>My wife and I were amused and perplexed as to how our daughter had come into contact with Barbara. Perhaps her Flemish speaking pal from Antwerp whose hair length is directly related to her constant running and getting lost in museums (according to my daughter), had told her about the dead pop romantic wordsmith? Unlikely, but then sometimes things just happen for no good reason at all.<\/p><br/><p>Much like the death of my Macbook last week. Like Barbara it often appeared at public events and enjoyed discoursing on love, health and social issues. Like Barbara it is dead.<\/p><br/><p>Given my trade in webology, I should have backed up. I even had the Time Machine hooked up and ready to go until a sharp ‘ping' sound emanated from the Macbook prompting me to re-boot it and leaving me with nothing but a flashing grey folder with a question mark on it.<\/p><br/><p>Nada. Nothing. Gone. Photos, invoices, pitches, proposals, ideas, business plans, the carefully disguised document with all my passwords carefully disguised within it for all my carefully disguised applications, banking and general logon-ness.<\/p><br/><p>Apple Genius Bar were efficient and replaced the hard drive within 24 hours. Somehow being in their store lusting after an ‘I will break it' Macbook Air made the news that all was lost easier to take.<\/p><br/><p>Days later and now Time Machined up, the new Macbook feels like a new start, sort of digital slash and burn to promote new growth.<\/p><br/><p>It may even make me a better person. I haven't lost days sifting through my RSS reader or mourning all my lost feeds. I've even avoided looking at Techcrunch for 4 weeks, in part due to my wife supplying a son to accompany the daughter and in part due to my dearly departed Macbook. I'd been meaning to delete my Boing Boing feed and my Digg feed for sometime, there's only so much total crapola you can sift through. I have vowed to treat the web and my reader with more respect. <\/p><br/><p>You will see a new Adam emerge post-ping. My property porn addiction has gone the way of the financial institutions. No more private browsing. I will read only blogs and view only sites I would be proud to introduce to Dame Barbara Cartland, if she were alive and if she were my Gran or something.<\/p><br/><\/div>", "thumb": "material/Blog/dame.jpg"}, {"id": 3, "category": ["All", "Design Porn", "Web Apps"], "title": "Big Fat Success", "autor": "Adam Martin", "date": "September 16th 2008 ", "link": "http://fat-man-collective.com/blog/web-apps/big-fat-success/388", "team": [], "externalTeam": [], "html": "<div><img src='http://farm4.static.flickr.com/3145/2862964342_2a67e5c792.jpg?v=0' alt=''/><p>Being obese, making crude jokes at our own expense and battering the Fat metaphor until it can be battered no more is fun. It keeps us off the streets where people point and stare. People can be so cruel like that.<\/p><br/><p>But sometimes being unable to wipe your own arse has it's benefits, notably when your new site gets talked and talked about all over the blogosphere.<\/p><br/><p>Even when you appear in an olde fashioned bookie like <a href='http://www.taschen.com/pages/en/catalogue/design/all/05204/facts.guidelines_for_online_success.htm'>Taschen<\/a> (as in the soft porn coffee table books) who feature Fat Man in their new Guidelines for Online Success. <\/p><br/><p>So it's a regurgitated thank you to the bloggers and people who have emailed to say how wonderous our new site is, particuarly those people who have enquired about internships and wanting to learn from the team. We love to teach and to preach and I like the smell of peach (in a bathroom).<\/p><br/><p>Revelation of revelations, we'll shortly be sharing our magic with the world and enabling anyone to have a site that looks kinda like ours. I used the phrase ‘the easyjet of web design' last night in an internal meeting, which I think gave some fatistas cause for concern, but you get the idea!<\/p><br/><\/div>", "thumb": "material/Blog/fat_site.jpg"}, {"id": 4, "category": ["All", "2 Minute Critique"], "title": "Magic Milking Machine", "autor": "Adam Martin", "date": "September 16th 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/magic-milking-machine/387", "team": [], "externalTeam": [], "html": "<div><img src='http://img.ffffound.com/static-data/assets/6/9c51fde184e1cb9661fbd0f808a8541627b665d3_m.jpg' alt=''/><p>I've been silent for too long, but for good reason, my breeding partner gave birth to a son who we named after a fictional order of intergalactic warriors made famous by George Lucas and the founder of Springfield, the everytown in The Simpsons. Our reasoning certainly stumped the grandparents and to a lesser degree ourselves. But alcohol hand rub, sleeping in hospital chairs and hot plate fry-ups from the canteen can do strange things to the mind.<\/p><br/><p>I'm back so stay tuned, I have 8048 articles to read in my RSS reader, one business plan to write, several lunches to eat and talk webotronics over and world domination to plot.<\/p><br/><p><br/>So what's on the agenda?<\/p><br/><p>Our new site has launched officially, though we'll continue to make changes to it and frankly it's pretty impressive and it's not just us who think so, lot's of people have been <a href='http://dailypv3d.wordpress.com/2008/09/11/fat-man-collective/'>blogging<\/a> about it's big shiny fun-ness. Congrats to all the team who worked on it.<\/p><br/><p><a href='http://qajack.com'>Qajack<\/a> has been fine tuned so the code hums. A little delayed but for all the right reasons, a glut of client work being one. Talking of which our affiliation with digital agency Work Club is working really well, a great group of eager creatives, ad-honchos and marketing mavens. Check out their <a href='http://www.work-club.com/'>new site<\/a>, it's ‘like totally self-populating'.<\/p><br/><p>We're plotting something new for the iPhone and continuing in our everything with a sense of humour ethos.<\/p><br/><p>We're twisting Wordpress into something very shiny and nice, but that's all top secret, hush, hush.<\/p><br/><p>We're addicted to FriendFeed, over Facebook and scared of bulldogs wearing lipstick.<\/p><br/><p>Normal service will resume shortly and yes my wife is a magic milking machine.<\/p><br/><\/div>", "thumb": "material/Blog/milk.jpg"}, {"id": 5, "category": ["All", "Data Visualization"], "title": "Fat-Man Begins", "autor": "Adam Martin", "date": "August 25th 2008 ", "link": "http://fat-man-collective.com/blog/data-visualization/fat-man-begins/385", "team": [], "externalTeam": [], "html": "<div><p><img src='http://farm4.static.flickr.com/3187/2797058689_45bde706f2.jpg?v=0' alt=''/><\/p><br/><\/div>", "thumb": "material/Blog/begins.jpg"}, {"id": 6, "category": ["All", "Qajack"], "title": "Qajack : New Learning", "autor": "Adam Martin", "date": "August 20th 2008 ", "link": "http://fat-man-collective.com/blog/qajack/qajack-new-learning/383", "team": [], "externalTeam": [], "html": "<div><p>We didn't get Qajack into <a href='http://www.techcrunch50.com/2008/index.php'>Techcrunch50<\/a>, frankly I'm not surprised, we're too early stage and have yet to meet, greet and hug our application in all it's really useful video gaming glory. Which means when I had my phone interview with ‘Heather' from TC central I came across like a rambling English buffoon.<\/p><br/><p><em>‘Video Q&amp;A meets Poker'<\/em> was found wanting, a presentation short of a slideshow for a not-yet-ready-hang-on-a-mo. <\/p><br/><p><img title='Image by Some Guy' src='http://img.ffffound.com/static-data/assets/6/ed6e47bee8a5dc4e5d284d7b113243d7b9bc8066_m.png'/>Frankly with a baby due I was going to struggle to tell my wife I was about to head out to San Fran only days after the birth to stand in front of a lot of very important mostly Americans replete with Madonna Vogue-esque headset and talk about <em>‘Qajack'<\/em>:<br/><em>‘You mean like stealing a car?'<\/em><br/><em>‘No, Qajack not car jack'<\/em><\/p><br/><p>We're also behind schedule. Chief architect Daniel is a perfectionist, I am a perfectionist about perfectionists and David is excited. This is all good.<span id='more-383'><\/span><\/p><br/><p>I'm also seeing Qajack differently now, which is not to say I won't totally change my mind in a couple of weeks. <\/p><br/><p>Qajack is a community for information exchange and a game in which dedication and application of knowledge are rewarded. Just like schools.<\/p><br/><p>I am starting to see Qajack as a platform for information exchange and educational engagement. <\/p><br/><p>For example, Joe Blogs in Hull is studying The Tudors, he uses Qajack to pose a question to the community; <em>‘How many wives did Henry VIII have really?'<\/em>. <\/p><br/><p>Jose Blogse in Barcelona is also styuding The Tudors and has alerts about all Qajack activity tagged Tudors sent to his inbox. Keen to demonstate his knowledge and impress his teacher he answers, ‘6′.<\/p><br/><p>Joe and Jose's classmates join in the debate keen to improve their standing within the Qajack community and gain the jackpot allocated to this question.<\/p><br/><p>Joanna Blogberg in New York has been reading up and know's it's a trick question. <\/p><br/><p><em>‘The answer isn't 6, it's 4, because two were annulled, thus Henry was not technically married'.<\/em><\/p><br/><p>Joanna wins the jackpot and is furthering her position as THE source of information on The Tudors. She's becomming a trusted voice and with her accumlated Jack rating can also demonstate her applied knowledge to her teachers and peers.<\/p><br/><p>Qajack could enable learning through the use of mobile phones with video cameras. To demonstrate knowledge whilst on a field trip to enable children to learn using the tools they are accustomed with and have ready access to. No new text books or expensive software, just the ability to turn the phone in your pocket into a means of learning.<\/p><br/><p>This is all theory, but a theory I am keen to test. <a href='http://uk.techcrunch.com/2008/08/20/please-sir-where-are-the-education-start-ups/'>Alistair Briggs<\/a>, writing at Techcrunch UK bemoans the lack of innovation in the Eduction 2.0 arena and Ken Carroll commenting on the post says this:<\/p><br/><p><em>‘But perhaps even more fundamental is the nature of online or mobile learning themselves. I'm seeing a lot of people trying to stuff old educational habits into new web 2.0 clothes, but it tends not to work. In the same way you would not film a newspaper and put the contents on TV, learning objects for new media have to be designed for the purpose. I don't see many start ups who are getting this part right.'<\/em><\/p><br/><p>Perhaps a platform not intended for education, but focused on sharing knowledge and earning reputation, born from a gaming background, could be the start-up to radically disrupt eLearning and faciliate a global educational information exchange?<\/p><br/><\/div>", "thumb": "material/Blog/qajack.jpg"}, {"id": 7, "category": ["All", "Art", "Data Visualization"], "title": "Europe", "autor": "Adam Martin", "date": "August 20th 2008 ", "link": "http://fat-man-collective.com/blog/data-visualization/europe/382", "team": [], "externalTeam": [], "html": "<div><p>Great Britain as a deranged Scotsman, hmmm, this is the stuff wars are made of.<img src='http://drawn.ca/wordpress/wp-content/uploads/2008/08/2721592095_f9ccd02810_b.jpg' alt='Handbag'/><\/p><br/><\/div>", "thumb": "material/Blog/europe.jpg"}, {"id": 8, "category": ["All", "2 Minute Critique"], "title": "Dummies Guide To Cyber Warfare", "autor": "Adam Martin", "date": "August 15th 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/dummies-guide-to-cyber-warfare/380", "team": [], "externalTeam": [], "html": "<div><p>World of Warcraft ain't got nothing on this (via <a href='http://www.slate.com/id/2197514'>Slate<\/a>):<\/p><br/><p>Why spend a billion schmillions on an invisible jet tank with nuclear gills when you could just call upon the patriotism of your countries hackers and Spam Lords (for it is they who send me missives about Angelina in a mud bath) and get them to turn on your enemy with ‘denial of service attacks'.<\/p><br/><img title='Image by Some Guy' src='http://img.ffffound.com/static-data/assets/6/2f0999058c8bcf2ac0b6a07813d757a9e0ac1073_m.jpg' style='border: 7px solid rgb(231, 231, 231); margin-left: 10px; float: right;' /><p>‘As Russian and Georgian troops fight on the ground, there's a parallel war happening in cyberspace. In recent weeks, Georgia's government Web sites have been besieged by denial-of-service attacks and acts of vandalism. Just like in traditional warfare, there's a lot<span id='more-380'><\/span> of confusion about what's going on in this technological battle—nobody seems to know whether this is a centralized Russian attack, the work of a loose band of hackers, or something else. Having read so many contradicting accounts, I knew that the only reliable way to find out what was really happening was to enlist in the Russian digital army myself.<\/p><br/><p>Don't get me wrong: My geopolitical sympathies, if anything, lie with Moscow's counterparts. Nor do I see myself as an Internet-savvy Rambo character. I had a much simpler research objective: to test how much damage someone like me, who is quite aloof from the Kremlin physically and politically, could inflict upon Georgia's Web infrastructure, acting entirely on my own and using only a laptop and an Internet connection. If I succeeded, that would somewhat contradict the widely shared assumption—at least in most of the Western media—that the Kremlin is managing this cyberwarfare in a centralized fashion. My mission, if successful, would show that the field is open to anyone with a grudge against Georgia, regardless of their exact relationship with state authorities.‘<\/p><br/><\/div>", "thumb": "material/Blog/dummies.jpg"}, {"id": 9, "category": ["All", "2 Minute Critique"], "title": "The Formula", "autor": "Adam Martin", "date": "August 15th 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/the-formula/379", "team": [], "externalTeam": [], "html": "<div><p>Natasha Vargas-Cooper writes a razor like critique of the rise and fall of the Lad's Mag, entitled <a href='http://www.radaronline.com/features/2008/08/fall_of_mens_magazines_playboy_maxim_fhm_esquire_01.php'>Twilight of the Rods<\/a>. When the boobs don't work, blame the internet:<\/p><br/><p>‘For publishers in the halcyon days of the late 1990s—those days before the Internet was blamed for robbing media moguls of their precious ad revenues—there existed a magical recipe that could build you a glossy magazine empire almost overnight. The concoction was simply named The Formula.<\/p><br/><img title='Image by Some Guy' src='http://img.ffffound.com/static-data/assets/6/1558925ee9935383da6b45a597acf68c8ddc8131_m.jpg' style='border: 7px solid rgb(231, 231, 231); margin-left: 10px; float: right;'/><p>The Formula's ingredients were as follows:<\/p><br/><p>3 scantily clad B-list starlets<br/>1 two-hundred word sex advice feature<br/>1 personal benefit/service feature<br/> “gritty read”(legitimately researched, well written<span id='more-379'><\/span>, and at the back of the magazine)<br/>1 humor piece whose punch line might include the term “pierced taco”<\/p><br/><p>These were the ingredients of Maxim, FHM, and Stuff, the so-called “lad-mags.” In 1999, the lads came and conquered. They blew off their humorless women's lib oppressors, sneered at the campy “high-brow” men's mags like GQ and Esquire and enjoyed explosive circulation. With their markets threatened, the tanned cheesecake men's magazines had to defend themselves against these young Turks. In no time, the “high-brows” started slashing column space and defiling their articles with words like “dude” and “bro.” Even Playboy, the Grand Pooh-Bah of classy girlie mags, began watering down its genuinely rich literary tradition, pumping out pea-sized articles like artillery shells.<\/p><br/><p>By 2002, the most successful of the bawdy bro-rags peaked at an impressive 2.5 million copies in paid circulation. “And let me tell you, I have never found that statistic more dispiriting than I do today,” lamented former Maxim editor David Itzkoff, in a 2004 tell-all piece in the New York Press.<\/p><br/><p>Itzkoff bemoaned Maxim's abuse of The Formula, its abysmal content, and eventual decline into a cynical ad revenue machine. Itzkoff indulged in his share of hand-wringing. But, like a true lad, he refused to man up and punted much of the blame to the greedy suits.<\/p><br/><p>Itzkoff pulled out of Maxim right as the porn-lite kingdom started to collapse. While moving 2.5 million copies was no small feat, circulation has been stagnant since. Ad revenues plunged 34 percent in 2007 (in a single year!) and the New York Post estimated that the magazine devoured over $110 million of its publisher's money in its eight years of existence. If Maxim merely went limp, its cruder little brothers, FHM and Stuff, went into a full-on revenue death spiral. In 2007, both shut down print production and settled into the seedy world of online-only content. 02_80828981_10.jpg <br/>(Photo: Getty Images) <br/><\/p><br/><p>Maxim continues to milk The Formula for all its worth while the other more “sophisticated” men's magazines grasp for their identity, stuck somewhere between adolescent towel-snapping and enlightened conversations about manhood. So it is that American men are left with soulless sex advice, perfunctory fashion spreads, toothless journalism, and a couple buxom bodies from reality TV squished in between the ads.<\/p><br/><p>Some ascribe the failure of men's magazines to the Internet. Others blame feminism. Still others blame Girls Gone Wild auteur Joe Francis for polluting the field. But it's really about the purgatory between Lad and Dad, which leaves the males of our generation scratching their heads and asking: are we not MEN?<\/p><br/><p>No need to renew your subscription. Click through the flaccid catalog of misfires after the <a href='http://www.radaronline.com/features/2008/08/fall_of_mens_magazines_playboy_maxim_fhm_esquire_02.php'>jump<\/a>!'<\/p><br/><\/div>", "thumb": "material/Blog/formula.jpg"}, {"id": 10, "category": ["All", "2 Minute Critique"], "title": "Rate My Poo", "autor": "Adam Martin", "date": "August 14th 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/rate-my-poo/377", "team": [], "externalTeam": [], "html": "<div><p>Yann is our French intern. Yann is very clever and very organised. Yann isn't going anywhere! But sometimes people do strange things and I feel the need to share, only so my mental torment is dissipated slightly by the knowledge others share it.<\/p><br/><p>By way of back story, David and I were reaquainting ourselves with the ex-girlfriend stalker hell that is Facebook and I chose to tell him via Facebook IM that my daughter did a big poo this morning just as the midwife arrived to examine my wife and that the house smelt. There is more detail, but I'll leave it at that for now.<\/p><br/><p>Forward, 20 minutes or so later, much real business has been discussed in this time, notably the wonders of <a href='http://qik.com/'>Qik<\/a> and excitement about our first iPhone App.<\/p><br/><p>Yann, David and I are all conversing via the Skypetron. Simultaneously both send me a link:<\/p><br/><p><a href='http://www.ratemypoo.com/'>www.ratemypoo.com<\/a><\/p><br/><p>In my wisdom I click away, twice. My eyes pop, my stomach churns, I'm looking at someone else's poo in a bowl, thankfully partially obscured by toilet paper.<\/p><br/><p>I respond to Yann and David:<\/p><br/><p><em>Me: I feel sick<\/em><\/p><br/><p><em>Yann: Me too, I found this when trying to find if the verb is written ‘to poo' or ‘to poop'.<\/em><\/p><br/><p>You got to admire the grammatical dedication.<\/p><br/><p><img src='http://sprinklebrigade.com/images/gallery/law-order.jpg' alt=''/><\/p><br/><p>Picture from the staggering <a href='http://sprinklebrigade.com/'>Sprinkle Brigade<\/a>.<\/p><br/><p>UPDATE: Whilst getting the url for Qik, whose tagline is 'see what happens', I was confronted by a hand towel in a bathroom and then a man masturbating furiously.<\/p><br/><p>This is turning into a morning that requires some mental erasing.<\/p><br/><\/div>", "thumb": "material/Blog/rate.jpg"}, {"id": 11, "category": ["All", "2 Minute Critique", "Appvertising"], "title": "Why Digital Marketing Needs a Reboot", "autor": "Adam Martin", "date": "July 23rd 2008 ", "link": "http://fat-man-collective.com/blog/2-minute-critique/why-digital-marketing-needs-a-reboot/364", "team": [], "externalTeam": [], "html": "<div><br/><p>David Armano (<a href=\"http://darmano.typepad.com/\">Logic + Emotion<\/a>) writes:<\/p><br/><p>‘Once upon a time, newspapers, TV and radio entered our lives. These wonderful inventions spawned yet another one — multichannel advertising. Then along came things like DVRs and everything digital, which spawned yet another invention, the backlash of traditional advertising. For the record, traditional advertising isn't going away anytime soon, and despite the pronouncement of its death, it will <a href=\"http://img.ffffound.com/static-data/assets/6/502a05ea10385ebe3c42b125b83e5848e32cc671_m.gif\"><img title=\"Image by Some Guy\" src=\"http://img.ffffound.com/static-data/assets/6/502a05ea10385ebe3c42b125b83e5848e32cc671_m.gif\" style=\"border: 7px solid rgb(231, 231, 231); margin-left: 10px; float: right;\" /><\/a> live on — albeit in an evolved format. And it actually still works. I look at billboards on highways.(via AdAge) How can you not?<\/p><br/><p>But “tradigital” could be another story. Tradigital, in my opinion, means using traditional marketing methods in<span id=\"more-364\"><\/span> the digital space. For example, creating an advertising campaign and “extending it digitally” usually ends up as a checklist. Micro-site? Check. Online banners? Check. Social media? Check. Mobile? Check. But these days, I'm thinking digital people have even tougher challenges than our traditional cousins. And “tradigitalists” may have it toughest of all. Why? Because some of us on the digital side have become just as set in our ways as our traditional counterparts.<\/p><br/><p>Old habits die hard. While consumers are out there spending countless hours on social networks, file-sharing applications, chat, community sites, buying stuff, selling stuff and using multiple devices, some of us tradigital old fogies are still reaching for our beloved toolbox of the past in the hopes of getting their attention. While online user behavior tells us that people respond well to simplicity, we labor to create complexity in the form of experimental navigation and sites that take forever to load. When YouTube arrived on the scene, we responded by putting our TV spots on it or — better yet — creating spots that looked like they were made by amateurs. Little did we know that the real action happens in the comments. Have we thought about talking back to people, or are we really just interested in telling our stories?<\/p><br/><p>And what about online gaming? It's a fixture for tradigitalists. Yet, many popular online games weren't created by agencies and don't have brands associated with them. Scrabulous, anyone? I don't follow Cannes closely, but with a few exceptions it seems to reward “tradigital” creativity. How clever was the idea? How good was the storytelling? These are all hallmarks of creativity, but I also see creativity as solving business problems. I really like My Starbucks Idea, because I think Starbucks will gain insights from the feedback they get there — these insights may eventually contribute to Starbucks re-capturing some of the loyalty they once enjoyed, and that could reflect well upon their stock price. Would My Starbucks Idea win a Cyber Lion? I really don't know. It's not flashy, it's not terribly original (Dell did it already) and hey, where's the sound effects? But if Starbucks plays its cards right, it could become a powerful tool for turning their ship around.<\/p><br/><p>It's time to come to terms with how people really use the web (hint — it might not be to figure out your experimental navigation) and how we can harness the true power of digital. Digital marketing doesn't need more tradigital creativity — it needs more creative problem solving. It just might be time for the industry to reboot.'<\/p><br/><\/div>", "thumb": "material/Blog/digimarket.jpg"}, {"id": 12, "category": ["All", "Art"], "title": "Ka-Pow", "autor": "Adam Martin", "date": "July 30th 2008 ", "link": "http://fat-man-collective.com/blog/art/ka-pow/360", "team": [], "externalTeam": [], "html": "<div><p>Hot day of brain ache, less words more pictures, thanks Batman:<img src=\"http://img.ffffound.com/static-data/assets/6/af23ec62358e327ce20bf497bec934f898eaf17e_m.jpg\" /><\/p><br/><\/div>", "thumb": "material/Blog/batman.jpg"}, {"id": 13, "category": ["All", "Data Vizualisation"], "title": "Barclay's Booze Boring Cigarettes", "autor": "Adam Martin", "date": "July 17th 2008 ", "link": "http://fat-man-collective.com/blog/branding-general/barclays-booze-boring-cigarettes/356", "team": [], "externalTeam": [], "html": "<div><br/><p>A collective experiment in brand perception, by querying online participants for keywords as a first reaction on a collection of popular brand logos. The collective results per individual brand are displayed as simple tag clouds. (via <a href=\"http://infosthetics.com/archives/2008/07/brand_tags_collaborative_word_clouds.html\">InfoAesthetics<\/a>)<\/p><br/><p>Herewith a sample from the Barclay's tagcloud:<\/p><br/><p>Interesting to see ‘booze' and ‘cigarettes' alongside, ‘boring' and ‘british'.<\/p><br/><p><img src=\"http://farm4.static.flickr.com/3035/2676536301_86eba96124.jpg?v=0\" /><\/p><br/><\/div>", "thumb": "material/Blog/barclays.jpg"}, {"id": 14, "category": ["All", "Art"], "title": "Uncivil Society", "autor": "Adam Martin", "date": "July 17th 2008 ", "link": "http://fat-man-collective.com/blog/art/uncivil-society/355", "team": [], "externalTeam": [], "html": "<div><p><img src=\"http://uncivilsociety.org/graf.jpg\" /><\/p><br/><\/div>", "thumb": "material/Blog/uncivil.jpg"}, {"id": 15, "category": ["All", "Data Vizualisation"], "title": "Homer's Snowdome", "autor": "Adam Martin", "date": "July 17th 2008 ", "link": "http://fat-man-collective.com/blog/data-visualization/homers-snowdome/3534", "team": [], "externalTeam": [], "html": "<div><br/><p>I've spent the last 10 minutes since the last post devouring Strange Maps, and with titles such as <a href=\"http://strangemaps.wordpress.com/2008/07/02/296-the-dykes-of-doggerland\">The Dykes of Doggerland<\/a> it's bowel obstructing stuff.<\/p><br/><p>Here is a sample from <a href=\"http://strangemaps.wordpress.com/2008/06/10/288-okeanos-and-oikoumene-homer%E2%80%99s-snowdome\">Okeanos and Oikoumene: Homer's Snowdome<\/a>:<\/p><br/><p>'Homer (not the slouch of Springfield heralding the end of Western civilization, but the blind, semi-mythical poet at the dawn of Greek history) was seen by Strabo and the Stoics as the father of geography. His overarching geographic concept was of the world as a flat, round disk of land, completely encircled by Okeanos, the world sea.<\/p><br/><p>All this was enclosed by the fixed dome of the Heavens, filled with cloud and mist close to the Earth, but with clear aether closer to the sky's dome. Sun, Moon and stars rose from the eastern waters of the Ocean, moved along the dome and sank again into the western waters. The whole thing is reminiscent of nothing so much as of one of those snowdomes that are the staple of any self-respecting tourist trap.<\/p><br/><p>This vision is expounded in the Iliad, in which Homer uses Achilles' shield, forged by Hephaestos, to metaphorically describe the universe as a circular island, surrounded by water. Human activities, celestial objects and stellar motions are described on the shield, which is actually a map, on the threshold between a purely mythological and an nascent scientific view of the world.<\/p><br/><p style=\"font-style:italic\">Homer's world vision is almost certainly meant to be symbolic rather than realistic – no ships are sailing on the all-encircling sea, which is intended to emphasise the unity of the Oikoumenè, the whole inhabited world. But this vision is based on real geographical knowledge, and shows the Greeks of the eighth century BC had a good grasp of the layout eastern Mediterranean – Homer's Iliad and especially his Odyssey are replete with references to routes and places, both real and imagined (or at least not yet identified).'<\/p><br/><img src=\"http://strangemaps.files.wordpress.com/2008/06/worldaccordingtohomer.jpg?w=700&amp;h=674\" /><\/div>", "thumb": "material/Blog/homer.jpg"}, {"id": 16, "category": ["All", "Data Vizualisation"], "title": "United States of GDP", "autor": "Adam Martin", "date": "July 17th 2008 ", "link": "http://fat-man-collective.com/blog/data-visualization/united-states-of-gdp/352", "team": [], "externalTeam": [], "html": "<div><br/><p>Everyone who know's me and some people do but they just don't know it yet, will know that I love maps and occasionally stats. So imagine my gross national product of joy when my colleague Philine sent me this:<\/p><br/><img src=\"http://strangemaps.files.wordpress.com/2007/06/350816052_0a392a0d28_o1.jpg\" /><p>From the <a href=\"http://strangemaps.wordpress.com/2007/06/10/131-us-states-renamed-for-countries-with-similar-gdps\">site<\/a>:<\/p><br/><p><em>'The creator of this map has had the interesting idea to break down that gigantic US GDP into the GDPs of individual states, and compare those to other countries' GDP. What follows, is this slightly misleading map – misleading, because the economies both of the US states and of the countries they are compared with are not weighted for their respective populations.'<\/em><\/p><br/><\/div>", "thumb": "material/Blog/us.jpg"}, {"id": 17, "category": ["All", "Art", "iphone"], "title": "If...", "autor": "Adam Martin", "date": "July 17th 2008 ", "link": "http://fat-man-collective.com/blog/art/if/351", "team": [], "externalTeam": [], "html": "<div><br/><p>...my iPhone was a plastic figurine it would look something like this and as I upgrade to Version 2.0 and watch all my tunes, contacts and diary settings disappear off a virtual white cliffs of Dover, this image pretty much sums it up:<br />(<a href=\"http://www.nigelgrimmer.com/\">Nigel Grimmer<\/a>)<\/p><br/><img src=\"http://farm4.static.flickr.com/3122/2676170827_202d4fec76.jpg?v=0\" /><\/div>", "thumb": "material/Blog/if.jpg"}, {"id": 18, "category": ["All", "Fat-Blog"], "title": "Visit the blog for more similar RANTING", "autor": "Adam Martin", "date": "August 8th 2008 ", "link": "http://fat-man-collective.com/blog", "team": [], "externalTeam": [], "html": "<div><br/><p>Visit the Blog @ <a href=\"http://fat-man-collective.com/blog\">http://fat-man-collective.com/blog<\/a><\/p><br/><p><b>'From the blog'<\/b> section is still very much in early stages. Due to tight deadlines, we did not connect this section directly to the Fat-Blog. In the coming weeks we will start to connect, so that users will be able to read the entire blog from within the flash site. Keep posted!<\/p><br/><img src=\"http://fat-man-collective.com/blog/imagedump/daveandmaya.jpg\" /><\/div>", "thumb": "material/Blog/fatman.jpg"}], "people": [{"id": "fernando", "name": "Fernando", "lastName": "Calvi", "company": "Fat-Man", "title": "Video", "description": "Motionographer.", "photo": "material/Collective/Fernando.jpg", "photoBack": "material/Collective/FernandoB.jpg", "city": "Barcelona"}, {"id": "ivan", "name": "Ivan", "lastName": "Alviar", "company": "Fat-Bitch", "title": "3D animation", "description": "CGI Designer", "photo": "material/Collective/Ivan.jpg", "photoBack": "material/Collective/IvanB.jpg", "city": "Bogota"}, {"id": "adam", "name": "Adam", "lastName": "Martin", "company": "Fat-Man", "title": "Management", "description": "Creative Technologist.\nStrategist.", "photo": "material/Collective/Adam.jpg", "photoBack": "material/Collective/AdamB.jpg", "city": "Lon
