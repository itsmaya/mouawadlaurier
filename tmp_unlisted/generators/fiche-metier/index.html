<script>
function boot() {
  // Scripts inline — React toujours disponible
  var e = React.createElement, useState = React.useState, useRef = React.useRef,
      useCallback = React.useCallback, useEffect = React.useEffect;

  // =========================================================================
  // TAILLES / MARGES / ÉPAISSEURS. Unité = "pixels carte" : la carte s'affiche
  // à 600x750px à l'écran mais s'exporte à 2250x2812px (EXPORT_SCALE=3.75),
  // la taille exacte des visuels TotalEnergies d'origine.
  // Conversion depuis une mesure prise sur l'image source (2250px) :
  // valeur_carte = valeur_mesurée * (600/2250)
  // =========================================================================
  // =========================================================================
  // FORMATS DISPONIBLES — chaque format définit ses propres dimensions et
  // tous les coefficients de layout sont dérivés proportionnellement.
  // La "base" est le format portrait original (750h) = référence absolue.
  // =========================================================================
  var FORMATS = {
    "portrait": {
      label: "Portrait (original)",
      outputW: 2250, outputH: 2812,
      aspect: 750 / 600,   // H/W
      platform: null
    },
    "square": {
      label: "Carré — LinkedIn / Instagram / X",
      outputW: 1080, outputH: 1080,
      aspect: 1,
      platform: "square"
    },
    "story": {
      label: "Story Instagram (9:16)",
      outputW: 1080, outputH: 1920,
      aspect: 1920 / 1080,
      platform: "story"
    }
  };

  // Format actif — sera dans le state React
  // On garde CARD_W fixe (600px) et on recalcule CARD_H selon le format choisi
  var CARD_W = 600;
  var LOGO_FILE = "../../assets/logos/logo-totalenergies.png";
  var PORTRAIT_OUTLINE_RATIO = 0.01;
  var TINT_OPACITY = 0.40;
  var BOTTOM_SHADOW_OPACITY = 0.80;

  // Calcule toutes les constantes de layout pour un format donné
  function getLayout(formatKey) {
    var fmt = FORMATS[formatKey] || FORMATS["portrait"];
    var CARD_H = Math.round(CARD_W * fmt.aspect);
    var EXPORT_SCALE = fmt.outputW / CARD_W;

    // Ratio de mise à l'échelle depuis le layout portrait de référence (H=750)
    var S = CARD_H / 750;   // scale vertical
    var Sw = CARD_W / 600;  // scale horizontal (= 1 toujours, CARD_W fixe)

    var FRAME_INSET  = 21.6 * Sw;
    var FRAME_BORDER = 2;
    var FRAME_RADIUS = 24 * Sw;
    var CONTENT_L    = 34.1 * Sw;
    var CONTENT_R    = 578.1 * Sw;
    var LOGO_W       = 72  * Sw;
    var LOGO_H       = 54.4 * Sw;
    var FLAG_W       = 81.6 * Sw;
    var FLAG_H       = 54.4 * Sw;
    var FLAG_BORDER  = FRAME_BORDER;
    var FLAG_RADIUS  = FRAME_RADIUS;
    var FLAG_RADIUS2 = 12 * Sw;

    // HEPP Portrait / HEPP Carré / HEPP Story
    // — Traits décoratifs autour du portrait —
    // TRAIT_DISTANCE : distance entre la silhouette et le point d'origine des traits
    // TRAIT_LENGTH   : longueur de chaque trait
    var TRAIT_DISTANCE = 40 * Sw;
    var TRAIT_LENGTH   = 26 * Sw;

    // HEPP Portrait / HEPP Carré / HEPP Story
    // — Badge (icône + label en haut à gauche) —
    // BADGE_TOP      : distance depuis le haut de la carte jusqu'au badge
    // BADGE_FONT     : taille du texte du label (ex: "WOMEN IN ENERGY")
    // BADGE_ICON_BOX : taille du carré de l'icône (largeur ET hauteur)
    // BADGE_ICON_SIZE: taille de l'icône SVG à l'intérieur du carré
    var BADGE_TOP      = 38 * S;
    var BADGE_FONT     = 15 * Sw;
    var BADGE_ICON_SIZE = 27 * Sw;
    var BADGE_ICON_BOX  = 48 * Sw;

    // Blocs du bas — position Y varie selon format
    var BLOCK_H, BOTTOM_Y, MISS_W, BLOCK_GAP, QUOTE_W;
    var MISS_FONT, QUOTE_FONT, TITLE_FONT, NAME_FONT;
    var TITLE_TOP;

    if (fmt.platform === "story") {
      BADGE_TOP = 33; // fixé en Story (pas * S) pour rester en haut

      // ─────────────────────────────────────────────────────────────────────
      // HEPP Story — Instagram Story 1080×1920 (9:16)
      // CARD_H ≈ 1000px (600 * 1920/1080). Toutes les valeurs ci-dessous
      // sont exprimées en "pixels carte" (base CARD_W=600).
      // ─────────────────────────────────────────────────────────────────────

      // HEPP Story — Position Y du bord supérieur des deux blocs du bas
      // (missions + citation). 0.70 = les blocs commencent à 70% de la hauteur.
      BOTTOM_Y  = CARD_H * 0.66;

      // HEPP Story — Hauteur des deux blocs du bas (missions + citation)
      BLOCK_H   = CARD_H * 0.30;

      // HEPP Story — Largeur du bloc missions (gauche).
      // QUOTE_W est calculé automatiquement pour remplir l'espace restant.
      MISS_W    = CARD_W * 0.45;
      BLOCK_GAP = 10 * Sw;
      QUOTE_W   = CARD_W - CONTENT_L - MISS_W - BLOCK_GAP - (CARD_W - CONTENT_R)-12;

      // HEPP Story — Taille de police des bullet missions (texte + mot-clé)
      MISS_FONT  = 21 * Sw;

      // HEPP Story — Taille de police de la citation (bloc blanc à droite)
      QUOTE_FONT = (81 / 3.75) * Sw * 1.2;

      // HEPP Story — Taille de police du titre de poste (ligne 1 sous le badge)
      TITLE_FONT = 43 * Sw;

      // HEPP Story — Taille de police du nom de la personne (ligne 2)
      NAME_FONT  = 28 * Sw;

      // HEPP Story — Position Y du badge et du bloc titre.
      // On fixe en valeurs absolues (pas * S) pour ne pas descendre comme en Portrait.
      TITLE_TOP  = 88;

    } else if (fmt.platform === "square") {

      // ─────────────────────────────────────────────────────────────────────
      // HEPP Carré — LinkedIn Post / Instagram / X Post 1080×1080 (1:1)
      // CARD_H = 600px. Toutes les valeurs ci-dessous en "pixels carte".
      // ─────────────────────────────────────────────────────────────────────

      // HEPP Carré — Position Y du bord supérieur des deux blocs du bas
      BOTTOM_Y  = CARD_H * 0.64;

      // HEPP Carré — Hauteur des deux blocs du bas
      BLOCK_H   = CARD_H * 0.3;

      // HEPP Carré — Largeur du bloc missions (gauche)
      MISS_W    = CARD_W * 0.50;
      BLOCK_GAP = 11.2 * Sw;
      QUOTE_W   = CARD_W - CONTENT_L - MISS_W - BLOCK_GAP - (CARD_W - CONTENT_R)-12;

      // HEPP Carré — Taille de police des bullet missions
      MISS_FONT  = 16 * Sw;

      // HEPP Carré — Taille de police de la citation
      QUOTE_FONT = (81 / 4.4) * Sw;

      // HEPP Carré — Taille de police du titre de poste
      TITLE_FONT = 33 * Sw;

      // HEPP Carré — Taille de police du nom
      NAME_FONT  = 20 * Sw;

      // HEPP Carré — Position Y du bloc titre
      TITLE_TOP  = 100 * S;

    } else {

      // ─────────────────────────────────────────────────────────────────────
      // HEPP Portrait — Format original 2250×2812 (3:4 approx.)
      // CARD_H = 750px. Valeurs mesurées directement sur le visuel source.
      // ─────────────────────────────────────────────────────────────────────

      // HEPP Portrait — Position Y du bord supérieur des deux blocs du bas
      BOTTOM_Y  = 535.5;

      // HEPP Portrait — Hauteur des deux blocs du bas
      BLOCK_H   = 175.5;

      // HEPP Portrait — Largeur du bloc missions (gauche)
      MISS_W    = 289.4;
      BLOCK_GAP = 11.2;

      // HEPP Portrait — Largeur du bloc citation (droite)
      QUOTE_W   = 231.2;

      // HEPP Portrait — Taille de police des bullet missions
      MISS_FONT  = 15;

      // HEPP Portrait — Taille de police de la citation
      QUOTE_FONT = 19;  // = 21.6px carte → 81px à l'export 2250px

      // HEPP Portrait — Taille de police du titre de poste
      TITLE_FONT = 37;

      // HEPP Portrait — Taille de police du nom
      NAME_FONT  = 20;

      // HEPP Portrait — Position Y du bloc titre
      TITLE_TOP  = 92;
    }

    return {
      CARD_H, EXPORT_SCALE,
      FRAME_INSET, FRAME_BORDER, FRAME_RADIUS,
      CONTENT_L, CONTENT_R,
      LOGO_W, LOGO_H, FLAG_W, FLAG_H, FLAG_BORDER, FLAG_RADIUS, FLAG_RADIUS2,
      TRAIT_DISTANCE, TRAIT_LENGTH,
      BADGE_TOP, BADGE_FONT, BADGE_ICON_SIZE, BADGE_ICON_BOX,
      BOTTOM_Y, BLOCK_H, MISS_W, BLOCK_GAP, QUOTE_W,
      MISS_FONT, QUOTE_FONT, TITLE_FONT, NAME_FONT, TITLE_TOP,
      TITLE_SHADOW: "none"
    };
  }

  function shade(hex, amt) {
    var c = hex.replace("#", "");
    if (c.length === 3) c = c.split("").map(function (x) { return x + x; }).join("");
    var n = parseInt(c, 16);
    var r = Math.max(0, Math.min(255, (n >> 16) + amt));
    var g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    var b = Math.max(0, Math.min(255, (n & 255) + amt));
    return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
  }

  // =========================================================================
  // Ajoute un contour blanc épais autour d'une photo détourée (PNG transparent).
  // On dessine le contour "en dur" sur un <canvas> (pixels réels) plutôt que
  // via un filtre CSS. Ce choix précède la bascule sur dom-to-image (qui,
  // lui, respecte les filtres) : on le conserve car dessiner le contour en
  // pixels réels reste plus prévisible d'un moteur à l'autre.
  // =========================================================================
  function addWhiteOutline(dataUrl, ratio) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var outline = Math.max(2, Math.round(w * ratio));

        var sil = document.createElement("canvas");
        sil.width = w; sil.height = h;
        var sctx = sil.getContext("2d");
        sctx.drawImage(img, 0, 0);
        sctx.globalCompositeOperation = "source-in";
        sctx.fillStyle = "#ffffff";
        sctx.fillRect(0, 0, w, h);

        var canvas = document.createElement("canvas");
        canvas.width = w + outline * 2;
        canvas.height = h + outline * 2;
        var ctx = canvas.getContext("2d");
        var steps = 24;
        for (var i = 0; i < steps; i++) {
          var angle = (i / steps) * Math.PI * 2;
          ctx.drawImage(sil, outline + Math.cos(angle) * outline, outline + Math.sin(angle) * outline);
        }
        ctx.drawImage(img, outline, outline);

        resolve({ dataUrl: canvas.toDataURL("image/png"), naturalW: canvas.width, naturalH: canvas.height });
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  // =========================================================================
  // POINT 6 — Calcule 6 points le long du contour réel de la silhouette
  // (3 à gauche, 3 à droite), avec leur direction normale (perpendiculaire
  // au contour, orientée vers l'extérieur). Ça sert à placer les petits
  // traits décoratifs automatiquement, quelle que soit la photo uploadée.
  //
  // Méthode : on redessine l'image (déjà détourée + contour blanc) en petit
  // sur un canvas d'analyse, on lit le canal alpha, et pour quelques lignes
  // choisies on repère le bord gauche / droit de la silhouette. La direction
  // du contour à cet endroit s'obtient en comparant sa position quelques
  // lignes au-dessus et en dessous (tangente), la perpendiculaire à cette
  // tangente donne la direction "vers l'extérieur" des petits traits.
  // =========================================================================
  function computeContourTraits(dataUrl) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var naturalW = img.naturalWidth, naturalH = img.naturalHeight;
        var aw = 260; // largeur d'analyse réduite (juste pour la détection, plus rapide)
        var ratio = aw / naturalW;
        var ah = Math.round(naturalH * ratio);

        var canvas = document.createElement("canvas");
        canvas.width = aw; canvas.height = ah;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, aw, ah);
        var data = ctx.getImageData(0, 0, aw, ah).data;

        function alphaAt(x, y) {
          if (x < 0 || x >= aw || y < 0 || y >= ah) return 0;
          return data[(y * aw + x) * 4 + 3];
        }
        function leftEdge(y) { for (var x = 0; x < aw; x++) if (alphaAt(x, y) > 20) return x; return NaN; }
        function rightEdge(y) { for (var x = aw - 1; x >= 0; x--) if (alphaAt(x, y) > 20) return x; return NaN; }

        // bornes verticales de la silhouette
        var top = NaN, bottom = NaN;
        for (var y = 0; y < ah; y++) { if (!isNaN(leftEdge(y))) { top = y; break; } }
        for (var y2 = ah - 1; y2 >= 0; y2--) { if (!isNaN(leftEdge(y2))) { bottom = y2; break; } }
        if (isNaN(top) || isNaN(bottom) || bottom - top < 10) { resolve({ naturalW: naturalW, naturalH: naturalH, points: [] }); return; }

        var dy = 10; // décalage utilisé pour estimer la tangente locale
        var points = [];

        function samplePoint(frac, side) {
          var row = Math.round(top + frac * (bottom - top));
          row = Math.max(top + dy, Math.min(bottom - dy, row));
          var edgeFn = side === "left" ? leftEdge : rightEdge;
          var x0 = edgeFn(row), xUp = edgeFn(row - dy), xDown = edgeFn(row + dy);
          if (isNaN(x0) || isNaN(xUp) || isNaN(xDown)) return null;

          // tangente locale (direction le long du contour)
          var tx = xDown - xUp, ty = 2 * dy;
          var tlen = Math.sqrt(tx * tx + ty * ty) || 1;
          tx /= tlen; ty /= tlen;

          // normale = tangente tournée de 90°, orientée vers l'extérieur du corps
          var nx = -ty, ny = tx;
          var outwardSign = side === "left" ? -1 : 1;
          if (Math.sign(nx || 1) !== outwardSign) { nx = -nx; ny = -ny; }

          // repasse en coordonnées natives de l'image (avant réduction pour l'analyse)
          return { x: x0 / ratio, y: row / ratio, nx: nx, ny: ny };
        }

        var pl = samplePoint(0.55, "left");  if (pl) points.push(pl);
        var pr = samplePoint(0.25, "right"); if (pr) points.push(pr);

        resolve({ naturalW: naturalW, naturalH: naturalH, points: points });
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

    format: "portrait",
    themeColor: "#48a0d1",
    badgeLabel: "WOMEN IN ENERGY",
    jobTitle: "HEAD OF LARGE SCALE H2",
    personName: "CRISTINA FERREIRA",
    bullets: [

        ? e("img", { src: state.flagImg, alt: "drapeau", style: { width: "100%", height: "100%", objectFit: "cover" } })
        : e("div", { style: { fontSize: 8, color: "rgba(255,255,255,0.75)", textAlign: "center", lineHeight: 1.3 } },
            "drapeau", e("br"), Math.round(FLAG_W * EXPORT_SCALE) + "×" + Math.round(FLAG_H * EXPORT_SCALE))
    );

    // Logo collé directement à gauche du drapeau, même ligne haute (FRAME_INSET)
    var logoSlot = e("div", {
      style: {
        position: "absolute", right: FRAME_INSET + FLAG_W+10, top: FRAME_INSET, width: LOGO_W, height: LOGO_H,
        background: "white", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", zIndex: 4
      }
    },
      e("img", {
        src: LOGO_FILE, alt: "TotalEnergies",
        style: { width: "88%", height: "78%", objectFit: "contain", display: logoOk ? "block" : "none" },
        onLoad: function () { setLogoOk(true); }, onError: function () { setLogoOk(false); }
      }),
      logoOk ? null : e("div", { style: { fontSize: 7.5, color: "#999", textAlign: "center", lineHeight: 1.25, padding: 2 } },
        Math.round(LOGO_W * EXPORT_SCALE) + "×" + Math.round(LOGO_H * EXPORT_SCALE), e("br"), LOGO_FILE)
    );

    var titleBlock = e("div", { style: { position: "absolute", left: CONTENT_L, top: TITLE_TOP, width: CONTENT_R - CONTENT_L, zIndex: 4 } },
      e("div", {
        style: {
          color: "white", fontWeight: 750, fontSize: TITLE_FONT, lineHeight: 1.2, whiteSpace: "pre-wrap",
          textTransform: "uppercase", textShadow: TITLE_SHADOW
        }
      }, state.jobTitle),
      e("div", { style: { color: "white", fontWeight: 700, fontSize: NAME_FONT, marginTop: 5, textTransform: "uppercase" } }, state.personName)
    );

    var frame = e("div", {
      style: {
        position: "absolute", left: FRAME_INSET, top: FRAME_INSET, right: FRAME_INSET, bottom: FRAME_INSET,
        border: FRAME_BORDER + "px solid white", borderRadius: FRAME_RADIUS, pointerEvents: "none", zIndex: 6
      }
    });


    /* ── SUPPRESSION DE FOND — Transformers.js RMBG-1.4 ── */
    /* Fix : cache du pipeline hors du render (sinon le modèle ~50 Mo était
       ré-instancié à chaque re-render du composant). */
    var removeBgPipeRef = useRef(null);
    function removeBg() {
      if (!state.portraitRaw) return;
      set("removingBg", true);
      var tf = window.__transformers;
      if (!tf) { alert("Transformers.js non disponible"); set("removingBg", false); return; }

      /* Charger l image originale d abord */
      var origImg = new Image();
      origImg.onload = function() {
        var W = origImg.naturalWidth, H = origImg.naturalHeight;

        Promise.resolve()
          .then(function() {
            if (removeBgPipeRef.current) return removeBgPipeRef.current;
            /* RMBG-1.4 : modèle de segmentation portrait, extrait le sujet principal */
            return tf.pipeline("image-segmentation", "briaai/RMBG-1.4", {device:"wasm"})
              .then(function(p){ removeBgPipeRef.current=p; return p; });
          })
          .then(function(pipe){
            /* Passer le base64 string directement — format accepté par RMBG-1.4 */
            return pipe(state.portraitRaw);
          })
          .then(function(result){
            console.log("RMBG result:", JSON.stringify(Object.keys(result[0]||{})));
            var item = result[0] || result;

            /* Transformers.js v3 peut retourner :
               - item.mask : RawImage avec .data (Uint8Array) + .width + .height
               - item.output : HTMLImageElement (PNG avec alpha)
               On gère les deux cas. */

            if (item.output && (item.output instanceof HTMLImageElement || item.output.tagName === "IMG")) {
              /* Cas simple : sortie déjà en PNG avec fond transparent */
              var outImg = item.output;
              var cv = document.createElement("canvas");
              cv.width = outImg.naturalWidth || W;
              cv.height = outImg.naturalHeight || H;
              var ctx = cv.getContext("2d");
              ctx.clearRect(0,0,cv.width,cv.height);
              ctx.drawImage(outImg,0,0);
              set("portraitRaw", cv.toDataURL("image/png"));
              set("removingBg", false);
              return;
            }

            /* Cas masque : on l applique manuellement */
            var mask = item.mask;
            if (!mask) throw new Error("Format de résultat inattendu : " + JSON.stringify(Object.keys(item)));

            /* Canvas destination : image originale */
            var cv = document.createElement("canvas");
            cv.width = W; cv.height = H;
            var ctx = cv.getContext("2d");
            ctx.drawImage(origImg, 0, 0);

            /* Canvas masque : redimensionné à W×H si nécessaire */
            var mCv = document.createElement("canvas");
            mCv.width = mask.width; mCv.height = mask.height;
            var mCtx = mCv.getContext("2d");
            /* mask.data est un Uint8Array (niveaux de gris) → convertir en RGBA */
            var mRaw = mask.data instanceof Uint8Array ? mask.data : new Uint8Array(mask.data);
            var mRGBA = new Uint8ClampedArray(mRaw.length * 4);
            for (var i=0; i<mRaw.length; i++){
              mRGBA[i*4]=255; mRGBA[i*4+1]=255; mRGBA[i*4+2]=255; mRGBA[i*4+3]=mRaw[i];
            }
            mCtx.putImageData(new ImageData(mRGBA, mask.width, mask.height), 0, 0);

            /* Appliquer le masque : destination-in = garde les pixels de origImg où masque > 0 */
            ctx.globalCompositeOperation = "destination-in";
            ctx.drawImage(mCv, 0, 0, W, H);

            set("portraitRaw", cv.toDataURL("image/png"));
            set("removingBg", false);
          })
          .catch(function(err){
            console.error("RemoveBG error:", err);
            alert("Suppression de fond : " + err.message);
            set("removingBg", false);
          });
      };
      origImg.onerror = function(){ set("removingBg",false); alert("Impossible de charger l image"); };
      origImg.src = state.portraitRaw;
    }

    /* ── TRADUCTION — proxy DeepL (api/translate.php) ── */
    /* Fix : le useState dupliqué est supprimé, translating_state est déjà
       déclaré en tête de composant. */
    function translate() {
      var tgt = state.langTarget || "FR";
      var src = tgt === "FR" ? "EN" : "FR";
      setTranslating(true);
      var bullets = (state.bullets||[]);
      var texts = [
        state.badgeLabel||"",
        state.jobTitle||"",
        state.quote||""
      ].concat(bullets.reduce(function(a,b){
        return a.concat([b.keyword||"", b.text||""]);
      },[]));
      fetch("../../api/translate.php",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({texts:texts,source_lang:src,target_lang:tgt})
      })
      .then(function(r){
        return r.text().then(function(txt){
          try{return JSON.parse(txt);}
          catch(e){throw new Error("Proxy : "+txt.slice(0,300));}
        });
      })
      .then(function(data){
        if(data.error) throw new Error(data.error);
        if(!data.translations) throw new Error("Verifier la cle DeepL dans api/translate.php");
        var t=data.translations.map(function(x){return x.text;});
        if(t[0]!==undefined) set("badgeLabel",t[0]);
        if(t[1]!==undefined) set("jobTitle",t[1]);
        if(t[2]!==undefined) set("quote",t[2]);
        var nb=bullets.map(function(b){return Object.assign({},b);});
        nb.forEach(function(b,i){
          if(t[3+i*2]!==undefined) nb[i].keyword=t[3+i*2];
          if(t[4+i*2]!==undefined) nb[i].text=t[4+i*2];
        });
        set("bullets",nb);
        set("langTarget",src);
        setTranslating(false);
      })
      .catch(function(err){
        alert("Traduction impossible : "+err.message);
        setTranslating(false);
      });
    }

    var card = e("div", {
      ref: cardRef,
      /* Cible du serveur d'export Puppeteer, comme les autres générateurs. */
      "data-export-card": "1", "data-ready": "1",
      style: { width: CARD_W, height: CARD_H, position: "relative", fontFamily: "Nunito, sans-serif", overflow: "hidden", background: "#333" }
    },
      bgLayer, tintLayer, portraitLayer, bottomShadow, missionsBlock, quoteBlock, badge, logoSlot, flagSlot, titleBlock, frame
    );

    // Calcul du scale pour le preview : on veut que la carte fasse max 560px de large
    // quelle que soit sa hauteur (format carré ou story, ça peut dépasser la fenêtre)
    var PREVIEW_MAX_W = 520;
    var PREVIEW_MAX_H = 680;
    var scaleByW = PREVIEW_MAX_W / CARD_W;
    var scaleByH = PREVIEW_MAX_H / CARD_H;
    var previewScale = Math.min(scaleByW, scaleByH);
    var previewDisplayW = Math.round(CARD_W * previewScale);
    var previewDisplayH = Math.round(CARD_H * previewScale);

    var cardScaled = e("div", {
      style: {
        width: previewDisplayW, height: previewDisplayH,
        position: "relative", overflow: "hidden"
      }
    },
      e("div", {
        style: {
          width: CARD_W, height: CARD_H,
          transform: "scale(" + previewScale + ")",
          transformOrigin: "top left",
          position: "absolute", top: 0, left: 0
        }
      }, card)
    );

    return e("div", { className: "app-layout" },
      /* Backdrop mobile (ferme le panneau au clic) */
      e("div", {
        className: "panel-backdrop" + (panelOpen ? " open" : ""),
        onClick: function() { setPanelOpen(false); }
      }),
      /* Bouton FAB mobile (ouvre le panneau) */
      e("button", {
        className: "panel-fab",
        onClick: function() { setPanelOpen(true); },
        "aria-label": "Ouvrir le panneau d'édition"
      },
        e("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2.5", strokeLinecap: "round" },
          e("line", { x1: "3", y1: "6", x2: "21", y2: "6" }),
          e("line", { x1: "3", y1: "12", x2: "15", y2: "12" }),
          e("line", { x1: "3", y1: "18", x2: "18", y2: "18" })
        )
      ),
      panel,
      e("div", { className: "preview-wrap" }, cardScaled)
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}

/* React et dom-to-image sont maintenant chargés en asynchrone : on ne démarre
   que lorsque la chaîne est prête. Le drapeau couvre les deux ordres possibles
   (libs prêtes avant ce script, ou l'inverse). */
SPGBoot.run(boot);
</script>
