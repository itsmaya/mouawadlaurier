function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,

    useLayoutEffect=React.useLayoutEffect;

/* ═══ LAYOUT CITATION ══════════════════════════════════════════════════════
   Carte rendue à CARD_W=1080px (comme Latest News), export Puppeteer natif.
   Valeurs originales (base 600px) multipliées par S=1080/600=1.8.
   ══════════════════════════════════════════════════════════════════════════ */
var CITE_S=CARD_W/600;  /* 1.8 — ratio de conversion depuis la référence 600px */

function getCiteLayout(format){
  var f=FORMATS[format]||FORMATS["1x1"];
  var S=CITE_S;
  var EX=f.outputW/CARD_W;  /* 1080/1080 = 1 */
  if(format==="4x5"){
    var ch=Math.round(f.cardH*(CARD_W/f.outputW));
    return{
      CARD_H:ch, EXPORT_SCALE:EX,
      BADGE_X:Math.round(32*S),  BADGE_TOP:Math.round(31*S),
      BADGE_ICON:Math.round(36*S), BADGE_GAP:Math.round(10*S),
      BADGE_H:Math.round(36*S),  BADGE_FONT:Math.round(12.5*S),
      BADGE_PADX:Math.round(18*S), BADGE_RADIUS:Math.round(9*S),
      MARGIN:Math.round(32*S),
      PERSON_X:Math.round(70*S), PERSON_Y:Math.round(136*S),
      PHOTO_W:Math.round(87*S),  PHOTO_H:Math.round(96*S),
      PHOTO_R:Math.round(10*S),
      PERSON_GAP:Math.round(7*S), PERSON_PADX:Math.round(22*S),
      NAME_FONT:Math.round(19*S), TITLE_FONT:Math.round(16.5*S),
      QUOTE_X:Math.round(70*S),  QUOTE_Y:Math.round(246*S),
      QUOTE_W:Math.round(469*S), QUOTE_PAD:Math.round(34*S),
      QUOTE_R:Math.round(13*S),  QUOTE_FONT:Math.round(19*S),
      QUOTE_LH:1.42,
      GUIL_H:Math.round(34*S), LOGO_H:Math.round(30*S),
      ARROW_W:px(T.ARROW_W_PT), ARROW_H:px(T.ARROW_H_PT),
    };
  }
  /* 1x1 et 9x16 */
  var ch2=(format==="9x16")?Math.round(CARD_W*(f.outputH/f.outputW)):CARD_W;
  return{
    CARD_H:ch2, EXPORT_SCALE:EX,
    BADGE_X:Math.round(30*S),  BADGE_TOP:Math.round(28*S),
    BADGE_ICON:Math.round(36*S), BADGE_GAP:Math.round(10*S),
    BADGE_H:Math.round(36*S),  BADGE_FONT:Math.round(12*S),
    BADGE_PADX:Math.round(17*S), BADGE_RADIUS:Math.round(9*S),
    MARGIN:Math.round(30*S),
    PERSON_X:Math.round(106*S), PERSON_Y:Math.round(129*S),
    PHOTO_W:Math.round(71*S),   PHOTO_H:Math.round(90*S),
    PHOTO_R:Math.round(10*S),
    PERSON_GAP:Math.round(9*S), PERSON_PADX:Math.round(20*S),
    NAME_FONT:Math.round(17.5*S), TITLE_FONT:Math.round(15*S),
    QUOTE_X:Math.round(106*S), QUOTE_Y:Math.round(227*S),
    QUOTE_W:Math.round(388*S), QUOTE_PAD:Math.round(32*S),
    QUOTE_R:Math.round(11*S),  QUOTE_FONT:Math.round(17.5*S),
    QUOTE_LH:1.42,
    GUIL_H:Math.round(31*S), LOGO_H:Math.round(26*S),
    ARROW_W:px(T.ARROW_W_PT), ARROW_H:px(T.ARROW_H_PT),
  };
}

/* ═══ GUILLEMETS ══════════════════════════════════════════════════════════ */
var GID=0;
function Guil(p){
  if(p.qstyle!=="chevron"){
    return e("img",{src:p.close?"../../templates/citation/ferme.png":"../../templates/citation/ouvert.png",
      alt:"",style:{height:p.h+"px",width:"auto",display:"block"}});
  }
  var id="gc"+(++GID);
  var VW=108,VH=74,SW=19;
  var d=p.close
    ?"M 64 10 L 88 37 L 64 64 M 20 10 L 44 37 L 20 64"
    :"M 44 10 L 20 37 L 44 64 M 88 10 L 64 37 L 88 64";
  var w=p.h*(VW/VH);
  return e("svg",{width:w,height:p.h,viewBox:"0 0 "+VW+" "+VH,style:{display:"block",overflow:"visible"}},
    e("defs",null,e("linearGradient",{id:id,x1:"0",y1:"0",x2:"1",y2:"0"},
      e("stop",{offset:"0%",stopColor:p.gradFrom||"#0098E3"}),
      e("stop",{offset:"100%",stopColor:p.gradTo||"#4632FF"}))),
    e("path",{d:d,fill:"none",stroke:"url(#"+id+")",strokeWidth:SW,strokeLinecap:"round",strokeLinejoin:"round"}));
}
function guilWidth(qstyle,h){ return qstyle==="chevron"?h*(108/74):h*1.28; }

/* ═══ BLOC CITATION ═══════════════════════════════════════════════════════
   Guillemets positionnés absolument mesurés via getClientRects.
   ══════════════════════════════════════════════════════════════════════════ */
function QuoteBody(props){
  var fs=props.fs,lh=props.lh,qs=props.qstyle,gh=props.guilH;
  var grad="linear-gradient(90deg,"+(props.gradFrom||"#0098E3")+" 0%,"+(props.gradTo||"#4632FF")+" 100%)";
  var gw=guilWidth(qs,gh);
  var GAP=fs*0.34;
  var ANCHOR=gw+GAP;

  var hostRef=useRef(null);
  var s0=useState({h:[],u:[],open:null,close:null,lastText:null,hostW:0});
  var M=s0[0],setM=s0[1];

  useEffect(function(){
    if(document.fonts&&document.fonts.ready)
      document.fonts.ready.then(function(){setM(function(m){return Object.assign({},m);});});
  },[]);

  useLayoutEffect(function(){
    var host=hostRef.current; if(!host) return;
    var base=host.getBoundingClientRect();
    var SC=host.offsetWidth?(base.width/host.offsetWidth):1;
    if(!SC||!isFinite(SC)||SC<=0) SC=1;
    function N(v){return v/SC;}
    var res={h:[],u:[],open:null,close:null,lastText:null,hostW:host.offsetWidth};
    host.querySelectorAll("[data-seg]").forEach(function(seg){
      var kind=seg.getAttribute("data-seg");
      var validRects=[];
      var rs=seg.getClientRects();
      for(var j=0;j<rs.length;j++){if(rs[j].width>=0.5)validRects.push(rs[j]);}
      validRects.forEach(function(r,j){
        var o={x:N(r.left-base.left),y:N(r.top-base.top),
               w:N(r.width),h:N(r.height),b:N(r.bottom-base.top),
               isFirst:j===0,isLast:j===validRects.length-1};
        if(kind==="h") res.h.push(o); else res.u.push(o);
      });
    });
    host.querySelectorAll("[data-part]").forEach(function(part){
      var rs2=part.getClientRects();
      for(var j=0;j<rs2.length;j++){
        var r=rs2[j]; if(r.width<0.5) continue;
        res.lastText={x:N(r.left-base.left),y:N(r.top-base.top),
          w:N(r.width),h:N(r.height),b:N(r.bottom-base.top),r:N(r.right-base.left)};
      }
    });
    var ao=host.querySelector("[data-anchor='open']");
    var ac=host.querySelector("[data-anchor='close']");
    if(ao){var ra=ao.getBoundingClientRect();res.open={x:N(ra.left-base.left),b:N(ra.bottom-base.top)};}
    if(ac){var rc=ac.getBoundingClientRect();res.close={x:N(rc.left-base.left),b:N(rc.bottom-base.top),y:N(rc.top-base.top)};}
    if(JSON.stringify(res)!==JSON.stringify(M)) setM(res);
  });

  var parts=parseRich(props.text||"");
  var H_PAD_X=fs*0.26, H_H=fs*1.12;
  var U_TH=Math.max(2,fs*0.17), U_OFF=fs*0.03;

  return e("div",{style:{position:"relative"}},
    M.h.map(function(r,i){
      var cy=r.y+r.h/2;
      var padL=r.isFirst?H_PAD_X:0, padR=r.isLast?H_PAD_X:0;
      return e("div",{key:"h"+i,style:{position:"absolute",
        left:r.x-padL,top:cy-H_H/2,width:r.w+padL+padR,height:H_H,
        background:grad,borderRadius:1,zIndex:0}});
    }),
    M.u.map(function(r,i){
      return e("div",{key:"u"+i,style:{position:"absolute",
        left:r.x,top:r.b-U_OFF,width:r.w,height:U_TH,
        background:grad,borderRadius:U_TH/2,zIndex:0}});
    }),
    e("div",{ref:hostRef,style:{position:"relative",zIndex:1,
        color:props.textColor||"#2B5AF1",fontSize:fs,lineHeight:lh,fontWeight:600}},
      e("span",{"data-anchor":"open",style:{display:"inline-block",
        width:qs!=="none"?ANCHOR:0,height:0,verticalAlign:"baseline"}}),
      parts.map(function(p,i){
        if(p.t==="h") return e("span",{key:i,"data-seg":"h","data-part":"1",
          style:{color:TE_WHITE,fontWeight:800}},p.v);
        if(p.t==="u") return e("span",{key:i,"data-seg":"u","data-part":"1"},p.v);
        return e("span",{key:i,"data-part":"1"},p.v);
      }),
      e("span",{"data-anchor":"close",style:{display:"inline-block",
        width:qs!=="none"?ANCHOR:0,height:0,verticalAlign:"baseline"}})),
    qs!=="none"&&M.open?e("div",{style:{position:"absolute",left:M.open.x,
        top:M.open.b-gh,width:gw,height:gh,zIndex:2}},
      e(Guil,{qstyle:qs,h:gh,close:false,gradFrom:props.gradFrom,gradTo:props.gradTo})):null,
    (function(){
      if(!M.close) return null;
      var lt=M.lastText, hw=M.hostW||0;
      var sameLine=lt?(M.close.b>=lt.y-1&&M.close.b<=lt.b+1):false;
      var fits=lt?(lt.r+GAP*0.5+gw<=hw+0.5):false;
      var left,top;
      if(sameLine&&fits){left=lt.r+GAP*0.5;top=lt.y;}
      else{left=Math.max(0,hw-gw);top=(lt?lt.b:M.close.b)-gh;if(!sameLine)top=M.close.b-gh;}
      return qs!=="none"?e("div",{style:{position:"absolute",left:left,top:top,width:gw,height:gh,zIndex:2}},
        e(Guil,{qstyle:qs,h:gh,close:true,gradFrom:props.gradFrom,gradTo:props.gradTo})):null;
    })()
  );
}

var BG_DIR="../../templates/citation/";
function bgCandidates(k){

}

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],_setSt=a0[1];

  /* Ctrl+Z */
  var histRef=useRef([]),histIdx=useRef(-1);
  function setSt(fn){
    _setSt(function(prev){
      var next=typeof fn==="function"?fn(prev):fn;
      if(JSON.stringify(next)===JSON.stringify(prev)) return prev;
      histRef.current=histRef.current.slice(0,histIdx.current+1);
      histRef.current.push(prev);
      if(histRef.current.length>30) histRef.current.shift();
      histIdx.current=histRef.current.length-1;
      return next;
    });
  }
  useEffect(function(){
    function onKey(ev){if((ev.ctrlKey||ev.metaKey)&&ev.key==="z"&&!ev.shiftKey){ev.preventDefault();
      if(histIdx.current<0)return;
      var p=histRef.current[histIdx.current];histIdx.current--;_setSt(p);}}
    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey);};
  },[]);

  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  var a4=useState({w:0,h:0}),bgNat=a4[0],setBgNat=a4[1];
  var cardRef=useRef(null),quoteBlockRef=useRef(null);
  var qhState=useState(100),quoteH=qhState[0],setQuoteH=qhState[1];
  var bsState=useState({s:"loading",p:null}),bgStatus=bsState[0],setBgStatus=bsState[1];
  function set(k,v){setSt(function(p){var c=Object.assign({},p);c[k]=v;return c;});}
  function setFormat(k){setSt(function(p){var c=Object.assign({},p);c.format=k;return c;});}

  /* Sauvegarde */
  var saveStore=useRef(null);
  if(!saveStore.current) saveStore.current=SaveManager.createStore("citation",{legacy:"citation_saves"});
  var smId=useState(null),currentId=smId[0],setCurrentId=smId[1];
  var smName=useState(""),currentName=smName[0],setCurrentName=smName[1];
  var smHash=useRef(null),smFolder=useRef("");
  var statusRootRef=useRef(null);
  var smDrawer=useState(false),drawerOpen=smDrawer[0],setDrawerOpen=smDrawer[1];
  var dirty=currentId!==null&&smHash.current!==null&&SaveManager.hashState(st)!==smHash.current;

  /* Onglets */
  var tabState=useState("fond"),activeTab=tabState[0],setActiveTab=tabState[1];
  var TABS=[{id:"fond",label:"Fond"},{id:"couleurs",label:"Couleurs"},
            {id:"personne",label:"Personne"},{id:"citation",label:"Citation"}];

  /* Photo personne par défaut */
  useEffect(function(){
    if(st.photo) return;
    tryLoadDefault(["../../templates/citation/TEMPLATE_PERSONNE.png"],
      function(dataUrl){setSt(function(p){if(p.photo)return p;var c=Object.assign({},p);c.photo=dataUrl;return c;});},
      function(){}
    );
  },[]);

  /* Fond par défaut */
  useEffect(function(){
    if(st.bgCustom) return;
    var k=st.format; setBgStatus({s:"loading",p:null});
    tryLoadDefault(bgCandidates(k),
      function(dataUrl,srcUrl){setSt(function(p){if(p.bgCustom||p.format!==k)return p;var c=Object.assign({},p);c.bgImg=dataUrl;c.bgIsDefault=true;return c;});setBgStatus({s:"ok",p:srcUrl});},

    e("div",{className:"panel-tab-content"+(activeTab==="citation"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Guillemets"),
      segBtn(st.quoteStyle,"quoteStyle",[{v:"curly",l:"\u201C\u201D  English"},{v:"chevron",l:"\u00AB\u00BB  Français"},{v:"none",l:"Aucun"}]),
      e("div",{style:{height:12}}),
      e("div",{className:"upload-hint",style:{marginBottom:6}},
        e("b",null,"**mot**")," = surlignage  •  ",e("b",null,"__mot__")," = soulignage"),
      e("textarea",{spellCheck:true,rows:7,value:st.quote,onChange:function(ev){set("quote",ev.target.value);},style:{fontSize:13,lineHeight:1.5}}),
      e("div",{style:{height:12}}),
      e("label",{className:"field-label"},
        "Taille du texte — "+Math.round(cfs/CITE_S)+" pt"+(st["fs_"+st.format]?"":"\u00a0(défaut)")),
      e("input",{type:"range",min:QUOTE_FONT_MIN,max:QUOTE_FONT_MAX,step:1,value:cfs,
        onChange:function(ev){setSt(function(p){var c=Object.assign({},p);c["fs_"+p.format]=parseInt(ev.target.value,10);return c;});}}),
      e("button",{onClick:function(){setSt(function(p){var c=Object.assign({},p);c["fs_"+p.format]=0;return c;});},
        style:{marginTop:4,fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:5,
          border:"1px solid #ddd",background:"#f5f5f5",cursor:"pointer",fontFamily:"inherit"}},
        "Réinitialiser"),
      e("div",{style:{height:12}}),
      e("label",{className:"field-label"},"Alignement horizontal"),
      segBtn(st.blockAlign,"blockAlign",[{v:"left",l:"← Gauche"},{v:"center",l:"↔ Centre"},{v:"right",l:"Droite →"}]),
      e("div",{style:{height:12}}),
      e("label",{className:"field-label"},((_rawY<0)?"Position native":"Position — bas à "+(L.CARD_H-(Math.round(targetTop)+quoteH))+"px du bord")),
      e("input",{type:"range",min:0,max:1000,step:1,
        value:_rawY<0?Math.round((targetTop-TOP_MIN)/Math.max(1,TOP_MAX-TOP_MIN)*1000)||500:_rawY,
        onChange:function(ev){set("blockYPct_"+st.format,parseInt(ev.target.value,10));}}),
      e("label",{className:"field-label",style:{marginTop:8}},
        "Largeur — "+curPct+"% ("+QW+" px)"+(st["blockPct_"+st.format]?"":"  — natif")),
      e("input",{type:"range",min:30,max:90,step:1,value:curPct,
        onChange:function(ev){set("blockPct_"+st.format,parseInt(ev.target.value,10));}}),
      e("button",{onClick:function(){set("blockYPct_"+st.format,-1);set("blockPct_"+st.format,0);},
        style:{marginTop:8,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:5,
          border:"1px solid #ddd",background:"#f5f5f5",cursor:"pointer",fontFamily:"inherit"}},
        "Réinitialiser position et largeur"),
      e("div",{style:{height:12}}),
      e("label",{className:"toggle"},
        e("input",{type:"checkbox",checked:!!st.showLogo,onChange:function(ev){set("showLogo",ev.target.checked);}}),
        "Logo en bas du bloc"),
      st.showLogo?e("div",{style:{marginTop:8}},
        e(FileDrop,{value:st.logoImg,onChange:function(v){set("logoImg",v);},placeholder:"Logo PNG transparent",small:true})):null,
      e("div",{className:"tab-nav"},
        e("button",{className:"tab-nav-btn",onClick:function(){setActiveTab("personne");}},"← ","Personne"),
        e("button",{className:"tab-nav-btn primary",onClick:doExport,disabled:busy},
          busy?e("span",{className:"spin"},e(DownloadIcon)):e(DownloadIcon),
          busy?"Export…":"Télécharger le PNG")))
  );

  /* Drawer */
  var drawer=e(SaveManager.Drawer,{
    store:saveStore.current,state:st,open:drawerOpen,
    onClose:function(){setDrawerOpen(false);},
    currentId:currentId,currentName:currentName,
    onLoad:function(rec){setSt(Object.assign({},DEFAULT,rec.state));setCurrentId(rec.id);setCurrentName(rec.name);smFolder.current=rec.folder||"";smHash.current=SaveManager.hashState(Object.assign({},DEFAULT,rec.state));},
    onSaved:function(rec){setCurrentId(rec.id);setCurrentName(rec.name);smFolder.current=rec.folder||"";smHash.current=SaveManager.hashState(st);}
  });

  return e("div",{className:"app-layout"},panel,e("div",{className:"preview-wrap"},previewWrap),drawer);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
