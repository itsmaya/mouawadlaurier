<script>
function boot(){

/* ═══ CHARTE TOTALENERGIES ════════════════════════════════════════════════ */
var TE_G_FROM="#0097E2", TE_G_TO="#4534FF";
var TE_GRAD="linear-gradient(90deg,"+TE_G_FROM+" 0%,"+TE_G_TO+" 100%)";
var TE_TEXT="#2B5AF1", TE_WHITE="#FFFFFF";

/* ═══ LAYOUT ══════════════════════════════════════════════════════════════ */
var CARD_W=600;
var FORMATS={"1x1":{label:"Carré 1:1",outputW:1080,outputH:1080,cardH:600},
             "4x5":{label:"Portrait 4:5",outputW:1080,outputH:1350,cardH:750}};

    GUIL_W:46,GUIL_H:34,LOGO_H:30};
  return{CARD_H:f.cardH,EXPORT_SCALE:f.outputW/CARD_W,
    BADGE_X:30,BADGE_Y:28,BADGE_ICON:36,BADGE_GAP:10,BADGE_H:36,BADGE_FONT:12,BADGE_PADX:17,BADGE_RADIUS:9,
    PERSON_X:106,PERSON_Y:129,PHOTO_W:71,PHOTO_H:90,PERSON_GAP:9,PERSON_PADX:20,PERSON_RADIUS:10,
    NAME_FONT:17.5,TITLE_FONT:15,
    QUOTE_X:106,QUOTE_Y:227,QUOTE_W:388,QUOTE_PAD:32,QUOTE_RADIUS:11,QUOTE_FONT:17.5,QUOTE_LH:1.42,
    GUIL_W:42,GUIL_H:31,LOGO_H:26};
}

/* ═══ PARSEUR ═════════════════════════════════════════════════════════════
   **mot** = surlignage    __mot__ = soulignage
   ══════════════════════════════════════════════════════════════════════════ */
function parseRich(t){
  var out=[],re=/(\*\*[\s\S]+?\*\*|__[\s\S]+?__)/g,last=0,m;
  while((m=re.exec(t))!==null){
    if(m.index>last) out.push({t:"n",v:t.slice(last,m.index)});
    out.push(m[0].slice(0,2)==="**"?{t:"h",v:m[0].slice(2,-2)}:{t:"u",v:m[0].slice(2,-2)});
    last=re.lastIndex;
  }
  if(last<t.length) out.push({t:"n",v:t.slice(last)});
  return out;
}

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect,
    useLayoutEffect=React.useLayoutEffect;

/* ═══ GUILLEMETS ══════════════════════════════════════════════════════════
   curly (EN)  → PNG ../../templates/citation/ouvert.png / ../../templates/citation/ferme.png
   chevron (FR)→ SVG « » épais, bouts arrondis, dégradé TE
                 « ouvrant = pointes vers la GAUCHE
                 » fermant = pointes vers la DROITE
   ══════════════════════════════════════════════════════════════════════════ */
var GID=0;
function Guil(p){
  if(p.qstyle!=="chevron"){
    return e("img",{src:p.close?"../../templates/citation/ferme.png":"../../templates/citation/ouvert.png",alt:"",
      style:{height:p.h+"px",width:"auto",display:"block"}});
  }
  var id="gc"+(++GID);
  var VW=108,VH=74,SW=19;
  var d = p.close
    ? "M 64 10 L 88 37 L 64 64 M 20 10 L 44 37 L 20 64"   /* » pointes à droite */
    : "M 44 10 L 20 37 L 44 64 M 88 10 L 64 37 L 88 64";  /* « pointes à gauche */
  var w = p.h*(VW/VH);
  return e("svg",{width:w,height:p.h,viewBox:"0 0 "+VW+" "+VH,
      style:{display:"block",overflow:"visible"}},
    e("defs",null,e("linearGradient",{id:id,x1:"0",y1:"0",x2:"1",y2:"0"},
      e("stop",{offset:"0%",stopColor:TE_G_FROM}),
      e("stop",{offset:"100%",stopColor:TE_G_TO}))),
    e("path",{d:d,fill:"none",stroke:"url(#"+id+")",strokeWidth:SW,
      strokeLinecap:"round",strokeLinejoin:"round"}));
}
function guilWidth(qstyle,h){ return qstyle==="chevron" ? h*(108/74) : h*1.28; }

/* ═══ BLOC CITATION ═══════════════════════════════════════════════════════
   Les surlignages / soulignages sont mesurés ligne par ligne puis dessinés
   comme des rectangles absolus. C'est ce qui rend l'export PNG fiable :
   html2canvas ne sait pas gérer box-decoration-break sur du texte inline.
   ══════════════════════════════════════════════════════════════════════════ */
function QuoteBody(props){
  var fs=props.fs, lh=props.lh, qs=props.qstyle, gh=props.guilH;
  var gw=guilWidth(qs,gh);
  var GAP=fs*0.34;
  var ANCHOR=gw+GAP;

  var hostRef=useRef(null);
  var s0=useState({h:[],u:[],open:null,close:null}); var M=s0[0],setM=s0[1];
  var s1=useState(0); var tick=s1[0],setTick=s1[1];

  /* Re-mesure quand les webfonts sont chargées */
  useEffect(function(){
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(function(){ setTick(function(t){return t+1;}); });
    }
  },[]);

  useLayoutEffect(function(){
    var host=hostRef.current; if(!host) return;
    var base=host.getBoundingClientRect();
    /* La preview est dans un conteneur transform:scale(). getBoundingClientRect
       renvoie donc des px ÉCRAN. On divise par le facteur d'échelle pour
       revenir en px CSS, sinon tout est décalé (et l'export l'est aussi). */
    var SC = host.offsetWidth ? (base.width/host.offsetWidth) : 1;
    if(!SC || !isFinite(SC) || SC<=0) SC=1;
    function N(v){ return v/SC; }

    var res={h:[],u:[],open:null,close:null,lastText:null,hostW:host.offsetWidth};
    var segs=host.querySelectorAll("[data-seg]");
    for(var i=0;i<segs.length;i++){
      var kind=segs[i].getAttribute("data-seg");
      var rs=segs[i].getClientRects();
      for(var j=0;j<rs.length;j++){
        var r=rs[j];
        if(r.width<0.5) continue;
        var o={x:N(r.left-base.left),y:N(r.top-base.top),
               w:N(r.width),h:N(r.height),b:N(r.bottom-base.top)};
        if(kind==="h") res.h.push(o); else res.u.push(o);
      }
    }
    /* dernier fragment de texte (toutes parties confondues) */
    var parts=host.querySelectorAll("[data-part]");
    for(var pi=0;pi<parts.length;pi++){
      var prs=parts[pi].getClientRects();
      for(var pj=0;pj<prs.length;pj++){
        var pr=prs[pj];
        if(pr.width<0.5) continue;
        res.lastText={x:N(pr.left-base.left),y:N(pr.top-base.top),
          w:N(pr.width),h:N(pr.height),b:N(pr.bottom-base.top),
          r:N(pr.right-base.left)};
      }
    }
    var ao=host.querySelector("[data-anchor='open']");
    var ac=host.querySelector("[data-anchor='close']");
    if(ao){var ra=ao.getBoundingClientRect();
      res.open={x:N(ra.left-base.left),b:N(ra.bottom-base.top)};}
    if(ac){var rc=ac.getBoundingClientRect();
      res.close={x:N(rc.left-base.left),b:N(rc.bottom-base.top),y:N(rc.top-base.top)};}
    if(JSON.stringify(res)!==JSON.stringify(M)) setM(res);
  });

  var parts=parseRich(props.text);

  /* Surlignage : hauteur réduite, centrée sur le texte */
  var H_PAD_X=fs*0.26;
  var H_H=fs*1.12;
  /* Soulignage : plus épais et plus proche du texte */
  var U_TH=Math.max(3,fs*0.17);
  var U_OFF=fs*0.03;

  return e("div",{style:{position:"relative"}},

    /* rectangles de surlignage (derrière le texte) */
    M.h.map(function(r,i){
      var cy=r.y+r.h/2;
      return e("div",{key:"h"+i,style:{position:"absolute",
        left:r.x-H_PAD_X, top:cy-H_H/2, width:r.w+H_PAD_X*2, height:H_H,
        background:TE_GRAD, borderRadius:1, zIndex:0}});
    }),

    /* barres de soulignage */
    M.u.map(function(r,i){
      return e("div",{key:"u"+i,style:{position:"absolute",
        left:r.x, top:r.b-U_OFF, width:r.w, height:U_TH,
        background:TE_GRAD, borderRadius:U_TH/2, zIndex:0}});
    }),

    /* le texte */
    e("div",{ref:hostRef,style:{position:"relative",zIndex:1,
        color:TE_TEXT,fontSize:fs,lineHeight:lh,fontWeight:600}},
      /* ancre invisible : réserve la place du guillemet ouvrant.
         hauteur 0 => la 1re ligne garde le même interligne que les autres */
      e("span",{"data-anchor":"open",
        style:{display:"inline-block",width:qs!=="none"?ANCHOR:0,height:0,verticalAlign:"baseline"}}),
      parts.map(function(p,i){
        if(p.t==="h") return e("span",{key:i,"data-seg":"h","data-part":"1",
          style:{color:TE_WHITE,fontWeight:800}},p.v);
        if(p.t==="u") return e("span",{key:i,"data-seg":"u","data-part":"1"},p.v);
        return e("span",{key:i,"data-part":"1"},p.v);
      }),
      e("span",{"data-anchor":"close",
        style:{display:"inline-block",width:qs!=="none"?ANCHOR:0,height:0,verticalAlign:"baseline"}})),

    /* guillemet ouvrant : bas aligné sur le bas de la 1re ligne */
    (qs!=="none"&&M.open)?e("div",{style:{position:"absolute",left:M.open.x,
      top:M.open.b-gh, width:gw, height:gh, zIndex:2}},
      e(Guil,{qstyle:qs,h:gh,close:false})):null,

    /* Guillemet fermant.
       - S'il reste de la place à droite de la dernière ligne de texte :
         on le pose juste après, HAUT aligné sur le haut de cette ligne.
       - Sinon : en bas à droite, BAS aligné sur le bas du texte. */
    (function(){
      if(!M.close) return null;
      var lt=M.lastText, hw=M.hostW||0;
      /* L'ancre a une hauteur 0 : son "bottom" EST la baseline de sa ligne.
         La baseline tombe entre le haut et le bas de la boîte de texte de
         cette même ligne — c'est ce test-là qui est fiable (comparer avec
         lt.b seul échoue toujours à cause du jambage descendant). */
      var sameLine = lt ? (M.close.b>=lt.y-1 && M.close.b<=lt.b+1) : false;
      var fits = lt ? (lt.r+GAP*0.5+gw <= hw+0.5) : false;
      var left, top;
      if(sameLine && fits){
        left = lt.r+GAP*0.5;
        top  = lt.y;                 /* haut de la dernière ligne */
      } else {
        left = Math.max(0, hw-gw);   /* collé à droite */
        top  = (lt?lt.b:M.close.b)-gh; /* bas aligné sur le bas du texte */
        if(!sameLine) top = M.close.b-gh;
      }
      return qs!=="none"?e("div",{style:{position:"absolute",left:left,top:top,
        width:gw,height:gh,zIndex:2}},
        e(Guil,{qstyle:qs,h:gh,close:true})):null;
    })()
  );
}

/* ─── FileDrop ─────────────────────────────────────────────────────────── */
function FileDrop(p){
  var r=useRef(null);
  function take(f){if(!f||!f.type||f.type.indexOf("image/")!==0)return;var rd=new FileReader();rd.onload=function(ev){p.onChange(ev.target.result);};rd.readAsDataURL(f);}
  return e("div",{className:"file-drop"+(p.small?" small":""),
    onClick:function(){if(r.current)r.current.click();},
    onDragOver:function(ev){ev.preventDefault();},
    onDrop:function(ev){ev.preventDefault();take(ev.dataTransfer.files[0]);}},
    p.value
      ?e(React.Fragment,null,
          e("img",{src:p.value,alt:""}),
          e("button",{className:"remove-btn",onClick:function(ev){ev.stopPropagation();p.onChange(null);}},
            e("svg",{viewBox:"0 0 16 16",width:14,height:14,fill:"none",stroke:"#666",strokeWidth:2},
              e("line",{x1:4,y1:4,x2:12,y2:12}),e("line",{x1:12,y1:4,x2:4,y2:12}))))
      :e("div",{className:"file-drop-empty"},
          e("svg",{viewBox:"0 0 24 24",width:20,height:20,fill:"none",stroke:"#a3a3a3",strokeWidth:1.5},
            e("rect",{x:3,y:3,width:18,height:18,rx:3}),
            e("circle",{cx:8.5,cy:8.5,r:1.5}),e("path",{d:"M21 15l-5-5L5 21"})),
          e("span",null,p.placeholder||"Cliquer ou déposer")),
    e("input",{ref:r,type:"file",accept:"image/*",style:{display:"none"},onChange:function(ev){take(ev.target.files[0]);}}));
}
function DownloadIcon(){return e("svg",{viewBox:"0 0 24 24",width:18,height:18,fill:"none",stroke:"currentColor",strokeWidth:2},e("path",{d:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"}),e("polyline",{points:"7 10 12 15 17 10"}),e("line",{x1:12,y1:15,x2:12,y2:3}));}

/* ═══ IndexedDB ════════════════════════════════════════════════════════════ */
var DB_NAME="wie_db",DB_VERSION=2,STORE="citation_saves";
function openDB(ok,ko){var q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=function(ev){var db=ev.target.result;if(!db.objectStoreNames.contains("saves"))db.createObjectStore("saves",{keyPath:"name"});if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"name"});};q.onsuccess=function(ev){ok(ev.target.result);};q.onerror=function(){ko&&ko();};}
function dbAll(cb){openDB(function(db){var q=db.transaction(STORE,"readonly").objectStore(STORE).getAll();q.onsuccess=function(ev){var a=ev.target.result||[];a.sort(function(x,y){return y.date>x.date?1:-1;});cb(a);};q.onerror=function(){cb([]);};},function(){cb([]);});}
function dbPut(en,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(en);t.oncomplete=cb||function(){};});}
function dbDel(n,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE)["delete"](n);t.oncomplete=cb||function(){};});}
function dbPutAll(a,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite"),s=t.objectStore(STORE);a.forEach(function(x){s.put(x);});t.oncomplete=cb||function(){};});}

/* ═══ STATE ════════════════════════════════════════════════════════════════ */
var DEFAULT={
  format:"1x1", quoteStyle:"curly", // Position et largeur par format
  blockYPct_1x1:-1, blockPct_1x1:0,
  blockYPct_4x5:-1, blockPct_4x5:0, badgeIcon:"../../assets/icons/iconeCharge.png",
  bgImg:"../../templates/citation/TEMPLATE_BACK2.png", bgBlur:0, bgDark:0,
  photo:"../../templates/citation/TEMPLATE_PERSONNE.png",
  name:"PATRICK POUYANNÉ", title:"Chairman & CEO\nof TotalEnergies",
  badge:"MORE ENERGY, LESS EMISSIONS",
  quote:"Our first challenge is to continue to **provide the energy the world needs** while __significantly reducing the emissions generated__ by our operations. One of our priorities remains **methane reduction,** with the ambition of achieving near-zero methane emissions by 2030.",
  showLogo:false, logoImg:"../../assets/logos/logo-totalenergies.png"
};

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],setSt=a0[1];
  var a1=useState([]),saves=a1[0],setSaves=a1[1];
  var a2=useState(""),sname=a2[0],setSname=a2[1];
  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  var cardRef=useRef(null),impRef=useRef(null),quoteBlockRef=useRef(null);
  /* Hauteur mesurée du bloc citation (mis à jour après chaque render) */
  var qhState=useState(100); var quoteH=qhState[0],setQuoteH=qhState[1];
  function set(k,v){setSt(function(p){var c=Object.assign({},p);c[k]=v;return c;});}
  var L=getLayout(st.format),CARD_H=L.CARD_H,EX=L.EXPORT_SCALE;
  /* Position verticale : 0–100%.
     0%  = position native du format
     50% = valeur par défaut (neutre)
     Le bas du bloc citation ne peut pas dépasser CARD_H - 5cm (189px). */
  var CM = 600/15.875;                        // px par cm sur la carte
  var BLOC_NATIVE_TOP = L.QUOTE_Y;            // position native
  var MAX_BOTTOM = L.CARD_H - 5*CM;           // 5cm du bord bas
  /* Position verticale : slider 0–1000 → 0.0–100.0%
     Contrainte : bas du bloc toujours entre (CARD_H-50) et (CARD_H-20).
     quoteH = hauteur réelle mesurée du bloc citation.
     BOTTOM_MIN = CARD_H - 50  (au moins 50px du bas)
     BOTTOM_MAX = CARD_H - 20  (au plus  20px du bas)
     topMin = BOTTOM_MIN - quoteH  → bord haut min
     topMax = BOTTOM_MAX - quoteH  → bord haut max
     Le slider choisit dans [topMin, topMax]. */
  /* ── POSITION VERTICALE DU BLOC CITATION ──────────────────────────
     Contraintes absolues en pixels sur la carte :
       TOP_MIN = bas du bloc personne + 10px  (haut du bloc citation)
       TOP_MAX = CARD_H - 20 - quoteH         (bas du bloc à 20px du bord)

     Valeur par défaut blockYPct=-1 = sentinel "position native du format".
     Quand l utilisateur bouge le slider, on passe à 0–1000 :
       0    → TOP_MIN (bloc collé sous la photo)
       1000 → TOP_MAX (bloc à 20px du bas)

     dY = targetTop - L.QUOTE_Y  (décalage depuis la position native)
     ──────────────────────────────────────────────────────────────── */
  /* Position et largeur selon le format actif */
  var _fmt = st.format==="4x5" ? "4x5" : "1x1";
  var _rawY = (st["blockYPct_"+_fmt]!==undefined) ? st["blockYPct_"+_fmt] : -1;
  var _rawW = st["blockPct_"+_fmt] || 0;
  var autoPct = Math.round(L.QUOTE_W/CARD_W*100);
  var curPct  = _rawW || autoPct;
  curPct = Math.max(30, Math.min(90, curPct));
  var QW = Math.round(CARD_W*curPct/100);
  var dW = QW - L.QUOTE_W;   /* décalage utilisé pour recentrer les blocs */

  /* TOP_MIN = 10px sous le badge (le "titre") */
  var TOP_MIN = L.BADGE_Y + L.BADGE_H + 10 + L.PHOTO_H + 10;
  var TOP_MAX = L.CARD_H - 20 - quoteH;
  if (TOP_MAX < TOP_MIN) TOP_MAX = TOP_MIN;

  var raw = _rawY;
  var targetTop;
  if (raw < 0) {
    /* Sentinel : position native du format, clampée dans la plage */
    targetTop = Math.max(TOP_MIN, Math.min(TOP_MAX, L.QUOTE_Y));
  } else {
    /* Slider 0–1000 : 0 = juste sous le badge, 1000 = 20px du bas */
    targetTop = TOP_MIN + (raw / 1000) * (TOP_MAX - TOP_MIN);
  }
  var dY = Math.round(targetTop - L.QUOTE_Y);
  useEffect(function(){dbAll(function(a){setSaves(a);});},[]);

  /* Mesure la hauteur réelle du bloc citation après chaque render.
     Déclenche un re-render si elle change (texte ou largeur modifiés). */
  useLayoutEffect(function(){
    if(!quoteBlockRef.current) return;
    var SC=quoteBlockRef.current.getBoundingClientRect().height
           /quoteBlockRef.current.offsetHeight;
    var h=Math.round(quoteBlockRef.current.offsetHeight||
             quoteBlockRef.current.getBoundingClientRect().height/(SC||1));
    if(h>0 && h!==quoteH) setQuoteH(h);
  });

  function save(){var n=sname.trim()||("Version "+new Date().toLocaleString("fr-FR"));dbPut({name:n,date:new Date().toISOString(),state:st},function(){dbAll(function(a){setSaves(a);});});setSname("");}
  function load(en){setSt(Object.assign({},DEFAULT,en.state));}
  function del(n){dbDel(n,function(){dbAll(function(a){setSaves(a);});});}
  function expJson(){dbAll(function(a){var b=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});var l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="citation-sauvegardes.json";l.click();});}
  function impJson(f){if(!f)return;var r=new FileReader();r.onload=function(ev){try{var a=JSON.parse(ev.target.result);var ok=a.filter(function(x){return x&&x.name&&x.state;});if(!ok.length)throw new Error("aucune entrée valide");dbPutAll(ok,function(){dbAll(function(m){setSaves(m);alert(ok.length+" sauvegarde(s) importée(s).");});});}catch(er){alert("Fichier invalide ("+er.message+").");}};r.readAsText(f);}

  /* ─── Export PNG ──────────────────────────────────────────────────────── */
  var doExport=useCallback(function(){
    if(!cardRef.current)return;
    setBusy(true);
    function preBlur(src,w,h,px,done){
      /* Rendu à la résolution OUTPUT (×EX) pour éviter tout upscale */
      if(!src) return done(null);
      var img=new Image();
      img.crossOrigin="anonymous";
      img.onload=function(){
        var OW=Math.round(w*EX), OH=Math.round(h*EX);
        var cv=document.createElement("canvas");
        cv.width=OW; cv.height=OH;
        var ctx=cv.getContext("2d");
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        if(px>0) ctx.filter="blur("+Math.round(px*EX)+"px)";
        var ir=img.naturalWidth/img.naturalHeight, cr=OW/OH, dw,dh;
        if(ir>cr){dh=OH*1.06;dw=dh*ir;}else{dw=OW*1.06;dh=dw/ir;}
        ctx.drawImage(img,(OW-dw)/2,(OH-dh)/2,dw,dh);
        done(cv.toDataURL("image/png"));
      };
      img.onerror=function(){done(null);};
      img.src=src;
    }
    var realH=Math.round(cardRef.current.getBoundingClientRect().height)||CARD_H;
    preBlur(st.bgImg,CARD_W,realH,st.bgBlur,function(blurred){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1";
      var cl=cardRef.current.cloneNode(true);
      cl.style.transform="none";cl.style.position="static";cl.style.width=CARD_W+"px";
      box.appendChild(cl);document.body.appendChild(box);
      if(blurred){var bg=cl.querySelector("[data-layer=bg]");
        if(bg){bg.style.backgroundImage="url("+blurred+")";bg.style.filter="none";bg.style.transform="none";}}

      /* ── Fixer la photo personne pour l'export ─────────────────────
         html2canvas ignore objectFit:cover et les transforms CSS sur <img>.
         On remplace l'<img> par un canvas offscreen qui contient la photo
         recadrée correctement (cover + centré sur le haut). */
      function fixPhotoForExport(done) {
        if (!st.photo) return done();
        var imgEl = cl.querySelector("[data-photo]");
        if (!imgEl) return done();
        var pw = parseInt(imgEl.getAttribute("data-pw")||L.PHOTO_W);
        var ph = parseInt(imgEl.getAttribute("data-ph")||L.PHOTO_H);
        var src = new Image();
        src.crossOrigin = "anonymous";
        src.onload = function() {
          var c2 = document.createElement("canvas");
          c2.width = pw * EX; c2.height = ph * EX;
          var x = c2.getContext("2d");
          x.imageSmoothingEnabled=true;
          x.imageSmoothingQuality="high";
          /* cover : remplir en conservant le ratio, ancré en haut */
          var ir = src.naturalWidth / src.naturalHeight;
          var cr = pw / ph;
          var dw, dh, dx, dy;
          if (ir > cr) { dh = ph*EX; dw = dh*ir; dx = (pw*EX-dw)/2; dy = 0; }
          else         { dw = pw*EX; dh = dw/ir; dx = 0; dy = 0; /* ancré haut */ }
          x.drawImage(src, dx, dy, dw, dh);
          /* Remplacer l'img par un vrai img avec le canvas en src */
          var rep = document.createElement("img");
          rep.src = c2.toDataURL("image/png");
          rep.style.cssText = "position:absolute;top:0;left:0;width:"+pw+"px;height:"+ph+"px;display:block;";
          imgEl.parentNode.replaceChild(rep, imgEl);
          done();
        };
        src.onerror = function() { done(); };
        src.src = st.photo;
      }

      fixPhotoForExport(function() {
        var captH=Math.round(cl.getBoundingClientRect().height)||realH;
        window.html2canvas(cl,{scale:EX,useCORS:true,allowTaint:false,
            backgroundColor:"#12203c",width:CARD_W,height:captH,
            windowWidth:CARD_W,windowHeight:captH})
          .then(function(cv){var a=document.createElement("a");
            a.download=(st.name||"citation").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+st.format+".png";
            a.href=cv.toDataURL("image/png");a.click();})
          .catch(function(er){console.error(er);alert("Erreur export : "+er.message);})
          .then(function(){document.body.removeChild(box);setBusy(false);});
      });
    });
  },[st,CARD_H,EX]);

  var previewScale=Math.min(520/CARD_W,(window.innerHeight-140)/CARD_H,1);

  /* ═══ CARTE ═══════════════════════════════════════════════════════════════ */
  /* Adaptation du texte personne à la largeur de la pilule.
     Stratégie :
       1. Mesurer le nom sur 1 ligne. Si ça tient → OK.
       2. Sinon chercher le meilleur point de coupure du nom (2 lignes).
          Si les 2 lignes tiennent → passer en whiteSpace:pre-wrap.
       3. Sinon réduire la fonte jusqu'à ce que tout tienne.
     Dans tous les cas : marge droite = marge gauche (PERSON_PADX). */
  var pillW  = QW - L.PHOTO_W - L.PERSON_GAP;
  var nFont  = L.NAME_FONT;
  var tFont  = L.TITLE_FONT;
  var nameDisplay = st.name; /* texte affiché : peut contenir \n si on coupe */
  var nameWrap    = "nowrap";
  (function(){
    try {
      var inner = Math.max(1, pillW - L.PERSON_PADX * 2);
      var cvs = document.createElement("canvas");
      var ctx = cvs.getContext("2d");
      function titleMaxW(fs){
        ctx.font = "400 " + fs + "px Nunito";
        return (st.title||"").split("\n").reduce(function(mx,l){
          return Math.max(mx, ctx.measureText(l).width);
        }, 0);
      }
      ctx.font = "900 " + L.NAME_FONT + "px Nunito";
      var nameW1 = ctx.measureText(st.name).width;
      var tW     = titleMaxW(L.TITLE_FONT);
      var maxW   = Math.max(nameW1, tW);

      if (maxW <= inner) return; /* tout tient sur 1 ligne, rien à faire */

      /* ── Étape 2 : essayer de couper le nom en 2 lignes ─────────── */
      var words = st.name.split(" ");
      if (words.length >= 2) {
        /* Trouver la coupure qui minimise max(ligne1, ligne2) */
        var bestCut = -1, bestMax = Infinity;
        for (var wi = 1; wi < words.length; wi++) {
          var l1 = ctx.measureText(words.slice(0,wi).join(" ")).width;
          var l2 = ctx.measureText(words.slice(wi).join(" ")).width;
          var mx = Math.max(l1, l2);
          if (mx < bestMax) { bestMax = mx; bestCut = wi; }
        }
        if (bestMax <= inner) {
          /* Le nom tient en 2 lignes — vérifier avec le titre aussi */
          var stillMaxW = Math.max(bestMax, tW);
          if (stillMaxW <= inner) {
            nameDisplay = words.slice(0,bestCut).join(" ") + "\n" + words.slice(bestCut).join(" ");
            nameWrap = "pre-line";
            return; /* résolu sans scale */
          }
        }
      }

      /* ── Étape 3 : réduire la fonte (avec nom potentiellement en 2 lignes) */
      /* Utiliser la meilleure coupure trouvée si elle existe */
      var nameForScale = nameDisplay; /* peut déjà avoir un \n */
      if (nameWrap === "nowrap" && words.length >= 2) {
        /* recalculer bestCut pour le scale */
        var bc = -1, bm = Infinity;
        for (var wj = 1; wj < words.length; wj++) {
          var la = ctx.measureText(words.slice(0,wj).join(" ")).width;
          var lb = ctx.measureText(words.slice(wj).join(" ")).width;
          var mm = Math.max(la, lb);
          if (mm < bm) { bm = mm; bc = wj; }
        }
        nameForScale = words.slice(0,bc).join(" ") + "\n" + words.slice(bc).join(" ");
        nameWrap = "pre-line";
      }
      /* Mesurer la ligne la plus longue du nom coupé */
      var nameWlines = nameForScale.split("\n");
      ctx.font = "900 " + L.NAME_FONT + "px Nunito";
      var nameWbest = nameWlines.reduce(function(mx,l){ return Math.max(mx,ctx.measureText(l).width); },0);
      var worstW = Math.max(nameWbest, tW);
      if (worstW > inner) {
        var scale = inner / worstW;
        nFont = L.NAME_FONT  * scale;
        tFont = L.TITLE_FONT * scale;
        nameDisplay = nameForScale;
      }
    } catch(ex) { /* canvas indisponible : on garde les valeurs natives */ }
  })();

  /* ── Alignement horizontal ──────────────────────────────────────
     left   → 20px du bord gauche
     center → position native du format (défaut)
     right  → 20px du bord droit */
  /* Marge de référence = bord gauche du badge (L.BADGE_X),
     pour que le bloc soit aligné avec le badge quel que soit le format. */
  var ALIGN_MARGIN = L.BADGE_X;
  var blockX, personX;
  if (st.blockAlign === "left") {
    blockX  = ALIGN_MARGIN;
    personX = ALIGN_MARGIN;
  } else if (st.blockAlign === "right") {
    blockX  = CARD_W - QW - ALIGN_MARGIN;
    personX = CARD_W - QW - ALIGN_MARGIN;
  } else {
    blockX  = L.QUOTE_X  - dW/2;
    personX = L.PERSON_X - dW/2;
  }

  var card=e("div",{ref:cardRef,style:{
    width:CARD_W,minHeight:CARD_H,position:"relative",
    fontFamily:"'Nunito',sans-serif",background:"#12203c",overflow:"hidden"}},

    e("div",{"data-layer":"bg",style:{position:"absolute",inset:0,
      backgroundImage:st.bgImg?"url("+st.bgImg+")":"none",
      backgroundSize:"cover",backgroundPosition:"center",
      filter:st.bgBlur>0?"blur("+st.bgBlur+"px)":"none",
      transform:st.bgBlur>0?"scale(1.06)":"none"}}),
    st.bgDark>0?e("div",{style:{position:"absolute",inset:0,background:"rgba(10,20,45,"+st.bgDark+")"}}):null,

    /* BADGE (position fixe, non affecté par le slider) */
    e("div",{style:{position:"absolute",left:L.BADGE_X,top:L.BADGE_Y,display:"flex",alignItems:"center",gap:L.BADGE_GAP}},
      e("div",{style:{width:L.BADGE_ICON,height:L.BADGE_ICON,borderRadius:L.BADGE_RADIUS,backgroundImage:"linear-gradient(90deg,#0097E2 0%,#4534FF 100%)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
        st.badgeIcon
          ?e("img",{src:st.badgeIcon,alt:"",style:{width:L.BADGE_ICON*0.64+"px",height:L.BADGE_ICON*0.64+"px",objectFit:"contain"}})
          :e("svg",{viewBox:"0 0 24 24",width:L.BADGE_ICON*0.56,height:L.BADGE_ICON*0.56,fill:TE_WHITE},
             e("path",{d:"M13.5 2 L5 13.2 h5.2 L9.6 22 L19 10.4 h-5.4 z"}))),
      e("div",{style:{height:L.BADGE_H,borderRadius:L.BADGE_RADIUS,backgroundImage:"linear-gradient(90deg,#0097E2 0%,#4534FF 100%)",display:"flex",alignItems:"center",padding:"0 "+L.BADGE_PADX+"px",color:TE_WHITE,fontWeight:800,fontSize:L.BADGE_FONT,letterSpacing:".055em",textTransform:"uppercase",whiteSpace:"nowrap"}},st.badge)),

    /* PERSONNE (décalée par le slider) */
    e("div",{style:{position:"absolute",left:personX,top:L.PERSON_Y+dY,display:"flex",alignItems:"stretch",gap:L.PERSON_GAP}},
      e("div",{style:{width:L.PHOTO_W+"px",height:L.PHOTO_H+"px",borderRadius:L.PERSON_RADIUS+"px",overflow:"hidden",flexShrink:0,position:"relative",background:"rgba(255,255,255,.14)"}},
        st.photo?e("img",{"data-photo":"1","data-pw":L.PHOTO_W,"data-ph":L.PHOTO_H,src:st.photo,alt:"",style:{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:"100%",height:"100%",objectFit:"cover",objectPosition:"center top",display:"block"}})
                :e("div",{style:{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:"rgba(255,255,255,.4)",fontSize:10,fontWeight:700,letterSpacing:".08em"}},"PHOTO")),
      e("div",{style:{height:L.PHOTO_H,borderRadius:L.PERSON_RADIUS,
          width:pillW+"px",
          backgroundImage:"linear-gradient(90deg,#0097E2 0%,#4534FF 100%)",
          display:"flex",flexDirection:"column",justifyContent:"center",
          padding:"0 "+L.PERSON_PADX+"px",boxSizing:"border-box",overflow:"hidden"}},
          e("div",{style:{color:TE_WHITE,fontWeight:900,fontSize:nFont,
            lineHeight:1.16,letterSpacing:".01em",whiteSpace:nameWrap}},nameDisplay),
          e("div",{style:{color:TE_WHITE,fontWeight:400,fontSize:tFont,
            lineHeight:1.28,whiteSpace:"pre-line",marginTop:3,
            overflow:"hidden"}},st.title))),

    /* BLOC CITATION (décalé + largeur ajustable par les sliders) */
    e("div",{ref:quoteBlockRef,style:{position:"absolute",left:blockX,top:L.QUOTE_Y+dY,width:QW,
        background:TE_WHITE,borderRadius:L.QUOTE_RADIUS,
        padding:L.QUOTE_PAD,paddingBottom:L.QUOTE_PAD+6,boxSizing:"border-box"}},
      e(QuoteBody,{text:st.quote,fs:L.QUOTE_FONT,lh:L.QUOTE_LH,
        qstyle:st.quoteStyle,guilH:L.GUIL_H,width:QW-L.QUOTE_PAD*2}),
      (st.showLogo&&st.logoImg)?e("div",{style:{marginTop:14,textAlign:"right"}},
        e("img",{src:st.logoImg,alt:"",style:{height:L.LOGO_H,objectFit:"contain"}})):null)
  );

  var previewWrap=e("div",{style:{width:CARD_W*previewScale,minHeight:CARD_H*previewScale,position:"relative",flexShrink:0}},
    e("div",{style:{width:CARD_W,transform:"scale("+previewScale+")",transformOrigin:"top left",position:"absolute",top:0,left:0}},card));

  /* ═══ PANNEAU ═══════════════════════════════════════════════════════════ */
  function segBtn(val,key,opts){
    return e("div",{className:"seg"},opts.map(function(o){
      return e("button",{key:o.v,className:val===o.v?"on":"",onClick:function(){set(key,o.v);}},o.l);
    }));
  }

  var panel=e("div",{className:"panel"},

    e("div",{className:"section"},e("h2",null,"Format"),
      e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        Object.keys(FORMATS).map(function(k){
          var f=FORMATS[k],on=st.format===k;
          /* vignette proportionnelle : hauteur fixe 30, largeur = 30/ratio */
          var vh=30, vw=Math.round(vh*(f.outputW/f.outputH));
          return e("div",{key:k,onClick:function(){set("format",k);},
            style:{display:"flex",alignItems:"center",gap:10,
              padding:"10px 12px",borderRadius:8,cursor:"pointer",
              border:on?"2px solid #1a1a1a":"2px solid #e8e8e8",
              background:on?"#f0efec":"#fafafa",transition:"all .15s"}},
            e("div",{style:{width:vw,height:vh,borderRadius:3,
              background:on?"#1a1a1a":"#ccc",flexShrink:0}}),
            e("div",null,
              e("div",{style:{fontWeight:700,fontSize:13,color:on?"#1a1a1a":"#333"}},f.label),
              e("div",{style:{fontSize:11,color:"#888",marginTop:1}},
                f.outputW+" × "+f.outputH+" px")));
        }))),

    e("div",{className:"section"},e("h2",null,"Image de fond"),
      e("div",{className:"upload-hint"},
        "Format idéal : ",e("b",null,"PNG/JPG, 1080×1080 ou 1080×1350 px")," • Défaut : ../../templates/citation/TEMPLATE_BACK2.png"),
      e(FileDrop,{value:st.bgImg,onChange:function(v){set("bgImg",v);},placeholder:"Photo de fond"}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Flou ("+st.bgBlur+" px)"),
      e("input",{type:"range",min:0,max:12,step:0.5,value:st.bgBlur,onChange:function(ev){set("bgBlur",parseFloat(ev.target.value));}}),
      e("label",{className:"field-label"},"Assombrissement ("+Math.round(st.bgDark*100)+" %)"),
      e("input",{type:"range",min:0,max:0.7,step:0.05,value:st.bgDark,onChange:function(ev){set("bgDark",parseFloat(ev.target.value));}})),

    e("div",{className:"section"},e("h2",null,"Badge"),
      e("input",{type:"text",spellCheck:true,value:st.badge,onChange:function(ev){set("badge",ev.target.value);}}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Icône du badge ","(PNG transparent, défaut = éclair)"),
      e(FileDrop,{value:st.badgeIcon,onChange:function(v){set("badgeIcon",v);},placeholder:"PNG transparent (défaut = ⚡)",small:true})),

    e("div",{className:"section"},e("h2",null,"Personne"),
      e("div",{className:"upload-hint"},
        "Format idéal : ",e("b",null,"PNG/JPG portrait 3:4 (~400×530 px)")," • Défaut : ../../templates/citation/TEMPLATE_PERSONNE.png"),
      e(FileDrop,{value:st.photo,onChange:function(v){set("photo",v);},placeholder:"Portrait",small:true}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Nom"),
      e("input",{type:"text",spellCheck:true,value:st.name,onChange:function(ev){set("name",ev.target.value.toUpperCase());},style:{textTransform:"uppercase"}}),
      e("div",{style:{height:8}}),
      e("label",{className:"field-label"},"Fonction ",e("span",{className:"hint"},"(Entrée = retour à la ligne)")),
      e("textarea",{spellCheck:true,rows:2,value:st.title,onChange:function(ev){set("title",ev.target.value);}})),

    e("div",{className:"section"},e("h2",null,"Guillemets"),
      segBtn(st.quoteStyle,"quoteStyle",[{v:"curly",l:"\u201C \u201D  English"},{v:"chevron",l:"\u00AB \u00BB  Français"},{v:"none",l:"Aucun"}]),
      e("div",{className:"hint",style:{marginTop:6}},
        "English utilise ../../templates/citation/ouvert.png / ../../templates/citation/ferme.png du dossier.")),

    e("div",{className:"section"},e("h2",null,"Citation"),
      e("div",{className:"upload-hint",style:{marginBottom:6}},
        e("b",null,"**mot**")," = surlignage  •  ",e("b",null,"__mot__")," = soulignage"),
      e("textarea",{spellCheck:true,rows:8,value:st.quote,onChange:function(ev){set("quote",ev.target.value);},style:{fontSize:13,lineHeight:1.5}})),

    e("div",{className:"section"},e("h2",null,"Alignement horizontal"),
      e("div",{className:"seg"},
        [{v:"left",l:"← Gauche"},{v:"center",l:"↔ Centre"},{v:"right",l:"Droite →"}].map(function(o){
          return e("button",{key:o.v,className:st.blockAlign===o.v?"on":"",
            onClick:function(){ set("blockAlign",o.v); }},o.l);
        }))),

    e("div",{className:"section"},e("h2",null,"Position et largeur"),
      e("div",{className:"hint",style:{marginBottom:6}},
        "Décale ensemble le bloc personne et le bloc citation."),
      e("label",{className:"field-label"},(raw<0?"Position native":"Position — bas à "+(L.CARD_H-(Math.round(targetTop)+quoteH))+"px du bord")),
      e("input",{type:"range",min:0,max:1000,step:1,
        /* si raw<0 (sentinel), on affiche le slider centré sur la position actuelle */
        value:_rawY<0?Math.round((targetTop-TOP_MIN)/(TOP_MAX-TOP_MIN)*1000)||500:_rawY,
        onChange:function(ev){set("blockYPct_"+st.format,parseInt(ev.target.value,10));}}),
      e("div",{style:{height:12}}),
      e("h2",null,"Largeur du bloc citation"),
      e("label",{className:"field-label"},
        curPct+" %  ("+QW+" px)"+(st.blockPct?"":"  — natif")),
      e("input",{type:"range",min:30,max:90,step:1,value:curPct,
        onChange:function(ev){set("blockPct_"+st.format,parseInt(ev.target.value,10));}}),
      e("button",{onClick:function(){set("blockYPct_"+st.format,-1);set("blockPct_"+st.format,0);},
        style:{marginTop:8,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:5,
          border:"1px solid #ddd",background:"#f5f5f5",cursor:"pointer",fontFamily:"inherit"}},
        "Réinitialiser position et largeur")),

    e("div",{className:"section"},e("h2",null,"Logo TotalEnergies"),
      e("label",{style:{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,cursor:"pointer"}},
        e("input",{type:"checkbox",checked:st.showLogo,onChange:function(ev){set("showLogo",ev.target.checked);},style:{accentColor:"#1a1a1a"}}),
        "Afficher le logo en bas du bloc"),
      st.showLogo?e("div",{style:{marginTop:10}},
        e(FileDrop,{value:st.logoImg,onChange:function(v){set("logoImg",v);},placeholder:"Logo (PNG transparent)",small:true})):null),

    e("div",{className:"section"},e("h2",null,"Sauvegardes"),
      e("div",{style:{display:"flex",gap:8,marginBottom:10}},
        e("input",{type:"text",spellCheck:true,value:sname,placeholder:"Nom de la version\u2026",onChange:function(ev){setSname(ev.target.value);},style:{flex:1,fontSize:13,padding:"6px 8px"}}),
        e("button",{onClick:save,style:{background:"#1a1a1a",color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit"}},"Sauvegarder")),
      saves.length===0?e("div",{className:"hint",style:{marginBottom:10}},"Aucune sauvegarde."):
        e("div",{className:"saves-list"},saves.map(function(v,i){
          return e("div",{key:i,className:"save-row"},
            e("div",{style:{flex:1,minWidth:0}},
              e("div",{style:{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},v.name),
              e("div",{className:"hint"},new Date(v.date).toLocaleString("fr-FR"))),
            e("button",{onClick:function(){load(v);},style:{background:"#f0efec",color:"#1a1a1a",border:"none",borderRadius:5,padding:"4px 10px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}},"Charger"),
            e("button",{onClick:function(){if(confirm("Supprimer \u00AB "+v.name+" \u00BB ?"))del(v.name);},style:{background:"#fff0f0",color:"#c0392b",border:"none",borderRadius:5,padding:"4px 8px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}},"\u00D7"));
        })),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:expJson,style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Export .json"),
        e("button",{onClick:function(){if(impRef.current)impRef.current.click();},style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Import .json"),
        e("input",{ref:impRef,type:"file",accept:".json",style:{display:"none"},onChange:function(ev){impJson(ev.target.files&&ev.target.files[0]);}}))),

    e("button",{className:"export-btn",onClick:doExport,disabled:busy},
      busy?e("span",{className:"spin"},e(DownloadIcon)):e(DownloadIcon),
      busy?"Export en cours\u2026":"Télécharger le PNG ("+FORMATS[st.format].outputW+" \u00D7 "+FORMATS[st.format].outputH+")")
  );

  return e("div",{className:"app-layout"},panel,e("div",{className:"preview-wrap"},previewWrap));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
