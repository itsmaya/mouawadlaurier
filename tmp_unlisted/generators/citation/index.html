<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Citation Post — TotalEnergies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>
function loadScript(u,d){var i=0;function n(){if(i>=u.length){console.error("No CDN",u);return;}var s=document.createElement("script");s.src=u[i++];s.onload=d;s.onerror=n;document.head.appendChild(s);}n();}
</script>
<script>
loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js","https://unpkg.com/react@18/umd/react.production.min.js","../../assets/vendor/react.production.min.js"],function(){
loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js","https://unpkg.com/react-dom@18/umd/react-dom.production.min.js","../../assets/vendor/react-dom.production.min.js"],function(){
loadScript(["https://cdn.jsdelivr.net/npm/dom-to-image-more@3.4.0/dist/dom-to-image-more.min.js","https://unpkg.com/dom-to-image-more@3.4.0/dist/dom-to-image-more.min.js","../../assets/vendor/dom-to-image-more.min.js"],function(){boot();});});});
</script>
<script src="../../assets/header.js"></script>
<script>window.PICTO_BASE="../../assets/";</script>
<script src="../../assets/pictos.js"></script>
<script src="../../assets/save-manager.js"></script>
<script src="../../assets/charte-2026.js"></script>
<script src="../../assets/te-charte.js"></script>
<script src="../../assets/rich-body.js"></script>
<script src="../../assets/drag-image.js"></script>
<script src="../../assets/bg-controls.js"></script>
<script src="../../assets/app-shell.js"></script>
<script src="../../assets/cards/registry.js"></script>
<script src="../../assets/cards/citation-card.js"></script>
</head>
<body>
<div id="root"></div>
<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useEffect=React.useEffect,useLayoutEffect=React.useLayoutEffect;
var UI=Shell.ui;

/* ═══ CARTE PARTAGÉE ══════════════════════════════════════════════════════
   Le visuel, sa mise en page et son état par défaut vivent dans
   assets/cards/citation-card.js — rendu à l'identique par le Carrousel.
   Ne rien réimplémenter ici. */
var CARD=SPGCards.get("citation");
var CITE_S=CARD_W/600;
var CITE_FORMATS=CARD.formats;
var getCiteLayout=CARD.getLayout;

/* ═══ FOND PAR DÉFAUT ══════════════════════════════════════════════════════ */
var BG_DIR="../../templates/citation/";
function bgCandidates(k){
  var names=["TEMPLATE_BACK2","TEMPLATE_BACK","TEMPLATE_LN_"+k];
  var exts=[".png",".jpg",".jpeg",".webp"];
  var out=[]; names.forEach(function(n){exts.forEach(function(x){out.push(BG_DIR+n+x);});});
  return out;
}

/* ═══ STATE ════════════════════════════════════════════════════════════════ */
var DEFAULT=CARD.DEFAULT;

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var shell=Shell.useApp({pageKey:"citation",DEFAULT:DEFAULT,bgCandidates:bgCandidates});
  var st=shell.st,setSt=shell.setSt,set=shell.set;

  var cardRef=useRef(null);
  var qhState=useState(100),quoteH=qhState[0],setQuoteH=qhState[1];
  var tabState=useState("fond"),activeTab=tabState[0],setActiveTab=tabState[1];
  var TABS=[{id:"fond",label:"Fond"},{id:"couleurs",label:"Couleurs"},
            {id:"cartouche",label:"Cartouche"},
            {id:"personne",label:"Personne"},{id:"citation",label:"Citation"},{id:"export",label:"Export"}];

  /* Photo personne par défaut */
  useEffect(function(){
    if(st.photo) return;
    tryLoadDefault(["../../templates/citation/TEMPLATE_PERSONNE.png"],
      function(dataUrl){setSt(function(p){if(p.photo)return p;var c=Object.assign({},p);c.photo=dataUrl;return c;});},
      function(){}
    );
  },[]);

  /* PictoGallery — badge unique (pas de BadgeEditor, une seule ligne) */
  useEffect(function(){
    window.PictoGallery.load(function(){
      var keys=window.PictoGallery.getKeys();
      setSt(function(p){var c=Object.assign({},p);if(keys.indexOf(p.badgeIconKey)<0)c.badgeIconKey=keys[0];return c;});
    });
  },[]);
  useEffect(function(){
    if(activeTab!=="cartouche") return;
    var ct=document.getElementById("spg-picto-gallery");
    if(ct&&!ct._pg){
      ct._pg=window.PictoGallery.init(ct,{
        grad:gradCss(st.grad,90),selected:st.badgeIconKey,custom:st.badgeIconCustom,
        onChange:function(key){setSt(function(p){var c=Object.assign({},p);c.badgeIconKey=key;c.badgeIconCustom=null;return c;});},
        onCustom:function(d){setSt(function(p){var c=Object.assign({},p);c.badgeIconCustom=d;return c;});}
      });
    }
    if(ct&&ct._pg) ct._pg.setGrad(gradCss(st.grad,90));
  },[activeTab,st.grad]);


  /* ─── Dérivés (panneau uniquement) ── */
  var G=GRADS[st.grad]||GRADS.bleu;
  var GRAD_H=gradCss(st.grad,90),GRAD_V=gradCss(st.grad,180);
  var cf=chFormat(st.format);
  var previewScale=UI.previewScale(cf);

  /* Géométrie : même source que la carte, jamais recalculée à la main */
  var g=CARD.geometry(st,quoteH);
  var L=g.L,CARD_H=g.CARD_H,cfs=g.cfs,isT03=g.isT03;
  var QUOTE_FONT_MIN=g.QUOTE_FONT_MIN,QUOTE_FONT_MAX=g.QUOTE_FONT_MAX;
  var curPct=g.curPct,QW=g.QW,targetTop=g.targetTop,_rawY=g.rawY;
  var TOP_MIN=g.TOP_MIN,TOP_MAX=g.TOP_MAX;
  var onGrad=g.onGrad,onWhite=g.onWhite,onML=g.onML;

  /* ═══ CARTE ════════════════════════════════════════════════════════════
     Composant partagé : voir assets/cards/citation-card.js. */
  var card=e(CARD.Card,{
    st:st, cardRef:cardRef, exportTarget:true,
    scale:previewScale, bgNat:shell.bgNat,
    onMeasure:function(m){ setQuoteH(m.quoteH); },
    onBgMove:function(x,y){ setSt(function(p){var c=Object.assign({},p);
      c["bgX_"+p.format]=x;c["bgY_"+p.format]=y;return c;}); }
  });

  /* ═══ PANNEAU ══════════════════════════════════════════════════════════════ */
  var panel=e("div",{className:"panel"},

    e(UI.Section,{title:"Format"},
      e(UI.FormatPicker,{formats:CITE_FORMATS,value:st.format,onChange:shell.setFormat})),

    e(UI.Tabs,{tabs:TABS,active:activeTab,onChange:setActiveTab}),

    /* Onglet Fond */
    e("div",{className:"panel-tab-content"+(activeTab==="fond"?" on":""),style:{paddingTop:16}},
      e(UI.SegButtons,{value:st.bgMode,onChange:function(v){set("bgMode",v);},
        options:[{v:"photo",l:"Image"},{v:"grad",l:"Aplat dégradé"},{v:"white",l:"Fond blanc"}]}),
      st.bgMode==="photo"?e(React.Fragment,null,
        e("div",{style:{height:10}}),
        e(BgPhotoPanel,{st:st,set:set,setSt:setSt,format:st.format,
          bgStatus:shell.bgStatus,bgNat:shell.bgNat,bgDir:BG_DIR,maxZoom:shell.maxZoom}))
      :e("div",{className:"hint",style:{marginTop:8}},
        onGrad?"Sur aplat dégradé, le cartouche et les boutons carrousel s'affichent avec un filet blanc automatiquement."
              :"Fond blanc uni."),
      e("div",{style:{height:10}}),
      e("label",{className:"toggle"},
        e("input",{type:"checkbox",checked:!!st.hasML,onChange:function(ev){set("hasML",ev.target.checked);}}),
        "Encadré marie-louise"),
      st.hasML?e("div",{style:{marginTop:8}},
        e(UI.SegButtons,{value:st.mlStyle,onChange:function(v){set("mlStyle",v);},
          options:[{v:"white",l:"Blanche"},{v:"grad",l:"Dégradée"}]})):null,
      e(UI.TabNav,{next:"Couleurs",onNext:function(){setActiveTab("couleurs");}})),

    /* Onglet Couleurs */
    e("div",{className:"panel-tab-content"+(activeTab==="couleurs"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Dégradé actif"),
      e(UI.GradPicker,{value:st.grad,onChange:function(v){set("grad",v);}}),
      e(UI.TabNav,{prev:"Fond",onPrev:function(){setActiveTab("fond");},
        next:"Cartouche",onNext:function(){setActiveTab("cartouche");}})),

    /* Onglet Cartouche */
    e("div",{className:"panel-tab-content"+(activeTab==="cartouche"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Template"),
      e("div",{style:{display:"flex",gap:6,marginBottom:14}},
        e("button",{onClick:function(){set("template","libre");},
          style:{flex:1,padding:"10px 8px",borderRadius:8,cursor:"pointer",border:"none",
            fontFamily:"inherit",fontSize:12,fontWeight:700,lineHeight:1.3,
            background:!isT03?"#1a1a1a":"#f0f0f0",color:!isT03?"#fff":"#555",transition:"all .15s"}},
          "Style libre"),
        e("button",{onClick:function(){set("template","t03");},
          style:{flex:1,padding:"10px 8px",borderRadius:8,cursor:"pointer",border:"none",
            fontFamily:"inherit",fontSize:12,fontWeight:700,lineHeight:1.3,
            background:isT03?"#1a1a1a":"#f0f0f0",color:isT03?"#fff":"#555",transition:"all .15s"}},
          "Template 03",e("br"),
          e("span",{style:{fontWeight:600,opacity:.7,fontSize:10}},"Charte 2026"))),
      e("label",{className:"field-label"},"Badge / Titre"),
      e("input",{type:"text",spellCheck:true,value:st.badge,onChange:function(ev){set("badge",ev.target.value);}}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Pictogramme"),
      e("div",{id:"spg-picto-gallery"}),
      e("div",{style:{height:10}}),
      e(UI.NavMarkPicker,{value:st.navMark,onChange:function(v){set("navMark",v);}}),
      e(UI.TabNav,{prev:"Couleurs",onPrev:function(){setActiveTab("couleurs");},
        next:"Personne",onNext:function(){setActiveTab("personne");}})),

    /* Onglet Personne */
    e("div",{className:"panel-tab-content"+(activeTab==="personne"?" on":""),style:{paddingTop:16}},
      isT03
        ?e(React.Fragment,null,
          e("div",{className:"upload-hint"},"Format idéal : ",e("b",null,"Portrait carré (~400×400 px)")),
          e(FileDrop,{value:st.avatarSrc,onChange:function(v){set("avatarSrc",v);},placeholder:"Avatar rond",small:true}),
          e("div",{style:{height:10}}),
          e("label",{className:"field-label"},"Nom"),
          e("input",{type:"text",spellCheck:true,value:st.name,
            onChange:function(ev){set("name",ev.target.value.toUpperCase());},style:{textTransform:"uppercase"}}),
          e("div",{style:{height:8}}),
          e("label",{className:"field-label"},"Fonction ",e("span",{className:"hint"},"(Entrée = retour à la ligne)")),
          e("textarea",{spellCheck:true,rows:2,value:st.title,onChange:function(ev){set("title",ev.target.value);}}))
        :e(React.Fragment,null,
          e("div",{className:"upload-hint"},"Format idéal : ",e("b",null,"Portrait 3:4 (~400×530 px)")),
          e(FileDrop,{value:st.photo,onChange:function(v){set("photo",v);},placeholder:"Portrait",small:true}),
          e("div",{style:{height:10}}),
          e("label",{className:"field-label"},"Nom"),
          e("input",{type:"text",spellCheck:true,value:st.name,
            onChange:function(ev){set("name",ev.target.value.toUpperCase());},style:{textTransform:"uppercase"}}),
          e("div",{style:{height:8}}),
          e("label",{className:"field-label"},"Fonction ",e("span",{className:"hint"},"(Entrée = retour à la ligne)")),
          e("textarea",{spellCheck:true,rows:2,value:st.title,onChange:function(ev){set("title",ev.target.value);}})),
      e(UI.TabNav,{prev:"Cartouche",onPrev:function(){setActiveTab("cartouche");},
        next:"Citation",onNext:function(){setActiveTab("citation");}})),

    /* Onglet Citation */
    e("div",{className:"panel-tab-content"+(activeTab==="citation"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Guillemets"),
      e(UI.SegButtons,{value:st.quoteStyle,onChange:function(v){set("quoteStyle",v);},
        options:[{v:"curly",l:"“”  English"},{v:"chevron",l:"«»  Français"},{v:"none",l:"Aucun"}]}),
      isT03?e(React.Fragment,null,
        e("div",{style:{height:12}}),
        e("label",{className:"field-label"},"Source — désignation en italique"),
        e("input",{type:"text",spellCheck:true,value:st.source||"",
          onChange:function(ev){set("source",ev.target.value);},
          placeholder:"ex : Rapport Développement Durable 2025"})):null,
      e("div",{style:{height:12}}),
      e("div",{className:"upload-hint",style:{marginBottom:6}},
        e("b",null,"**mot**")," = surlignage  •  ",e("b",null,"__mot__")," = soulignage"),
      e("textarea",{spellCheck:true,rows:7,value:st.quote,
        onChange:function(ev){set("quote",ev.target.value);},style:{fontSize:13,lineHeight:1.5}}),
      e("div",{style:{height:12}}),
      e("label",{className:"field-label"},
        "Taille du texte — "+cfs+" pt"+(st["fs_"+st.format]?"":" (défaut)")),
      e("input",{type:"range",min:QUOTE_FONT_MIN,max:QUOTE_FONT_MAX,step:1,value:cfs,
        onChange:function(ev){setSt(function(p){var c=Object.assign({},p);c["fs_"+p.format]=parseInt(ev.target.value,10);return c;});}}),
      e("button",{className:"mini-btn",style:{marginTop:4},
        onClick:function(){setSt(function(p){var c=Object.assign({},p);c["fs_"+p.format]=0;return c;});}},
        "Réinitialiser"),
      e("div",{style:{height:12}}),
      isT03
        ?e(React.Fragment,null,
          e("label",{className:"field-label"},"Largeur du bloc — "+(st["blockW_t03_"+st.format]||75)+" %"),
          e("input",{type:"range",min:50,max:95,step:5,value:st["blockW_t03_"+st.format]||75,
            onChange:function(ev){set("blockW_t03_"+st.format,parseInt(ev.target.value,10));}}),
          e("div",{style:{height:10}}),
          e("label",{className:"toggle"},
            e("input",{type:"checkbox",checked:st.shadowT03!==false,
              onChange:function(ev){set("shadowT03",ev.target.checked);}}),
            "Ombre portée"))
        :e(React.Fragment,null,
          e("label",{className:"field-label"},"Alignement horizontal"),
          e(UI.SegButtons,{value:st.blockAlign,onChange:function(v){set("blockAlign",v);},
            options:[{v:"left",l:"← Gauche"},{v:"center",l:"↔ Centre"},{v:"right",l:"Droite →"}]}),
          e("div",{style:{height:12}}),
          e("label",{className:"field-label"},
            (_rawY<0)?"Position native":"Position — bas à "+(L.CARD_H-(Math.round(targetTop)+quoteH))+"px du bord"),
          e("input",{type:"range",min:0,max:1000,step:1,
            value:_rawY<0?Math.round((targetTop-TOP_MIN)/Math.max(1,TOP_MAX-TOP_MIN)*1000)||500:_rawY,
            onChange:function(ev){set("blockYPct_"+st.format,parseInt(ev.target.value,10));}}),
          e("label",{className:"field-label",style:{marginTop:8}},
            "Largeur — "+curPct+"% ("+QW+" px)"+(st["blockPct_"+st.format]?"":"  — natif")),
          e("input",{type:"range",min:30,max:90,step:1,value:curPct,
            onChange:function(ev){set("blockPct_"+st.format,parseInt(ev.target.value,10));}}),
          e("button",{className:"mini-btn",style:{marginTop:8},
            onClick:function(){set("blockYPct_"+st.format,-1);set("blockPct_"+st.format,0);}},
            "Réinitialiser position et largeur")),
      e("div",{style:{height:12}}),
      e("label",{className:"toggle"},
        e("input",{type:"checkbox",checked:!!st.showLogo,onChange:function(ev){set("showLogo",ev.target.checked);}}),
        "Logo en bas du bloc"),
      st.showLogo?e("div",{style:{marginTop:8}},
        e(FileDrop,{value:st.logoImg,onChange:function(v){set("logoImg",v);},placeholder:"Logo PNG transparent",small:true})):null,
      e(UI.TabNav,{prev:"Personne",onPrev:function(){setActiveTab("personne");},
        next:"Export",onNext:function(){setActiveTab("export");}})),

    /* ── Export ── */
    e("div",{className:"panel-tab-content"+(activeTab==="export"?" on":""),style:{paddingTop:16}},
      e(UI.ExportTab,{shell:shell,cardRef:cardRef}))
  );

  /* Sync live → Carrousel */
  useEffect(function(){
    try{localStorage.setItem("spg_live_citation",JSON.stringify({
      quote:st.quote||"",
      personName:st.name||"",
      personTitle:st.title||"",
      personPhoto:st.photo&&st.photo.startsWith("data:")?st.photo:null,
      bgImg:st.bgImg&&st.bgImg.startsWith("data:")?st.bgImg:null
    }));}catch(err){}
  },[st]);

  return e("div",{className:"app-layout"},panel,
    e("div",{className:"preview-wrap"},e(UI.Stage,{cf:cf},card)));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
