<style>

body{margin:0;font-family:'Nunito',sans-serif;background:#f0f0f0;}

.slide-list{flex:1;overflow-y:auto;padding:6px;}
.slide-item{position:relative;border-radius:7px;margin-bottom:5px;cursor:pointer;border:2px solid transparent;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:all .15s;}

.sld-btn.del{color:#c0392b;}
.add-btn{width:100%;padding:9px;border:2px dashed #ccc;border-radius:7px;background:none;cursor:pointer;font-size:11px;font-weight:700;color:#888;font-family:inherit;transition:all .15s;margin-top:2px;}
.add-btn:hover{border-color:#1a1a1a;color:#1a1a1a;background:#fff;}

.section{margin-bottom:14px;}.section:last-child{margin-bottom:0;}
label.field-label{display:block;font-size:11px;font-weight:600;color:#404040;margin-bottom:3px;}
.hint{font-size:10px;color:#737373;}

textarea{resize:vertical;}
input[type=range]{width:100%;accent-color:#1a1a1a;}

.file-drop.small{height:56px;}
.file-drop:hover{border-color:#a3a3a3;}

<script>
function boot(){

var GRADS={
  bleu:  {label:"Bleu",   from:"#0098E3", to:"#4632FF", lowCarbonOK:true },
  cyan:  {label:"Cyan",   from:"#0197E6", to:"#00A55E", lowCarbonOK:true },
  vert:  {label:"Vert",   from:"#3EA400", to:"#00884A", lowCarbonOK:true },
  rouge: {label:"Rouge",  from:"#EB6A17", to:"#E70000", lowCarbonOK:false}
};

function gradCss(k,deg){var g=GRADS[k]||GRADS.bleu;
  return "linear-gradient("+(deg===undefined?90:deg)+"deg,"+g.from+" 0%,"+g.to+" 100%)";}

/* ═══ COULEURS TEXTE — charte "Textes", fond blanc uniquement ════════════
   Autorisé : gris foncé, les 4 couleurs unies de fin de dégradé principal,
              ou le dégradé lui-même appliqué en diagonal.
   Interdit  : toutes les couleurs secondaires (turquoise, fluo green, etc.)
   Si le paragraphe dépasse 5 lignes : préférer gris ou couleur unie (charte).
   ══════════════════════════════════════════════════════════════════════════ */
/* Couleur gris foncé autorisée sur fond blanc, indépendamment du dégradé actif */

var COLOR_GREY="#374649";
var TE_WHITE="#FFFFFF";

/* ═══ LAYOUT ══════════════════════════════════════════════════════════════
   Toutes les valeurs de la charte sont exprimées sur un canevas 1080 px.
   La carte de preview fait 600 px de large : K = 600/1080 = 0.5556.
   Chaque constante ci-dessous est donc la valeur charte × K, arrondie.
   ══════════════════════════════════════════════════════════════════════════ */
var CARD_W=600, K=600/1080;
function px(v){return Math.round(v*K);}   /* charte px → card px */

var FORMATS={
  "1x1" :{label:"Carré 1:1",   outputW:1080,outputH:1080,cardH:600 },
  "4x5" :{label:"Portrait 4:5",outputW:1080,outputH:1350,cardH:750 },
  "9x16":{label:"Story 9:16",  outputW:1080,outputH:1920,cardH:1067}
};

/* Marie-louise : 50 px de charte → 28 px carte.
   Avec marie-louise, le cartouche passe à 100 px de marge (28 + 28). */
var ML_W=px(50);

/* ════════════════════════════════════════════════════════════════════════════
   TYPO & MISE EN PAGE — toutes les valeurs éditables sont ici.
   Les valeurs sont exprimées en PT CHARTE (base 1080px).
   La fonction px() les convertit en pixels de carte (600px de large).

   CARTOUCHE LÉGENDE
   ──────────────────────────────────────────────────────────────────────── */
var T={
  /* Cartouche : boîte icône */
  BADGE_H_PT      : 70,   /* hauteur de la pilule texte (pt charte) */
  BADGE_ICON_PT   : 70,   /* taille de la boîte icône carrée */
  BADGE_ICON_RATIO: 0.68, /* taille de l'icône dans la boîte (0.68 = 68%) */
  BADGE_GAP_PT    : 15,   /* espace entre boîte icône et pilule texte */
  BADGE_RADIUS_PT : 22,   /* rayon des coins du cartouche */
  BADGE_PADX_PT   : 25,   /* padding horizontal intérieur de la pilule */
  BADGE_FONT_PT   : 30,   /* taille de la police du cartouche */

  /* Pavé de texte */
  PAVE_PAD_PT     : 30,   /* padding intérieur du pavé blanc */
  PAVE_RADIUS_PT  : 22,   /* rayon des coins du pavé */

  /* Flèche / point de carrousel */
  ARROW_PT        : 70,   /* taille de la boîte flèche/point */
  ARROW_RADIUS_PT : 15,   /* rayon des coins de la boîte */
  ARROW_GAP_PT    : 30,   /* espace entre pavé et flèche (50 en story) */
  ARROW_GAP_STORY : 50,   /* espace entre pavé et flèche en story */

  /* Texte du pavé (charte : 45–80pt SemiBold, interl. 55–95pt) */
  TEXT_MIN_PT     : 45,   /* taille minimum autorisée par la charte */
  TEXT_MAX_PT     : 80,   /* taille maximum autorisée par la charte */
  TEXT_DEF_PT     : 48,   /* taille par défaut au lancement */
  TEXT_LH         : 1.25, /* interligne (ratio × taille) */

  /* Graisses — fontWeight */
  FW_TEXT         : 500,  /* texte courant du pavé (SemiBold) */
  FW_HIGHLIGHT    : 500,  /* mots surlignés **comme ça** (ExtraBold) */
  FW_UNDERLINE    : 600,  /* mots soulignés __comme ça__ (SemiBold) */
  FW_BADGE_MAIN   : 600,  /* titre cartouche ex. "LATEST NEWS" (ExtraBold) */
  FW_BADGE_SUB    : 200,  /* précision cartouche ex. lieu (SemiBold) */

  /* Surlignage */
  HIGHLIGHT_PAD_X : 0.28, /* espace horizontal autour du bloc surligné (× fs) */
  HIGHLIGHT_H     : 1.14, /* hauteur du rectangle de surlignage (× fs) */

  /* Soulignage */
  UNDERLINE_TH    : 0.17, /* épaisseur de la barre (× fs, min 3px) */
  UNDERLINE_OFF   : 0.03, /* décalage sous la baseline (× fs) */
};
/* ════════════════════════════════════════════════════════════════════════════ */

function getLayout(k,firstSlide,hasML){
  var f=FORMATS[k]||FORMATS["1x1"];
  var story=(k==="9x16");
  var base = story ? px(80) : (firstSlide ? px(84) : px(50));
  var ml   = (!story && hasML) ? ML_W : 0;
  return {
    CARD_H:f.cardH, EXPORT_SCALE:f.outputW/CARD_W, STORY:story, ML:ml,
    MARGIN: base+ml,
    BADGE_TOP: story ? px(180) : base+ml,
    RIGHT_MIN: (story ? px(160) : px(100)) + ml,
    BOTTOM:    (story ? px(230) : px(100)) + ml,
    BADGE_H:px(T.BADGE_H_PT), BADGE_ICON:px(T.BADGE_ICON_PT),
    BADGE_GAP:px(T.BADGE_GAP_PT), BADGE_RADIUS:px(T.BADGE_RADIUS_PT),
    BADGE_PADX:px(T.BADGE_PADX_PT), BADGE_FONT:px(T.BADGE_FONT_PT),
    PAVE_PAD:px(T.PAVE_PAD_PT), PAVE_RADIUS:px(T.PAVE_RADIUS_PT),
    ARROW:px(T.ARROW_PT), ARROW_RADIUS:px(T.ARROW_RADIUS_PT),
    ARROW_GAP:story?px(T.ARROW_GAP_STORY):px(T.ARROW_GAP_PT),
    TEXT_MIN:px(T.TEXT_MIN_PT), TEXT_MAX:px(T.TEXT_MAX_PT),
    TEXT_DEF:px(T.TEXT_DEF_PT), TEXT_LH:T.TEXT_LH
  };
}

/* ═══ PARSEUR ═════════════════════════════════════════════════════════════
   **mot** = surlignage dégradé    __mot__ = soulignage dégradé
   Identique au générateur Citation, pour que les deux outils partagent
   la même syntaxe côté utilisateur.
   ══════════════════════════════════════════════════════════════════════════ */

function parseRich(t){
  var out=[],re=/(\*\*[\s\S]+?\*\*|__[\s\S]+?__)/g,last=0,m;
  while((m=re.exec(t))!==null){
    if(m.index>last) out.push({t:"n",v:t.slice(last,m.index)});
    out.push(m[0].slice(0,2)==="**"?{t:"h",v:m[0].slice(2,-2)}:{t:"u",v:m[0].slice(2,-2)});
    last=re.lastIndex;
  }
  if(last<t.length) out.push({t:"n",v:t.slice(last)});
  return out;
}

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect,
    useLayoutEffect=React.useLayoutEffect;

/* Interpolation couleur hex — utilisée dans RichBody ET dans doExport */
function lerpHex(c1,c2,t){
  function hx(s){return parseInt(s.slice(1),16);}
  var a=hx(c1),b=hx(c2);
  var ar=(a>>16)&255,ag=(a>>8)&255,ab=a&255;
  var br=(b>>16)&255,bg=(b>>8)&255,bb=b&255;
  var r=Math.round(ar+(br-ar)*t);
  var g=Math.round(ag+(bg-ag)*t);
  var bl=Math.round(ab+(bb-ab)*t);
  return "rgb("+r+","+g+","+bl+")";
}

function lerpHex(c1,c2,t){
  function hx(s){return parseInt(s.slice(1),16);}
  var a=hx(c1),b=hx(c2);
  var ar=(a>>16)&255,ag=(a>>8)&255,ab=a&255;
  var br=(b>>16)&255,bg=(b>>8)&255,bb=b&255;
  var r=Math.round(ar+(br-ar)*t);
  var g=Math.round(ag+(bg-ag)*t);
  var bl=Math.round(ab+(bb-ab)*t);
  return "rgb("+r+","+g+","+bl+")";
}

function RichBody(props){
  var fs=props.fs, lh=props.lh, grad=props.grad;
  var hostRef=useRef(null);
  var s0=useState({h:[],u:[],n:[]}); var M=s0[0],setM=s0[1];
  var s1=useState(0); var setTick=s1[1];

  useEffect(function(){
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(function(){ setTick(function(t){return t+1;}); });
    }
  },[]);

  useLayoutEffect(function(){
    var host=hostRef.current; if(!host) return;
    var base=host.getBoundingClientRect();
    var SC = host.offsetWidth ? (base.width/host.offsetWidth) : 1;
    if(!SC || !isFinite(SC) || SC<=0) SC=1;
    function N(v){ return v/SC; }

    var res={h:[],u:[],n:[]};
    var segs=host.querySelectorAll("[data-seg]");
    for(var i=0;i<segs.length;i++){
      var kind=segs[i].getAttribute("data-seg");
      var rs=segs[i].getClientRects();
      for(var j=0;j<rs.length;j++){
        var r=rs[j]; if(r.width<0.5) continue;
        var o={x:N(r.left-base.left),y:N(r.top-base.top),
               w:N(r.width),h:N(r.height),b:N(r.bottom-base.top)};
        if(kind==="h") res.h.push(o);
        else if(kind==="u") res.u.push(o);
        else res.n.push(o);
      }
    }
    if(JSON.stringify(res)!==JSON.stringify(M)) setM(res);
  });

  /* Parseur → tableau de tokens, avec support saut de ligne \n → br */
  function renderParts(text,useGrad,color){
    /* On découpe d'abord sur \n pour gérer les sauts de ligne */
    var lines=text.split("\n");
    var out=[];
    lines.forEach(function(line,li){
      if(li>0) out.push(e("br",{key:"br"+li}));
      var parts=parseRich(line);
      parts.forEach(function(p,pi){
        var key=li+"-"+pi;
        if(p.t==="h"){
          /* Espace insécable avant/après le bloc surligné */
          out.push(e("span",{key:key+"a",style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},"\u00a0"));
          out.push(e("span",{key:key,"data-seg":"h",
            style:{color:TE_WHITE,fontWeight:T.FW_HIGHLIGHT,fontFamily:"'Nunito',sans-serif",
                   WebkitTextFillColor:TE_WHITE}},p.v));
          out.push(e("span",{key:key+"b",style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},"\u00a0"));
        } else if(p.t==="u"){
          out.push(e("span",{key:key,"data-seg":"u",
            style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_UNDERLINE,
                   color:useGrad?"transparent":color,
                   WebkitTextFillColor:useGrad?"transparent":undefined}}
            ,p.v));
        } else {
          out.push(useGrad
            ? e("span",{key:key,"data-seg":"n",
                style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT,
                       color:"transparent",WebkitTextFillColor:"transparent"}},p.v)
            : e("span",{key:key,
                style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},p.v));
        }
      });
    });
    return out;
  }

  var useGrad=(props.textMode==="grad");

  /* Surlignage */
  var H_PAD_X=fs*T.HIGHLIGHT_PAD_X;
  var H_H=fs*T.HIGHLIGHT_H;
  /* Soulignage */
  var U_TH=Math.max(3,fs*T.UNDERLINE_TH);
  var U_OFF=fs*T.UNDERLINE_OFF;

  /* Dégradé diagonal sur texte normal */
  var gradFrom=props.gradFrom||"#0098E3";
  var gradTo=props.gradTo||"#4632FF";
  var nMinX=Infinity,nMinY=Infinity,nMaxX=-Infinity,nMaxY=-Infinity;
  if(useGrad&&M.n.length){
    M.n.forEach(function(r){
      nMinX=Math.min(nMinX,r.x); nMinY=Math.min(nMinY,r.y);
      nMaxX=Math.max(nMaxX,r.x+r.w); nMaxY=Math.max(nMaxY,r.y+r.h);
    });
  }

  return e("div",{style:{position:"relative"}},

    M.h.map(function(r,i){
      var cy=r.y+r.h/2;
      return e("div",{key:"h"+i,style:{position:"absolute",
        left:r.x-H_PAD_X, top:cy-H_H/2, width:r.w+H_PAD_X*2, height:H_H,
        backgroundImage:grad, borderRadius:2, zIndex:0}});
    }),

    M.u.map(function(r,i){
      return e("div",{key:"u"+i,style:{position:"absolute",
        left:r.x, top:r.b-U_OFF, width:r.w, height:U_TH,
        backgroundImage:grad, borderRadius:U_TH/2, zIndex:0}});
    }),

    useGrad&&M.n.length?(function(){
