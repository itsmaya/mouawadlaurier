/* ═══════════════════════════════════════════════════════════════════════════
   CSS SPÉCIFIQUE AU CARROUSEL UNIQUEMENT — tout préfixé car-*.
   Le design system (panel, sections, tabs, seg, toggle, inputs, file-drop,
   mini-btn, tab-nav-btn, grad-sw, hint, field-label…) vient de app-shell.js.
   Ne rien y redéfinir.
   ═══════════════════════════════════════════════════════════════════════════ */
.car-work{flex:1;display:flex;flex-direction:column;min-width:0;height:calc(100vh - 52px);}
.car-toolbar{display:flex;align-items:center;gap:8px;padding:10px 24px;
  background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0;flex-wrap:wrap;}
.car-count{font-size:12px;color:#888;}
.car-body{flex:1;overflow-y:auto;padding:28px 24px;display:flex;
  justify-content:center;align-items:flex-start;}

.car-grid{display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start;
  justify-content:center;align-items:flex-start;}
/* isolation : contexte d'empilement propre à chaque vignette, pour que les
   cadres internes de la carte ne puissent pas échapper à leur découpage. */
.car-thumb{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;isolation:isolate;
  box-shadow:0 2px 10px rgba(0,0,0,.12);border:2px solid transparent;
  transition:box-shadow .15s,border-color .15s;flex-shrink:0;background:#fff;}
/* SURVOL SANS TRANSFORM — un transform, même de 2 px, promeut la vignette en
   couche composite GPU. C'est ce basculement qui faisait lâcher le découpage
   arrondi du cadre image de Split Screen (coins carrés au survol, puis
   définitivement carrés une fois la couche promue). L'effet de relief est
   reproduit avec une ombre plus marquée, qui elle ne crée aucune couche. */
.car-thumb:hover{box-shadow:0 8px 22px rgba(0,0,0,.22);border-color:#bfe3f7;}
.car-thumb.on{border-color:#0098E3;box-shadow:0 4px 18px rgba(0,152,227,.28);}
.car-thumb-tag{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.58);
  color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:4px 6px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.car-thumb-acts{position:absolute;top:5px;left:5px;right:5px;display:flex;gap:4px;
  opacity:0;transition:opacity .15s;}
.car-thumb:hover .car-thumb-acts{opacity:1;}
.car-thumb-acts button{width:22px;height:22px;border-radius:5px;border:none;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
  font-family:inherit;transition:background .12s;}
.car-thumb-acts button:hover:not(:disabled){background:#0098E3;}
.car-thumb-acts button:disabled{opacity:.3;cursor:default;}
.car-thumb-acts .del{margin-left:auto;background:rgba(192,57,43,.75);}
.car-thumb-acts .del:hover{background:#c0392b;}
.car-add-tile{border:2px dashed #ccc;border-radius:8px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  color:#aaa;gap:4px;flex-shrink:0;transition:border-color .15s,color .15s;background:#fafafa;}
.car-add-tile:hover{border-color:#0098E3;color:#0098E3;}
.car-add-tile .plus{font-size:28px;line-height:1;}
.car-add-tile span{font-size:11px;font-weight:600;}

.car-single{display:flex;flex-direction:column;align-items:center;gap:18px;}
.car-stage{position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 6px 28px rgba(0,0,0,.18);flex-shrink:0;}
.car-stepper{display:flex;align-items:center;gap:12px;}
.car-stepper .pos{font-size:12px;color:#666;min-width:56px;text-align:center;font-weight:700;}

.car-list{display:flex;flex-direction:column;gap:5px;}
.car-row{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:8px;
  background:#fafafa;border:1px solid #e8e8e8;border-left:3px solid transparent;
  cursor:pointer;transition:background .12s,border-color .12s;}
.car-row:hover{background:#f2f7fb;}
.car-row.on{background:#eef5fb;border-color:#c0dff0;border-left-color:#0098E3;}
.car-row-num{font-size:10px;font-weight:800;color:#bbb;width:16px;flex-shrink:0;}
.car-row.on .car-row-num{color:#0098E3;}
.car-row-name{flex:1;min-width:0;font-size:12px;font-weight:600;color:#444;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.car-row.on .car-row-name{color:#0098E3;font-weight:800;}
.car-row-mark{display:block;flex-shrink:0;overflow:hidden;height:18px;width:23px;}
.car-row button{border:1px solid #e0e0e0;background:#fff;border-radius:5px;
  width:22px;height:22px;font-size:11px;cursor:pointer;color:#666;flex-shrink:0;
  font-family:inherit;display:flex;align-items:center;justify-content:center;
  transition:background .1s;padding:0;}
.car-row button:hover:not(:disabled){background:#f0f8ff;color:#0098E3;}
.car-row button:disabled{opacity:.28;cursor:default;}
.car-row button.del:hover{background:#fff0f0;color:#c0392b;}

.car-typegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.car-typebtn{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:7px;
  border:1px solid #e0e0e0;background:#fafafa;cursor:pointer;font-size:11.5px;
  font-weight:700;color:#555;font-family:inherit;text-align:left;
  transition:border-color .15s,background .15s,color .15s;}
.car-typebtn:hover{border-color:#0098E3;background:#f0f8ff;color:#0098E3;}
.car-typebtn .ico{font-size:15px;flex-shrink:0;}

.car-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.car-modal{background:#fff;border-radius:12px;width:360px;max-width:100%;
  max-height:80vh;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(0,0,0,.26);}
.car-modal-hd{display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:14px 16px;border-bottom:1px solid #f0f0f0;}
.car-modal-hd h3{margin:0;font-size:13px;font-weight:800;color:#1a1a1a;letter-spacing:.03em;}
.car-modal-hd button{border:none;background:none;font-size:20px;color:#aaa;
  cursor:pointer;line-height:1;padding:0 2px;}
.car-modal-hd button:hover{color:#333;}
.car-modal-bd{overflow-y:auto;padding:12px 16px 16px;}
.car-save-row{display:block;width:100%;text-align:left;padding:9px 12px;
  border:1px solid #e8e8e8;border-radius:8px;margin-bottom:6px;background:#fafafa;
  cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;}
.car-save-row:hover{background:#f0f8ff;border-color:#0098E3;}
.car-save-row b{display:block;font-size:12.5px;font-weight:700;color:#333;}
.car-save-row i{display:block;font-size:10px;color:#aaa;font-style:normal;margin-top:2px;}

.car-busy{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;gap:14px;font-size:14px;font-weight:600;}
.car-busy .ring{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}

.car-menu-bg{position:fixed;inset:0;z-index:98;}
.car-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:99;background:#fff;
  border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  min-width:190px;overflow:hidden;}
.car-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;
  border:none;background:none;font-size:12.5px;cursor:pointer;color:#333;
  font-family:inherit;text-align:left;font-weight:600;}
.car-menu button:hover{background:#f0f8ff;color:#0098E3;}


@media(max-width:768px){
  .car-toolbar{padding:10px 14px;}
  .car-body{padding:18px 12px;}
}

<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useEffect=React.useEffect;
var UI=Shell.ui;

/* ═══ TYPES DISPONIBLES ═══════════════════════════════════════════════════
   Dérivés du registre : ajouter un module de carte dans assets/cards/ le
   rend automatiquement disponible ici, sans toucher à ce fichier. */
var TYPES=SPGCards.all().filter(function(d){ return d.carrousel!==false; });   /* Energy Talks a sa logique propre, jamais une vignette */

/* Formats communs à TOUS les types (un carrousel a un seul format) */
var CAR_FORMATS=(function(){
  var counts={};
  TYPES.forEach(function(t){(t.formats||[]).forEach(function(f){counts[f]=(counts[f]||0)+1;});});
  return Object.keys(counts).filter(function(f){return counts[f]===TYPES.length;});
})();

var _sc=0;
function sid(){return "s"+(++_sc)+"_"+Math.random().toString(36).slice(2,7);}

/* Une vignette = un type + l'état NATIF du générateur correspondant.
   Aucune conversion, aucune perte : c'est exactement ce que la page produit. */
function newSlide(type){
  return {id:sid(),type:type,st:JSON.parse(JSON.stringify(SPGCards.get(type).DEFAULT))};
}

/* ═══ RATTRAPAGE DES ANCIENNES SAUVEGARDES ═══════════════════════════════
   Avant les cartes partagées, une vignette était un objet plat
   ({type:"latest-news", quote, personName, …}) au lieu de {type, st}.
   On la convertit au chargement pour ne perdre aucun projet existant. */
var LEGACY_TYPE={"citation":"citation","latest-news":"latestnews",
                 "block-layout":"blocklayouts","split-screen":"splitscreen"};

function migrateSlide(sl){
  if(!sl) return null;
  if(sl.st && SPGCards.has(sl.type)) return sl;              /* déjà au bon format */
  var type=LEGACY_TYPE[sl.type]||(SPGCards.has(sl.type)?sl.type:null);
  if(!type) return null;                                      /* type inconnu : ignoré */
  var st;
  if(type==="citation") st={
    quote:sl.quote||"", name:sl.personName||"", title:sl.personTitle||"",
    photo:sl.personPhoto||null, bgImg:sl.bgImg||null,
    bgMode:sl.bgImg?"photo":"grad", bgCustom:!!sl.bgImg};
  else if(type==="latestnews"){
    var blocs=[];
    if(sl.title) blocs.push(SPGCards.get("latestnews").newBloc({text:sl.title}));
    if(sl.body)  blocs.push(SPGCards.get("latestnews").newBloc({text:sl.body,type:"texte"}));
    st={blocs:blocs.length?blocs:undefined, bgImg:sl.bgImg||null,
        bgMode:sl.bgImg?"photo":"grad", bgCustom:!!sl.bgImg};
  }
  else if(type==="blocklayouts") st={
    blocks:sl.blocks||undefined, bgImg:sl.bgImg||null,
    bgMode:sl.bgKind==="grad"?"grad":(sl.bgKind==="img"?"photo":"white"),
    bgCustom:!!sl.bgImg};
  else st={
    layout:sl.layout||"left", imgRatio:sl.imgRatio||0.55,
    textMode:sl.textMode==="solid"?"uni":(sl.textMode||"grad"),
    textColor:sl.textColor||"#E70000", text:sl.text||"",
    bgImg:sl.bgImg||null, bgCustom:!!sl.bgImg};
  Object.keys(st).forEach(function(k){ if(st[k]===undefined) delete st[k]; });
  return {id:sl.id||sid(), type:type, st:st};
}

function normalizeCarousel(state){
  var s=Object.assign({},state||{});
  s.slides=(s.slides||[]).map(migrateSlide).filter(Boolean);
  if(!s.slides.length) s.slides=[newSlide("citation")];
  return s;
}

/* ═══ STATE ═══════════════════════════════════════════════════════════════ */
var DEFAULT={
  format:"1x1",grad:"cyan",lowCarbon:false,
  badgeMain:"CARROUSEL",badgeSub:"",
  badgeIconKey:"Electricity",badgeIconCustom:null,
  slides:[newSlide("citation"),newSlide("latestnews"),newSlide("blocklayouts")]
};

/* ═══ RÉGLAGES DES VIGNETTES ═════════════════════════════════════════════
   Aucun éditeur n'est recopié ici : chaque vignette affiche le panneau de
   son générateur (assets/panneaux/<type>.js), sans les options que le
   Carrousel impose à toutes (cartouche, dégradé, repère). */

/* ═══ MODALE D'IMPORT ═════════════════════════════════════════════════════ */
function ImportModal(p){
  var a=useState(null),recs=a[0],setRecs=a[1];
  var reg=SPGCards.get(p.type);
  useEffect(function(){
    SaveManager.createStore(reg.pageKey).list(function(all){
      (all||[]).sort(function(x,y){
        return String(y.updatedDate||y.date||"").localeCompare(String(x.updatedDate||x.date||""));});
      setRecs(all||[]);
    });
  },[p.type]);
  return e("div",{className:"car-modal-bg",
      onClick:function(ev){if(ev.target===ev.currentTarget)p.onClose();}},
    e("div",{className:"car-modal"},
      e("div",{className:"car-modal-hd"},
        e("h3",null,reg.icon+"  Sauvegardes « "+reg.label+" »"),
        e("button",{onClick:p.onClose,"aria-label":"Fermer"},"×")),
      e("div",{className:"car-modal-bd"},
        recs===null
          ? e("div",{className:"hint"},"Chargement…")
          : recs.length===0
            ? e("div",{className:"hint",style:{lineHeight:1.6}},
                "Aucune sauvegarde dans le générateur ",e("b",null,reg.label),". ",
                "Ouvrez-le, enregistrez une version, puis revenez ici.")
            : recs.map(function(r){
                return e("button",{key:r.id,className:"car-save-row",
                  onClick:function(){p.onPick(r);}},
                  e("b",null,r.name||"(sans nom)"),
                  e("i",null,(r.folder?"📁 "+r.folder+"  ·  ":"")+
                    new Date(r.updatedDate||r.date||Date.now()).toLocaleString("fr-FR")));
              }))));
}

/* ═══ APP ═════════════════════════════════════════════════════════════════ */
function App(){
  var shell=Shell.useApp({pageKey:"carrousel",DEFAULT:DEFAULT,normalize:normalizeCarousel});
  var st=shell.st,setSt=shell.setSt,set=shell.set;

  var tabState=useState("commun"),activeTab=tabState[0],setActiveTab=tabState[1];
  var idxState=useState(0),activeIdx=idxState[0],setActiveIdx=idxState[1];
  var viewState=useState("grid"),view=viewState[0],setView=viewState[1];
  var zipState=useState(false),zipping=zipState[0],setZipping=zipState[1];
  var impState=useState(null),importType=impState[0],setImportType=impState[1];
  var menuState=useState(false),addMenu=menuState[0],setAddMenu=menuState[1];

  var TABS=[{id:"commun",label:"Mise en page"},{id:"vignettes",label:"Vignettes"},
            {id:"contenu",label:"Contenu"},{id:"caption",label:"Légende"},{id:"export",label:"Export"}];

  var slides=st.slides||[];
  var cf=chFormat(st.format);

  /* ── Surcharges communes appliquées à CHAQUE vignette ──────────────────
     Le Carrousel impose le format, le dégradé, le cartouche et le repère.
     Le reste de l'état reste celui de la vignette. */
  function overridesFor(type,idx,fmt){
    var reg=SPGCards.get(type);
    var o={
      format:fmt||st.format, grad:st.grad, lowCarbon:st.lowCarbon,
      badgeIconKey:st.badgeIconKey, badgeIconCustom:st.badgeIconCustom,
      /* Repère automatique : flèche → partout, point ● sur la dernière */
      navMark:(idx>=slides.length-1)?"dot":"arrow"
    };
    if(reg.badgeField==="badge") o.badge=st.badgeMain;
    else { o.badgeMain=st.badgeMain; o.badgeSub=st.badgeSub; }
    return o;
  }
  /* État complet rendu par la carte : défauts du type ← état vignette ← commun */
  function stateFor(sl,idx,fmt){
    var full=SPGCards.resolve(sl.type,sl.st,overridesFor(sl.type,idx,fmt));
    /* Héritage entre formats : un format non réglé suit le format de référence
       du carrousel (voir SPGInherit dans app-shell.js). */
    return SPGInherit.resolve(full,full.format,null,SPGInherit.source(st));
  }
  function dims(sl,fmt){
    var f=fmt||st.format;
    var reg=SPGCards.get(sl.type);
    var full=SPGCards.resolve(sl.type,sl.st,{format:f});
    return {w:reg.cardWidth?reg.cardWidth(f):CARD_W,
            h:reg.cardHeight(f,full)};
  }

  /* ── Traduction de tout le carrousel ──
     Une seule requête pour l'ensemble : les champs de toutes les vignettes
     sont mis bout à bout, puis redistribués dans le même ordre.
     La langue de départ est détectée par DeepL, pas supposée. */
  var tradToutState=useState(null);
  var tradTout=tradToutState[0], setTradTout=tradToutState[1];
  var tradNoteState=useState(""); var tradNote=tradNoteState[0], setTradNote=tradNoteState[1];
  function traduireTout(cible){
    var champsParSlide=slides.map(function(sl){ return SPGCards.textFields(sl.type); });
    var etats=slides.map(function(sl){ return SPGCards.resolve(sl.type,sl.st,{}); });
    var tailles=[], tous=[];
    etats.forEach(function(e2,i){
      var v=Shell.lireChamps(e2,champsParSlide[i]);
      tailles.push(v.length); tous=tous.concat(v);
    });
    if(!tous.join("").trim()){ alert("Aucun texte à traduire."); return; }
    setTradTout(cible); setTradNote("");
    Shell.traduire(tous,cible).then(function(res){
      /* La mention IA de chaque vignette suit la langue du carrousel, même
         quand le texte n'a pas besoin d'être traduit. */
      var langMention=(cible==="EN")?"en":"fr";
      if(res.detecte===cible){
        setSt(function(p){
          var a=p.slides.map(function(sl){
            return Object.assign({},sl,{st:Object.assign({},sl.st,
              {langTarget:cible,aiNoticeLang:langMention})});
          });
          return Object.assign({},p,{slides:a,langTarget:cible});
        });
        setTradNote("Le carrousel est déjà en "+(cible==="EN"?"anglais":"français")+
                    ", seules les mentions IA ont été alignées.");
        setTradTout(null); return;
      }
      var out=res.textes;
      setSt(function(p){
        var a=p.slides.slice(), n=0;
        a.forEach(function(sl,i){
          var part=out.slice(n,n+tailles[i]); n+=tailles[i];
          var base=SPGCards.resolve(sl.type,sl.st,{});
          var maj=Shell.ecrireChamps(base,champsParSlide[i],part);
          /* On ne réécrit que les clés de texte, pour ne pas figer dans la
             vignette les défauts du type ni le format imposé globalement. */
          var delta={};
          Object.keys(maj).forEach(function(k){
            if(maj[k]!==base[k]) delta[k]=maj[k];
          });
          delta.langTarget=cible;
          delta.aiNoticeLang=langMention;
          a[i]=Object.assign({},sl,{st:Object.assign({},sl.st,delta)});
        });
        return Object.assign({},p,{slides:a,langTarget:cible});
      });
      setTradNote("Traduit depuis "+(res.detecte||"la langue détectée")+".");
      setTradTout(null);
    }).catch(function(err){
      alert("Traduction impossible : "+err.message);
      setTradTout(null);
    });
  }

  /* ── Mention IA : propagation à toutes les vignettes ──
     Exigence de l'équipe charte : la mention doit figurer sur CHAQUE vignette
     qui utilise de l'IA, pas seulement sur la première. Elle reste liée à
     l'image, donc on ne la pose que sur les vignettes qui en ont une. */
  function propagerMentionIA(){
    var src=activeSlide?SPGCards.resolve(activeSlide.type,activeSlide.st,{}):null;
    if(!src||!src.aiNotice){ alert("Active d'abord la mention sur cette vignette."); return; }
    var n=0;
    setSt(function(p){
      var a=p.slides.map(function(sl){
        var plein=SPGCards.resolve(sl.type,sl.st,{});
        if(!plein.bgImg) return sl;          /* pas d'image : rien à qualifier */
        n++;
        return Object.assign({},sl,{st:Object.assign({},sl.st,{
          aiNotice:true, aiNoticeKind:src.aiNoticeKind,
          aiNoticeLang:src.aiNoticeLang, aiNoticeFond:src.aiNoticeFond})});
      });
      return Object.assign({},p,{slides:a});
    });
    setTradNote("Mention IA appliquée aux vignettes qui portent une image.");
  }

  /* ── Mutations ── */
  function updSlideState(i,k,v){
    setSt(function(p){
      var a=p.slides.slice();
      a[i]=Object.assign({},a[i],{st:Object.assign({},a[i].st,{[k]:v})});
      return Object.assign({},p,{slides:a});
    });
  }
  /* ADAPTATEUR — permet de réutiliser TELS QUELS les composants partagés
     (BgPhotoPanel notamment) qui attendent le couple set / setSt d'une page
     autonome. Ici l'état n'est pas celui de la page mais celui d'UNE vignette.
     Le format est injecté avant l'appel — les composants écrivent des clés
     suffixées par le format (bgZoom_1x1…) et le liraient sinon à vide — puis
     retiré : le format reste imposé globalement par le carrousel. */
  function slideSetSt(i){
    return function(fn){
      setSt(function(p){
        var a=p.slides.slice();
        var courant=Object.assign({},a[i].st,{format:p.format});
        var suivant=fn(courant)||courant;
        suivant=Object.assign({},suivant); delete suivant.format;
        a[i]=Object.assign({},a[i],{st:suivant});
        return Object.assign({},p,{slides:a});
      });
    };
  }
  function moveSlide(i,d){
    var j=i+d; if(j<0||j>=slides.length) return;
    setSt(function(p){var a=p.slides.slice();var t=a[i];a[i]=a[j];a[j]=t;
      return Object.assign({},p,{slides:a});});
    setActiveIdx(j);

    setSt(function(p){return Object.assign({},p,{slides:p.slides.concat([sl])});});
    setActiveIdx(slides.length);
    setActiveTab("contenu"); setView("single"); setAddMenu(false);
  }
  /* La confirmation est posée DANS delSlide, pas sur chaque bouton : la
     suppression est appelée depuis la liste de l'onglet Vignettes et depuis
     la grille, et une garde par bouton finirait par diverger. */
  function delSlide(i){
    var sl=slides[i];
    var nom=sl?(SPGCards.get(sl.type).label):"cette vignette";
    if(!confirm("Supprimer la vignette "+(i+1)+" « "+nom+" » ?\n\nCette action est annulable avec Ctrl+Z."))
      return;
    setSt(function(p){var a=p.slides.slice();a.splice(i,1);
      return Object.assign({},p,{slides:a});});
    setActiveIdx(function(c){return Math.max(0,Math.min(c,slides.length-2));});
  }

  (function(){

    if(SPGInherit.info) SPGInherit.info.source=src;
    if(src&&src!==st.format) slides.forEach(function(sl,i){
      var c={n:0};
      SPGInherit.resolve(SPGCards.resolve(sl.type,sl.st,overridesFor(sl.type,i)),st.format,c,src);

  /* ── Contrôle charte avant export ──
     Chaque vignette est rendue hors écran à l'échelle 1 ; les cartes
     remontent leurs mesures (onGarde), SPGGuard en tire un verdict par
     vignette. Bloquant : l'export s'arrête. Dérogation : confirmation. */
  function controleCharte(fmts){
    fmts=fmts||[st.format];
    if(!window.SPGGuard) return Promise.resolve(true);
    var holder=document.createElement("div");
    holder.style.cssText="position:fixed;left:-9999px;top:0;z-index:-100;pointer-events:none;";
    document.body.appendChild(holder);
    var cas=[];
    fmts.forEach(function(f){ slides.forEach(function(sl,i){ cas.push({sl:sl,i:i,f:f}); }); });
    var faits=cas.map(function(){return null;});
    var roots=cas.map(function(c,n){
      var wrap=document.createElement("div"); holder.appendChild(wrap);
      var root=ReactDOM.createRoot(wrap);
      root.render(e(SPGCards.get(c.sl.type).Card,{st:stateFor(c.sl,c.i,c.f),scale:1,cardId:"chk-"+n,
        onGarde:function(fa){ faits[n]=fa; }}));
      return root;
    });
    return new Promise(function(res){ setTimeout(res,900); }).then(function(){
      roots.forEach(function(r){ try{r.unmount();}catch(_){} });
      document.body.removeChild(holder);
      var items=[];
      cas.forEach(function(c,n){
        if(!faits[n]) return;
        SPGGuard.evaluer(faits[n]).forEach(function(it){
          items.push(Object.assign({},it,{msg:(fmts.length>1?chFormat(c.f).label+", ":"")+"vignette "+(c.i+1)+" : "+it.msg}));
        });
      });
      SPGGuard.publier(items);
      return SPGGuard.controleExport();
    });
  }

  /* ── Export ZIP ── */
  function doExportZip(fmts){
    if(!Array.isArray(fmts)) fmts=null;
    if(!window.domtoimage){
      alert("Bibliothèques d'export non disponibles. Réessayez dans quelques secondes.");
      return Promise.resolve();
    }
    if(!slides.length) return Promise.resolve();
    setZipping(true);
    var chargement=window.JSZip?Promise.resolve():Shell.chargerJSZip();
    return chargement.then(function(){ return controleCharte(fmts||[st.format]); }).then(function(ok){
      if(!ok){ setZipping(false); return; }
      lancerZip(fmts);
    });
  }
  function lancerZip(fmts){
    var tous=!!fmts; fmts=fmts||[st.format];
    /* Format de sortie choisi dans l'onglet Export. Le ZIP a son propre chemin
       de capture (une vignette après l'autre), il doit donc appliquer le choix
       lui-même : sans ça, le sélecteur PNG/JPG restait sans effet ici. */
    var sortie=Shell.formatSortie("carrousel");
    var enJpg=(sortie==="jpg");
    var zip=new JSZip();
    var holder=document.createElement("div");
    holder.style.cssText="position:fixed;left:-9999px;top:0;z-index:-100;pointer-events:none;";
    document.body.appendChild(holder);

    function finish(){
      zip.generateAsync({type:"blob"}).then(function(blob){
        var slug=(shell.save.currentName||st.badgeMain||"carrousel")
          .toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
        SaveManager.downloadBlob(blob,(slug||"carrousel")+"-"+(tous?"tous-formats":st.format)+".zip");
        document.body.removeChild(holder);
        setZipping(false);
      });
    }
    /* Une tâche = une vignette dans un format. Avec plusieurs formats, un
       dossier par format dans le .zip. */
    var taches=[];
    fmts.forEach(function(f){ slides.forEach(function(sl,i){ taches.push({sl:sl,i:i,f:f}); }); });
    function capture(n){
      if(n>=taches.length) return finish();
      var t=taches[n], i=t.i;
      var sl=t.sl, reg=SPGCards.get(sl.type), d=dims(sl,t.f);
      var wrap=document.createElement("div");
      wrap.style.cssText="display:inline-block;vertical-align:top;";
      holder.appendChild(wrap);
      var root=ReactDOM.createRoot(wrap);
      /* Rendu à l'échelle 1 : exactement ce que produit la page génératrice */
      root.render(e(reg.Card,{st:stateFor(sl,i,t.f),scale:1,cardId:"exp-"+n}));
      setTimeout(function(){
        var el=wrap.firstElementChild;
        function next(){root.unmount();holder.removeChild(wrap);capture(n+1);}
        if(!el) return next();
        document.fonts.ready.then(function(){
          /* dom-to-image sait produire un JPEG directement ; bgcolor blanc,
             sinon les zones transparentes ressortiraient en noir. */
          return enJpg
            ? domtoimage.toJpeg(el,{width:d.w,height:d.h,useCORS:true,
                quality:Shell.EXPORT_QUALITE_JPG,bgcolor:"#FFFFFF"})
            : domtoimage.toPng(el,{width:d.w,height:d.h,useCORS:true});
        }).then(function(png){
          zip.file((tous?t.f+"/":"")+String(i+1).padStart(2,"0")+"-"+sl.type+(enJpg?".jpg":".png"),
            png.split(",")[1],{base64:true});
          next();
        }).catch(function(err){console.warn("export vignette "+i,err);next();});
      },800);
    }
    capture(0);
    return Promise.resolve();
  }

                  e("button",{className:"mini-btn",disabled:activeIdx===0,
                    onClick:function(){setActiveIdx(activeIdx-1);}},"← Précédent"),
                  e("span",{className:"pos"},(activeIdx+1)+" / "+slides.length),
                  e("button",{className:"mini-btn",disabled:activeIdx>=slides.length-1,
                    onClick:function(){setActiveIdx(activeIdx+1);}},"Suivant →")),
                /* Double-clic sur la vignette agrandie : retour à la grille.
                   Symétrique du double-clic sur une vignette de la grille, qui
                   ouvre la vue Vignette. Le simple clic reste libre pour le
                   déplacement de l'image (glisser-déposer du cadrage). */
                e("div",{className:"car-stage",
                    onDoubleClick:function(){setView("grid");},
                    title:"Double-cliquez pour revenir à la grille",
                    style:{width:Math.round(d.w*s),height:Math.round(d.h*s)}},
                  e("div",{style:{width:d.w,height:d.h,transform:"scale("+s+")",
                      transformOrigin:"top left",position:"absolute",top:0,left:0}},
                    e(reg.Card,{st:stateFor(sl,activeIdx),scale:s,
                      onMeasure:mes.onMeasure,onGarde:mes.onGarde,
                      onBgMove:function(x,y){
                        updSlideState(activeIdx,"bgX_"+st.format,x);
                        updSlideState(activeIdx,"bgY_"+st.format,y);
                      }}))),
                e("div",{className:"hint"},
                  reg.label+(activeIdx===slides.length-1
                    ? "  ·  dernière vignette (repère ●)" : "  ·  repère →")));
            })()));

  /* ═══ RENDU ═════════════════════════════════════════════════════════════ */
  return e("div",{className:"app-layout"},
    panel,
    workspace,
    importType?e(ImportModal,{type:importType,
      onClose:function(){setImportType(null);},
      onPick:function(rec){
        var t=importType;
        setImportType(null);
        /* Aucune conversion : l'état sauvegardé EST l'état de la vignette. */
        var native=rec.state||{};
        var reg=SPGCards.get(t);
        if(reg.normalize) native=reg.normalize(native);
        addSlide({id:sid(),type:t,st:native});
      }}):null,
    zipping?e("div",{className:"car-busy"},
      e("div",{className:"ring"}),
      e("div",null,"Export des vignettes en cours…")):null);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
/* Le démarrage est confié au portail : il attend que les bibliothèques ET
   tous les <script src> de la page soient prêts. Voir assets/boot-gate.js. */
SPGBoot.run(boot);
</script>
</body>
</html>
