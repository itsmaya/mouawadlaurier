loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js","https://unpkg.com/react@18/umd/react.production.min.js"],function(){
loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js","https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"],function(){

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Nunito',sans-serif;background:#f0f0f0;}
#root{min-height:100vh;}
.app-layout{min-height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px;padding-top:68px;padding-bottom:52px;}
@media(min-width:1024px){.app-layout{flex-direction:row;}}
.panel{width:100%;flex-shrink:0;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e5e5e5;padding:16px;height:fit-content;}
@media(min-width:1024px){.panel{width:380px;}}
.section{margin-bottom:20px;}.section:last-child{margin-bottom:0;}
.section>h2{cursor:default;margin:0 -16px 12px;padding:8px 16px;background:#f5f5f3;border-bottom:1px solid #e8e8e8;border-top:1px solid #e8e8e8;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#aaa;}
label.field-label{display:block;font-size:12px;font-weight:600;color:#404040;margin-bottom:4px;}
.hint{font-size:11px;color:#737373;}
input[type=text],textarea{width:100%;font-size:14px;border:1px solid #d4d4d4;border-radius:6px;padding:8px;font-family:'Nunito',sans-serif;}
textarea{resize:vertical;}
input[type=range]{width:100%;accent-color:#1a1a1a;}
.file-drop{position:relative;cursor:pointer;border-radius:8px;border:2px dashed #d4d4d4;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fafafa;height:96px;}
.file-drop.small{height:64px;}
.file-drop:hover{border-color:#a3a3a3;}
.file-drop img{width:100%;height:100%;object-fit:contain;padding:4px;}
.file-drop-empty{display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;font-size:11px;text-align:center;padding:0 6px;}
.file-drop .remove-btn{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px;border:none;cursor:pointer;display:flex;}
.export-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#171717;color:#fff;font-size:14px;font-weight:600;border-radius:8px;padding:13px;border:none;cursor:pointer;margin-top:20px;font-family:inherit;}
.export-btn:hover{background:#303030;}.export-btn:disabled{opacity:.6;cursor:default;}
.preview-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;position:sticky;top:68px;align-self:flex-start;}
@keyframes spin{to{transform:rotate(360deg);}}.spin{animation:spin 1s linear infinite;display:inline-flex;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid #d4d4d4;background:#fff;cursor:pointer;font-family:inherit;}
.seg button.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.upload-hint{font-size:11px;color:#737373;background:#f8f8f8;border:1px solid #e5e5e5;border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.upload-hint b{color:#404040;}
.grad-row{display:flex;gap:8px;}
.grad-sw{flex:1;height:38px;border-radius:8px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .15s;}
.grad-sw:hover{transform:translateY(-1px);}
.grad-sw.on{border-color:#1a1a1a;box-shadow:0 0 0 2px #fff inset,0 2px 8px rgba(0,0,0,.18);}
.col-sw{width:38px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.col-sw.on{border-color:#1a1a1a;box-shadow:0 0 0 2px #fff inset;}
.charte-warn{font-size:11px;line-height:1.45;color:#8a4b00;background:#fff6e6;border:1px solid #f0d29a;border-radius:6px;padding:8px 10px;margin-top:10px;}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;}
.toggle input{accent-color:#1a1a1a;}
.toggle.off{opacity:.45;cursor:not-allowed;}
/* Onglets */
.panel-tabs-wrap{margin:-16px -16px 0;background:#e8e8e6;flex-shrink:0;}
.panel-tabs{display:flex;align-items:flex-end;padding:0 12px;gap:3px;overflow-x:auto;scrollbar-width:none;}
.panel-tabs::-webkit-scrollbar{display:none;}
.panel-tab{padding:9px 16px 8px;font-size:11px;font-weight:700;color:#888;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;border-radius:6px 6px 0 0;background:#d8d8d6;border:1px solid #ccc;border-bottom:none;flex-shrink:0;position:relative;top:1px;transition:background .1s,color .1s;}
.panel-tab:hover{background:#e4e4e2;color:#555;}
.panel-tab.on{background:#fff;color:#1a1a1a;border-color:#ddd;box-shadow:0 -2px 6px rgba(0,0,0,.08);z-index:2;}
.panel-tabs-progress{height:3px;background:#e0e0de;}
.panel-tabs-progress-bar{height:100%;background:#1a1a1a;border-radius:0 2px 0 0;transition:width .2s;}
.panel-tab-content{display:none;padding-top:16px;}
.panel-tab-content.on{display:block;}
.tab-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;gap:8px;}
.tab-nav-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid #ddd;background:#fafafa;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;color:#333;}
.tab-nav-btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
/* Languette droite */
#sm-side-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:999;display:flex;flex-direction:column;gap:0;border-radius:12px 0 0 12px;overflow:hidden;box-shadow:-2px 0 16px rgba(0,0,0,.15);}
.sm-tab-btn{width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;cursor:pointer;padding:0;}
.sm-tab-btn:hover{filter:brightness(.92);}
.sm-tab-btn span{font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
</style>

<body>
<div id="root"></div>
<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect,
    useLayoutEffect=React.useLayoutEffect;

/* ═══ FOND PAR DÉFAUT ══════════════════════════════════════════════════════ */
var BG_DIR="../../templates/split-screen/";
var BG_DEFAULT_FILE="template.png";
function bgCandidates(k){
  var names=["TEMPLATE_SS_"+k,"template_"+k,"template"];
  var exts=[".png",".jpg",".jpeg",".webp"];
  var out=[];
  names.forEach(function(n){exts.forEach(function(x){out.push(BG_DIR+n+x);});});
  return out;
}


/* ═══ STATE ════════════════════════════════════════════════════════════════ */
var DEFAULT={
  format:"1x1", grad:"rouge", lowCarbon:false,
  hasML:false, mlStyle:"grad",
  layout:"left",
  imgRatio:0.61,
  badgeIconKey:"Electricity",
  badgeIconCustom:null,
  badgeMain:"MOBILITÉ ÉLECTRIQUE", badgeSub:"",
  navMark:"arrow",
  textMode:"grad",
  textColor:"#E70000",
  text:"TotalEnergies déploie **20 000 points de recharge**\nsur les autoroutes européennes d'ici 2028.",
  /* image : voir BG_DEFAULT_STATE dans bg-controls.js */
  fs_1x1:0, fs_4x5:0, fs_9x16:0
};
Object.assign(DEFAULT, BG_DEFAULT_STATE);

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],_setSt=a0[1];

  /* Ctrl+Z */
  var historyRef=useRef([]), historyIdx=useRef(-1);
  function setSt(newSt){
    _setSt(function(prev){
      var next=typeof newSt==="function"?newSt(prev):newSt;
      if(JSON.stringify(next)===JSON.stringify(prev)) return prev;
      historyRef.current=historyRef.current.slice(0,historyIdx.current+1);
      historyRef.current.push(prev);
      if(historyRef.current.length>30) historyRef.current.shift();
      historyIdx.current=historyRef.current.length-1;
      return next;
    });
  }
  function undo(){
    if(historyIdx.current<0) return;
    var prev=historyRef.current[historyIdx.current];
    historyIdx.current--;
    _setSt(prev);
  }
  useEffect(function(){
    function onKey(ev){if((ev.ctrlKey||ev.metaKey)&&ev.key==="z"&&!ev.shiftKey){ev.preventDefault();undo();}}
    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey);};
  },[]);

  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  var a4=useState({w:0,h:0}); var bgNat=a4[0],setBgNat=a4[1];
  var cardRef=useRef(null),paveRef=useRef(null);
  var phState=useState(120); var paveH=phState[0],setPaveH=phState[1];
  var bsState=useState({s:"loading",p:null}); var bgStatus=bsState[0],setBgStatus=bsState[1];

  /* Sauvegarde */
  var saveStore=useRef(null);
  if(!saveStore.current) saveStore.current=SaveManager.createStore("splitscreen",{legacy:"splitscreen_saves"});
  var smId=useState(null); var currentId=smId[0],setCurrentId=smId[1];
  var smName=useState(""); var currentName=smName[0],setCurrentName=smName[1];
  var smHash=useRef(null); var smFolder=useRef("");
  var statusRootRef=useRef(null);
  var smDrawer=useState(false); var drawerOpen=smDrawer[0],setDrawerOpen=smDrawer[1];
  var dirty=currentId!==null&&smHash.current!==null&&SaveManager.hashState(st)!==smHash.current;

  /* Onglets */
  var tabState=useState("image"); var activeTab=tabState[0],setActiveTab=tabState[1];
  var TABS=[{id:"image",label:"Image"},{id:"couleurs",label:"Couleurs"},{id:"cartouche",label:"Cartouche"},{id:"texte",label:"Texte"}];

  function set(k,v){setSt(function(p){
    var c=Object.assign({},p); c[k]=v;
    if(k==="grad"&&p.textMode==="uni"&&p.textColor!==COLOR_GREY)
      c.textColor=GRADS[v]?GRADS[v].to:p.textColor;
    return c;
  });}

  function setFormat(k){setSt(function(p){var c=Object.assign({},p);c.format=k;if(k==="9x16")c.hasML=false;return c;});}

  /* Fond par défaut */
  useEffect(function(){
    if(st.bgCustom) return;
    var k=st.format;
    setBgStatus({s:"loading",p:null});
    tryLoadDefault(bgCandidates(k),
      function(dataUrl,srcUrl){
        setSt(function(p){if(p.bgCustom||p.format!==k)return p;var c=Object.assign({},p);c.bgImg=dataUrl;c.bgIsDefault=true;return c;});
        setBgStatus({s:"ok",p:srcUrl});
      },
      function(){
        setSt(function(p){if(p.bgCustom||p.format!==k)return p;var c=Object.assign({},p);c.bgImg=null;c.bgIsDefault=false;return c;});
        setBgStatus({s:"missing",p:null});
      });
  },[st.format,st.bgCustom]);

  /* PictoGallery */
  useEffect(function(){
    window.PictoGallery.load(function(){
      var keys=window.PictoGallery.getKeys();
      setSt(function(p){var c=Object.assign({},p);if(keys.indexOf(p.badgeIconKey)<0)c.badgeIconKey=keys[0];c._pgLoaded=true;return c;});
      var container=document.getElementById("picto-gallery-container");
      if(container&&!container._pg){
        container._pg=window.PictoGallery.init(container,{grad:gradCss(st.grad,90),selected:st.badgeIconKey,custom:st.badgeIconCustom,
          onChange:function(key){setSt(function(p){var c=Object.assign({},p);c.badgeIconKey=key;c.badgeIconCustom=null;return c;});},
          onCustom:function(d){setSt(function(p){var c=Object.assign({},p);c.badgeIconCustom=d;return c;});}});
      }
    });
  },[]);
  useEffect(function(){var ct=document.getElementById("picto-gallery-container");if(ct&&ct._pg)ct._pg.setGrad(gradCss(st.grad,90));},[st.grad]);

  /* Dimensions naturelles image */
  useEffect(function(){
    if(!st.bgImg){setBgNat({w:0,h:0});return;}
    var im=new Image();im.onload=function(){setBgNat({w:im.naturalWidth,h:im.naturalHeight});};im.onerror=function(){setBgNat({w:0,h:0});};im.src=st.bgImg;
  },[st.bgImg]);

  useLayoutEffect(function(){
    if(!paveRef.current) return;
    var h=Math.round(paveRef.current.offsetHeight||0);
    if(h>0&&h!==paveH) setPaveH(h);
  });

  /* StatusBar */
  useEffect(function(){
    var slot=document.getElementById("sm-status-slot");
    if(!slot||!SaveManager.StatusBar) return;
    if(!statusRootRef.current) statusRootRef.current=ReactDOM.createRoot(slot);
    statusRootRef.current.render(e(SaveManager.StatusBar,{
      currentId:currentId,currentName:currentName,dirty:dirty,
      onSave:function(){
        var name=currentName||("Version "+new Date().toLocaleString("fr-FR"));
        saveStore.current.save({id:currentId||undefined,name:name,folder:"",state:st},function(rec){
          if(!rec)return;setCurrentId(rec.id);setCurrentName(rec.name);smHash.current=SaveManager.hashState(st);
        });
      }
    }));
    window.smDrawerToggle=function(){setDrawerOpen(function(o){return !o;});};
    window.smDownloadTrigger=function(){doExport();};
    if(currentId) localStorage.setItem("sm_last_id_splitscreen",currentId);
  },[currentId,currentName,dirty]);

  /* Dernier projet */
  useEffect(function(){
    var hash=window.location.hash;
    if(hash&&hash.indexOf("#exportkey=")===0){
      try{var key=hash.slice(12),raw=localStorage.getItem(key);if(raw){var d=JSON.parse(raw);setSt(Object.assign({},DEFAULT,d));localStorage.removeItem(key);return;}}catch(e){}
    }
    var lastId=localStorage.getItem("sm_last_id_splitscreen");
    if(!lastId)return;
    saveStore.current.get(lastId,function(rec){
      if(!rec||!rec.state)return;
      setSt(Object.assign({},DEFAULT,rec.state));
      setCurrentId(rec.id);setCurrentName(rec.name);
      smFolder.current=rec.folder||"";
      smHash.current=SaveManager.hashState(Object.assign({},DEFAULT,rec.state));
    });
  },[]);

  var G=GRADS[st.grad]||GRADS.bleu;
  var GRAD_H=gradCss(st.grad,90);
  var GRAD_V=gradCss(st.grad,180);
  var L=getLayout(st.format,{hasML:st.hasML});
  var CARD_H=L.CARD_H, EX=L.EXPORT_SCALE;
  var _f=st.format;
  var fs=st["fs_"+_f]||L.TEXT_DEF;
  fs=Math.max(L.TEXT_MIN,Math.min(L.TEXT_MAX,fs));

  /* Disposition Split Screen */
  function computeRects(L2,CH,layout,imgRatio){
    var m=L2.MARGIN,bt=L2.BOTTOM,rt=L2.RIGHT_MIN;
    var left=m,top=m,right=CARD_W-m,bottom=CH-bt;
    var cw=right-left,ch=bottom-top;
    var gap=Math.round(0.04*CH);
    var badgeClear=L2.BADGE_H+gap;
    var img,txt;
    if(layout==="bottom"){
      var ih=Math.round(ch*imgRatio);var imgTop=bottom-ih;
      img={x:left,y:imgTop,w:cw,h:ih};txt={x:left,y:top+badgeClear,w:cw,h:imgTop-gap-(top+badgeClear)};
    } else if(layout==="top"){
      var ih2=Math.round(ch*imgRatio);img={x:left,y:top,w:cw,h:ih2};
      var txtTop=top+ih2+gap;txt={x:left,y:txtTop,w:cw,h:bottom-txtTop};
    } else if(layout==="left"){
      var iw=Math.round(cw*imgRatio);img={x:left,y:top,w:iw,h:ch};
      var txtLeft=left+iw+gap;txt={x:txtLeft,y:top,w:CARD_W-m-rt-iw-gap,h:ch};
    } else {
      var iw2=Math.round(cw*imgRatio);img={x:right-iw2,y:top,w:iw2,h:ch};
      txt={x:left,y:top+badgeClear,w:right-iw2-gap-left,h:ch-badgeClear};
    }
    return {img:img,txt:txt};
  }
  var R=computeRects(L,CARD_H,st.layout,st.imgRatio||0.55);

  var bgX=st["bgX_"+st.format]!==undefined?st["bgX_"+st.format]:50;
  var bgY=st["bgY_"+st.format]!==undefined?st["bgY_"+st.format]:50;
  var bgZoom=st["bgZoom_"+st.format]||100;

  var maxZoom=300;
  if(bgNat.w>0&&bgNat.h>0){
    var outW=Math.round(R.img.w*EX),outH=Math.round(R.img.h*EX);
    var ir=bgNat.w/bgNat.h,cr=outW/outH;
    var coverW=(ir>cr)?outH*ir:outW,coverH=(ir>cr)?outH:outW/ir;
    maxZoom=Math.max(100,Math.min(300,Math.min(Math.floor(bgNat.w/coverW*100),Math.floor(bgNat.h/coverH*100))));
  }

  /* Export Puppeteer */
  var doExport=useCallback(function(){
    if(!cardRef.current)return;
    setBusy(true);
    var exportKey="wie_export_"+Date.now();
    try{localStorage.setItem(exportKey,JSON.stringify(st));}catch(er){}
    var fname=SaveManager.exportFilename(smFolder.current,currentName||(st.badgeSub||st.badgeMain||"split-screen"),st.format);
    var outW=FORMATS[st.format].outputW,outH=FORMATS[st.format].outputH;
    var currentUrl=window.location.href.split("#")[0]+"#exportkey="+exportKey;
    var EXPORT_SERVER="http://localhost:3001";
    fetch(EXPORT_SERVER+"/ping",{signal:AbortSignal.timeout(1500)})
      .then(function(r){if(!r.ok)throw new Error("ping");
        return fetch(EXPORT_SERVER+"/export",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({url:currentUrl,selector:"[data-export-card]",width:outW,height:outH,previewWidth:CARD_W,filename:fname,scale:1})});
      }).then(function(r){return r.blob();})
      .catch(function(){
        return new Promise(function(res,rej){
          document.fonts.ready.then(function(){
            return window.domtoimage.toPng(cardRef.current,{width:CARD_W,height:CARD_H,scale:EX,useCORS:true});
          }).then(function(d){fetch(d).then(function(r){return r.blob();}).then(res).catch(rej);}).catch(rej);
        });
      }).then(function(blob){
        var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();
      }).catch(function(er){console.error(er);})
      .then(function(){setBusy(false);});
  },[st,CARD_H,EX]);

  var previewScale=Math.min(480/CARD_W,(window.innerHeight-140)/CARD_H,1);

  /* Cartouche */
  var badgeFont=L.BADGE_FONT;
  (function(){try{
    var avail=CARD_W-L.MARGIN*2-L.BADGE_ICON-L.BADGE_GAP-L.BADGE_PADX*2;
    var cvs=document.createElement("canvas"),ctx=cvs.getContext("2d");
    ctx.font="800 "+L.BADGE_FONT+"px Nunito";
    var w1=ctx.measureText(st.badgeMain||"").width;
    ctx.font="600 "+L.BADGE_FONT+"px Nunito";
    var w2=ctx.measureText(st.badgeSub?(" \u2013 "+st.badgeSub):"").width;
    var tot=w1+w2;
    if(tot>avail&&tot>0) badgeFont=Math.max(9,L.BADGE_FONT*(avail/tot));
  }catch(ex){}})();

  var badgeBoxStyle={height:L.BADGE_ICON,width:L.BADGE_ICON,borderRadius:L.BADGE_RADIUS,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,backgroundImage:GRAD_H};
  var pillStyle={height:L.BADGE_H,borderRadius:L.BADGE_RADIUS,display:"flex",alignItems:"center",padding:"0 "+L.BADGE_PADX+"px",color:TE_WHITE,fontSize:badgeFont,fontWeight:T.FW_BADGE_MAIN,letterSpacing:".04em",whiteSpace:"nowrap",textTransform:"uppercase",backgroundImage:GRAD_H};

  var onML=st.hasML&&!L.STORY;
  var badgeOnPhoto=(st.layout==="top"||st.layout==="left");
  var badgeNudge=badgeOnPhoto?Math.round(0.035*CARD_H):0;
  var badgeXY={x:L.MARGIN+badgeNudge,y:L.BADGE_TOP+badgeNudge};
  var arrowOnPhoto=(st.layout==="bottom"||st.layout==="right");
  var arrowNudge=arrowOnPhoto?Math.round(0.035*CARD_H):0;
  var cardBgImg=onML&&st.mlStyle==="grad"?GRAD_V:"none";
  var cardBgColor=onML&&st.mlStyle==="grad"?"transparent":"#FFFFFF";
  var charteWarn=(st.lowCarbon&&!G.lowCarbonOK)?"Le dégradé rouge est réservé au pétrole. La charte l'interdit sur les créations traitant des énergies bas carbone.":null;

  var card=e("div",{ref:cardRef,"data-export-card":"1","data-ready":"1",style:{
      width:CARD_W,height:CARD_H,position:"relative",overflow:"hidden",
      fontFamily:"'Nunito',sans-serif",backgroundImage:cardBgImg,backgroundColor:cardBgColor}},

    onML?e("div",{style:{position:"absolute",left:L.ML,top:L.ML,right:L.ML,bottom:L.ML,backgroundColor:"#FFFFFF"}}):null,

    e("div",{"data-layer":"bg",style:{position:"absolute",left:R.img.x,top:R.img.y,width:R.img.w,height:R.img.h,borderRadius:L.IMG_RADIUS,overflow:"hidden",backgroundColor:"#E4E4E4"}},
