<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Split Screen — TotalEnergies</title>
<!-- Nunito servie en local : indispensable pour que l'export intègre la
     police, et pour ne dépendre d'aucun domaine tiers. Voir assets/fonts.css -->
<link rel="stylesheet" href="../../assets/fonts.css"/>
<!-- Portail de démarrage : évite la page blanche au premier chargement.
     Voir assets/boot-gate.js pour le détail de la course qu'il neutralise. -->
<script src="../../assets/boot-gate.js"></script>
<script>
function loadScript(u,d){var i=0;function n(){if(i>=u.length){console.error("No CDN",u);return;}var s=document.createElement("script");s.src=u[i++];s.onload=d;s.onerror=n;document.head.appendChild(s);}n();}
</script>
<script>
loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js","https://unpkg.com/react@18/umd/react.production.min.js","../../assets/vendor/react.production.min.js"],function(){
loadScript(["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js","https://unpkg.com/react-dom@18/umd/react-dom.production.min.js","../../assets/vendor/react-dom.production.min.js"],function(){
loadScript(["https://cdn.jsdelivr.net/npm/dom-to-image-more@3.4.0/dist/dom-to-image-more.min.js","https://unpkg.com/dom-to-image-more@3.4.0/dist/dom-to-image-more.min.js","../../assets/vendor/dom-to-image-more.min.js"],function(){SPGBoot.libsReady();});});});
</script>
<script src="../../assets/header.js"></script>
<script>window.PICTO_BASE="../../assets/";</script>
<script src="../../assets/pictos.js"></script>
<script src="../../assets/save-manager.js"></script>
<script src="../../assets/charte-2026.js"></script>
<script src="../../assets/te-charte.js"></script>
<script src="../../assets/rich-body.js"></script>
<script src="../../assets/drag-image.js"></script>
<script src="../../assets/bg-controls.js"></script>
<script src="../../assets/app-shell.js"></script>
<script src="../../assets/cards/registry.js"></script>
<script src="../../assets/cards/split-screen-card.js"></script>
</head>
<body>
<div id="root"></div>
<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useEffect=React.useEffect,useLayoutEffect=React.useLayoutEffect;
var UI=Shell.ui;

/* ═══ CONFIG ══════════════════════════════════════════════════════════════ */
var PAGE_FORMATS=SPGCards.get("splitscreen").formats;
var BG_DIR="../../templates/split-screen/";
function bgCandidates(k){
  var names=["TEMPLATE_SS_"+k,"template_"+k,"template"];
  var exts=[".png",".jpg",".jpeg",".webp"];
  var out=[];
  names.forEach(function(n){exts.forEach(function(x){out.push(BG_DIR+n+x);});});
  return out;
}

/* ═══ STATE ═══════════════════════════════════════════════════════════════
   L'état par défaut vit dans le module de carte partagé : la page et le
   Carrousel partent exactement du même point. */
var CARD=SPGCards.get("splitscreen");
var DEFAULT=CARD.DEFAULT;


/* ═══ APP ═════════════════════════════════════════════════════════════════ */
function App(){
  var shell=Shell.useApp({pageKey:"splitscreen",DEFAULT:DEFAULT,bgCandidates:bgCandidates});
  var st=shell.st, _set=shell.set, setSt=shell.setSt;

  var cardRef=useRef(null);
  var tabState=useState("image"); var activeTab=tabState[0],setActiveTab=tabState[1];
  var TABS=[
    {id:"image",label:"Image"},{id:"couleurs",label:"Couleurs"},
    {id:"cartouche",label:"Cartouche"},{id:"texte",label:"Texte"},{id:"export",label:"Export"}
  ];

  /* set local : sync dégradé → couleur texte si mode uni */
  function set(k,v){
    if(k==="grad"&&st.textMode==="uni"&&st.textColor!==COLOR_GREY){
      setSt(function(p){var c=Object.assign({},p);c.grad=v;
        c.textColor=GRADS[v]?GRADS[v].to:p.textColor;return c;});
    } else { _set(k,v); }
  }

  function setFormat(k){
    setSt(function(p){var c=Object.assign({},p);c.format=k;
      if(k==="9x16")c.hasML=false;return c;});
  }


  /* ═══ VALEURS DÉRIVÉES (panneau uniquement) ══════════════════════════ */
  var G=GRADS[st.grad]||GRADS.bleu;
  var GRAD_H=gradCss(st.grad,90);
  var L=getLayout(st.format,{hasML:st.hasML});
  var CARD_H=L.CARD_H, EX=L.EXPORT_SCALE;
  var onML=st.hasML&&!L.STORY;
  var cf=chFormat(st.format);
  var previewScale=UI.previewScale(cf);
  var bgNat=shell.bgNat;

  /* maxZoom basé sur la zone image du split (≠ carte entière) */
  var R=CARD.computeRects(L,CARD_H,st.layout,st.imgRatio||0.55);
  var maxZoom=300;
  if(bgNat.w>0&&bgNat.h>0){
    var outW=Math.round(R.img.w*EX),outH=Math.round(R.img.h*EX);
    var ir=bgNat.w/bgNat.h,cr=outW/outH;
    var coverW=(ir>cr)?outH*ir:outW,coverH=(ir>cr)?outH:outW/ir;
    maxZoom=Math.max(100,Math.min(300,Math.min(
      Math.floor(bgNat.w/coverW*100),Math.floor(bgNat.h/coverH*100))));
  }

  /* Taille de police effective (le slider du panneau en a besoin) */
  var fs=st["fs_"+st.format]||L.TEXT_DEF;
  fs=Math.max(L.TEXT_MIN,Math.min(L.TEXT_MAX,fs));

  var charteWarn=(st.lowCarbon&&!G.lowCarbonOK)
    ?"Le dégradé rouge est réservé au pétrole. La charte l'interdit sur les créations traitant des énergies bas carbone.":null;

  /* ═══ CARTE ═══════════════════════════════════════════════════════════
     Composant partagé : voir assets/cards/split-screen-card.js.
     Ne PAS réimplémenter le visuel ici — le Carrousel rend le même. */
  var card=e(CARD.Card,{
    st:st, cardRef:cardRef, exportTarget:true,
    scale:previewScale, bgNat:bgNat,
    onBgMove:function(x,y){ setSt(function(p){ var c=Object.assign({},p);
      c["bgX_"+p.format]=x; c["bgY_"+p.format]=y; return c; }); }
  });

  /* ═══ PANNEAU ════════════════════════════════════════════════════════= */
  var panel=e("div",{className:"panel"},

    e(UI.Section,{title:"Format"},
      e(UI.FormatPicker,{formats:PAGE_FORMATS,value:st.format,onChange:setFormat})),

    e(UI.Tabs,{tabs:TABS,active:activeTab,onChange:setActiveTab}),

    /* ── Image ── */
    e("div",{className:"panel-tab-content"+(activeTab==="image"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Disposition"),
      e(UI.SegButtons,{value:st.layout,onChange:function(v){set("layout",v);},
        options:[{v:"bottom",l:"Bas"},{v:"top",l:"Haut"},{v:"left",l:"Gauche"},{v:"right",l:"Droite"}]}),
      e("div",{style:{height:8}}),
      e("label",{className:"field-label"},
        (st.layout==="left"||st.layout==="right"?"Largeur":"Hauteur")+" photo — "+Math.round((st.imgRatio||0.55)*100)+" %"),
      e("input",{type:"range",min:30,max:72,step:1,value:Math.round((st.imgRatio||0.55)*100),
        onChange:function(ev){set("imgRatio",parseInt(ev.target.value,10)/100);}}),
      e("div",{style:{height:12}}),
      e(BgPhotoPanel,{st:st,set:set,setSt:setSt,format:st.format,
        bgStatus:shell.bgStatus,bgNat:bgNat,bgDir:BG_DIR,maxZoom:maxZoom}),
      e("div",{style:{marginTop:8}}),
      e("label",{className:"toggle"+(L.STORY?" off":"")},
        e("input",{type:"checkbox",checked:st.hasML,disabled:L.STORY,
          onChange:function(ev){set("hasML",ev.target.checked);}}),
        "Encadré marie-louise"),
      onML?e("div",{style:{marginTop:8}},
        e(UI.SegButtons,{value:st.mlStyle,onChange:function(v){set("mlStyle",v);},
          options:[{v:"white",l:"Blanche"},{v:"grad",l:"Dégradée"}]})):null,
      e(UI.TabNav,{next:"Couleurs",onNext:function(){setActiveTab("couleurs");}})),

    /* ── Couleurs ── */
    e("div",{className:"panel-tab-content"+(activeTab==="couleurs"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Dégradé actif"),
      e(UI.GradPicker,{value:st.grad,onChange:function(v){set("grad",v);}}),
      e("div",{style:{height:14}}),
      e("label",{className:"field-label"},"Couleur du texte"),
      e(UI.SegButtons,{value:st.textMode,onChange:function(v){set("textMode",v);},
        options:[{v:"uni",l:"Couleur unie"},{v:"grad",l:"Dégradé diagonal"}]}),
      st.textMode==="uni"?e(React.Fragment,null,
        e("div",{style:{display:"flex",gap:8,marginTop:8}},
          e("div",{style:{width:48,height:30,borderRadius:6,cursor:"pointer",
              backgroundImage:GRAD_H,
              border:st.textColor!==COLOR_GREY?"2px solid #1a1a1a":"2px solid #e5e5e5"},
            onClick:function(){set("textColor",G.to);}}),
          e("div",{style:{width:48,height:30,borderRadius:6,cursor:"pointer",
              background:COLOR_GREY,
              border:st.textColor===COLOR_GREY?"2px solid #1a1a1a":"2px solid #e5e5e5"},
            onClick:function(){set("textColor",COLOR_GREY);}})),
        e("div",{className:"hint",style:{marginTop:6}},"La couleur suit automatiquement le dégradé.")):null,
      e("div",{style:{height:12}}),
      e("label",{className:"toggle"},
        e("input",{type:"checkbox",checked:!!st.lowCarbon,
          onChange:function(ev){set("lowCarbon",ev.target.checked);}}),
        "Sujet énergie bas carbone"),
      charteWarn?e("div",{className:"charte-warn"},e("b",null,"Charte : "),charteWarn):null,
      e(UI.TabNav,{
        prev:"Image",onPrev:function(){setActiveTab("image");},
        next:"Cartouche",onNext:function(){setActiveTab("cartouche");}})),

    /* ── Cartouche ── */
    e("div",{className:"panel-tab-content"+(activeTab==="cartouche"?" on":""),style:{paddingTop:16}},
      e(UI.BadgeEditor,{st:st,set:set,setSt:setSt,active:activeTab==="cartouche",uppercase:true}),
      e("div",{style:{height:12}}),
      e(UI.NavMarkPicker,{value:st.navMark,onChange:function(v){set("navMark",v);}}),
      e(UI.TabNav,{
        prev:"Couleurs",onPrev:function(){setActiveTab("couleurs");},
        next:"Texte",onNext:function(){setActiveTab("texte");}})),

    /* ── Texte ── */
    e("div",{className:"panel-tab-content"+(activeTab==="texte"?" on":""),style:{paddingTop:16}},
      e("div",{className:"upload-hint",style:{marginBottom:6}},
        e("b",null,"**mot**")," = surlignage  •  ",e("b",null,"__mot__")," = soulignage"),
      e("textarea",{spellCheck:true,rows:5,value:st.text,
        onChange:function(ev){set("text",ev.target.value);},
        style:{fontSize:13,lineHeight:1.5}}),
      e("div",{style:{height:12}}),
      e(UI.SliderField,{label:"Taille — "+fs.toFixed(0)+" px",
        min:L.TEXT_MIN,max:L.TEXT_MAX,step:1,value:fs,
        onChange:function(v){setSt(function(p){var c=Object.assign({},p);c["fs_"+p.format]=Math.round(v);return c;});}}),
      e(UI.TabNav,{
        prev:"Cartouche",onPrev:function(){setActiveTab("cartouche");},
        next:"Export",onNext:function(){setActiveTab("export");}})),

    /* ── Export ── */
    e("div",{className:"panel-tab-content"+(activeTab==="export"?" on":""),style:{paddingTop:16}},
      e(UI.ExportTab,{shell:shell,cardRef:cardRef}))
  );


  return e("div",{className:"app-layout"},
    panel,
    e("div",{className:"preview-wrap"},e(UI.Stage,{cf:cf},card)));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
/* Le démarrage est confié au portail : il attend que les bibliothèques ET
   tous les <script src> de la page soient prêts. Voir assets/boot-gate.js. */
SPGBoot.run(boot);
</script>
</body>
</html>
