<div id="root"></div>
<script>
function boot(){

/* ═══ CHARTE TOTALENERGIES V8 ═════════════════════════════════════════════
   Les 4 dégradés principaux, valeurs exactes de la charte (slide "Couleurs
   principales"). Le dégradé est construit de la couleur du haut à la
   couleur du bas du bloc.
   ══════════════════════════════════════════════════════════════════════════ */
var GRADS={
  bleu:  {label:"Bleu",   from:"#0098E3", to:"#4632FF", lowCarbonOK:true },
  cyan:  {label:"Cyan",   from:"#0197E6", to:"#00A55E", lowCarbonOK:true },
  vert:  {label:"Vert",   from:"#3EA400", to:"#00884A", lowCarbonOK:true },
  rouge: {label:"Rouge",  from:"#EB6A17", to:"#E70000", lowCarbonOK:false}
};
function gradCss(k,deg){var g=GRADS[k]||GRADS.bleu;
  return "linear-gradient("+(deg===undefined?90:deg)+"deg,"+g.from+" 0%,"+g.to+" 100%)";}

/* ═══ COULEURS TEXTE — charte "Textes", fond blanc uniquement ════════════
   Autorisé : gris foncé, les 4 couleurs unies de fin de dégradé principal,
              ou le dégradé lui-même appliqué en diagonal.
   Interdit  : toutes les couleurs secondaires (turquoise, fluo green, etc.)
   Si le paragraphe dépasse 5 lignes : préférer gris ou couleur unie (charte).
   ══════════════════════════════════════════════════════════════════════════ */
/* Couleur gris foncé autorisée sur fond blanc, indépendamment du dégradé actif */
var COLOR_GREY="#374649";
var TE_WHITE="#FFFFFF";

/* ═══ LAYOUT ══════════════════════════════════════════════════════════════
   Toutes les valeurs de la charte sont exprimées sur un canevas 1080 px.
   La carte de preview fait 600 px de large : K = 600/1080 = 0.5556.
   Chaque constante ci-dessous est donc la valeur charte × K, arrondie.
   ══════════════════════════════════════════════════════════════════════════ */
var CARD_W=600, K=600/1080;
function px(v){return Math.round(v*K);}   /* charte px → card px */

var FORMATS={
  "1x1" :{label:"Carré 1:1",   outputW:1080,outputH:1080,cardH:600 },
  "4x5" :{label:"Portrait 4:5",outputW:1080,outputH:1350,cardH:750 },
  "9x16":{label:"Story 9:16",  outputW:1080,outputH:1920,cardH:1067}
};

/* Marie-louise : 50 px de charte → 28 px carte.
   Avec marie-louise, le cartouche passe à 100 px de marge (28 + 28). */
var ML_W=px(50);

/* ════════════════════════════════════════════════════════════════════════════
   TYPO & MISE EN PAGE — toutes les valeurs éditables sont ici.
   Les valeurs sont exprimées en PT CHARTE (base 1080px).
   La fonction px() les convertit en pixels de carte (600px de large).

   CARTOUCHE LÉGENDE
   ──────────────────────────────────────────────────────────────────────── */
var T={
  /* Cartouche : boîte icône */
  BADGE_H_PT      : 70,   /* hauteur de la pilule texte (pt charte) */
  BADGE_ICON_PT   : 70,   /* taille de la boîte icône carrée */
  BADGE_ICON_RATIO: 0.68, /* taille de l'icône dans la boîte (0.68 = 68%) */
  BADGE_GAP_PT    : 15,   /* espace entre boîte icône et pilule texte */
  BADGE_RADIUS_PT : 22,   /* rayon des coins du cartouche */
  BADGE_PADX_PT   : 25,   /* padding horizontal intérieur de la pilule */
  BADGE_FONT_PT   : 30,   /* taille de la police du cartouche */

  /* Pavé de texte */
  PAVE_PAD_PT     : 30,   /* padding intérieur du pavé blanc */
  PAVE_RADIUS_PT  : 22,   /* rayon des coins du pavé */

  /* Flèche / point de carrousel */
  ARROW_W_PT      : 90,   /* largeur bouton carrousel (90 px export) */
  ARROW_H_PT      : 71,   /* hauteur bouton carrousel (71 px export) */
  ARROW_RADIUS_PT : 11,   /* rayon des coins — exposé dans le panneau */
  ARROW_GAP_PT    : 30,   /* espace entre pavé et flèche (50 en story) */
  ARROW_GAP_STORY : 50,   /* espace entre pavé et flèche en story */

  /* Texte du bloc (charte Split Screen : 40–60pt) */
  TEXT_MIN_PT     : 40,   /* taille minimum autorisée par la charte */
  TEXT_MAX_PT     : 60,   /* taille maximum autorisée par la charte */
  TEXT_DEF_PT     : 48,   /* taille par défaut au lancement */
  TEXT_LH         : 1.25, /* interligne (ratio × taille) */

  /* Graisses — fontWeight */
  FW_TEXT         : 500,  /* texte courant du pavé (SemiBold) */
  FW_HIGHLIGHT    : 500,  /* mots surlignés **comme ça** (ExtraBold) */
  FW_UNDERLINE    : 600,  /* mots soulignés __comme ça__ (SemiBold) */
  FW_BADGE_MAIN   : 600,  /* titre cartouche ex. "LATEST NEWS" (ExtraBold) */
  FW_BADGE_SUB    : 200,  /* précision cartouche ex. lieu (SemiBold) */

  /* Surlignage */
  HIGHLIGHT_PAD_X : 0.28, /* espace horizontal autour du bloc surligné (× fs) */
  HIGHLIGHT_H     : 1.14, /* hauteur du rectangle de surlignage (× fs) */

  /* Soulignage */
  UNDERLINE_TH    : 0.17, /* épaisseur de la barre (× fs, min 3px) */
  UNDERLINE_OFF   : 0.03, /* décalage sous la baseline (× fs) */
};
/* ════════════════════════════════════════════════════════════════════════════ */

function getLayout(k,hasML){
  var f=FORMATS[k]||FORMATS["1x1"];
  var story=(k==="9x16");
  var base = story ? px(80) : px(50);
  var ml   = (!story && hasML) ? ML_W : 0;
  var margin = base+ml;
  return {
    CARD_H:f.cardH, EXPORT_SCALE:f.outputW/CARD_W, STORY:story, ML:ml,
    MARGIN: margin,
    BADGE_TOP: story ? px(180) : margin,
    RIGHT_MIN: (story ? px(160) : px(100)) + ml,
    BOTTOM:    story ? px(180) : margin,
    IMG_RADIUS: px(20),
    BADGE_H:px(T.BADGE_H_PT), BADGE_ICON:px(T.BADGE_ICON_PT),
    BADGE_GAP:px(T.BADGE_GAP_PT), BADGE_RADIUS:px(T.BADGE_RADIUS_PT),
    BADGE_PADX:px(T.BADGE_PADX_PT), BADGE_FONT:px(T.BADGE_FONT_PT),
    ARROW_W:px(T.ARROW_W_PT), ARROW_H:px(T.ARROW_H_PT), ARROW_RADIUS:px(T.ARROW_RADIUS_PT),
    TEXT_MIN:px(T.TEXT_MIN_PT), TEXT_MAX:px(T.TEXT_MAX_PT),
    TEXT_DEF:px(T.TEXT_DEF_PT), TEXT_LH:T.TEXT_LH
  };
}

/* ═══ PARSEUR ═════════════════════════════════════════════════════════════
   **mot** = surlignage dégradé    __mot__ = soulignage dégradé
   Identique au générateur Citation, pour que les deux outils partagent
   la même syntaxe côté utilisateur.
   ══════════════════════════════════════════════════════════════════════════ */
function parseRich(t){
  var out=[],re=/(\*\*[\s\S]+?\*\*|__[\s\S]+?__)/g,last=0,m;
  while((m=re.exec(t))!==null){
    if(m.index>last) out.push({t:"n",v:t.slice(last,m.index)});
    out.push(m[0].slice(0,2)==="**"?{t:"h",v:m[0].slice(2,-2)}:{t:"u",v:m[0].slice(2,-2)});
    last=re.lastIndex;
  }
  if(last<t.length) out.push({t:"n",v:t.slice(last)});
  return out;
}

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect,
    useLayoutEffect=React.useLayoutEffect;

/* Interpolation couleur hex — utilisée dans RichBody ET dans doExport */
function lerpHex(c1,c2,t){
  function hx(s){return parseInt(s.slice(1),16);}
  var a=hx(c1),b=hx(c2);
  var ar=(a>>16)&255,ag=(a>>8)&255,ab=a&255;
  var br=(b>>16)&255,bg=(b>>8)&255,bb=b&255;
  var r=Math.round(ar+(br-ar)*t);
  var g=Math.round(ag+(bg-ag)*t);
  var bl=Math.round(ab+(bb-ab)*t);
  return "rgb("+r+","+g+","+bl+")";
}

/* ═══ CORPS DE TEXTE RICHE ════════════════════════════════════════════════
   Les surlignages / soulignages sont mesurés ligne par ligne puis dessinés
   comme des rectangles absolus. html2canvas ne sait pas gérer
   box-decoration-break sur du texte inline : sans ça l'export est faux.

   Exception LATEST NEWS de la charte : le texte courant est en Regular (400)
   et les mots surlignés en ExtraBold (800).
   ══════════════════════════════════════════════════════════════════════════ */
function RichBody(props){
  var fs=props.fs, lh=props.lh, grad=props.grad;
  var hostRef=useRef(null);
  var s0=useState({h:[],u:[],n:[]}); var M=s0[0],setM=s0[1];
  var s1=useState(0); var setTick=s1[1];

  useEffect(function(){
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(function(){ setTick(function(t){return t+1;}); });
    }
  },[]);

  useLayoutEffect(function(){
    var host=hostRef.current; if(!host) return;
    var base=host.getBoundingClientRect();
    var SC = host.offsetWidth ? (base.width/host.offsetWidth) : 1;
    if(!SC || !isFinite(SC) || SC<=0) SC=1;
    function N(v){ return v/SC; }

    var res={h:[],u:[],n:[]};
    var segs=host.querySelectorAll("[data-seg]");
    for(var i=0;i<segs.length;i++){
      var kind=segs[i].getAttribute("data-seg");
      var rs=segs[i].getClientRects();
      for(var j=0;j<rs.length;j++){
        var r=rs[j]; if(r.width<0.5) continue;
        var o={x:N(r.left-base.left),y:N(r.top-base.top),
               w:N(r.width),h:N(r.height),b:N(r.bottom-base.top)};
        if(kind==="h") res.h.push(o);
        else if(kind==="u") res.u.push(o);
        else res.n.push(o);
      }
    }
    if(JSON.stringify(res)!==JSON.stringify(M)) setM(res);
  });

  /* Parseur → tableau de tokens, avec support saut de ligne \n → br */
  function renderParts(text,useGrad,color){
    /* On découpe d'abord sur \n pour gérer les sauts de ligne */
    var lines=text.split("\n");
    var out=[];
    lines.forEach(function(line,li){
      if(li>0) out.push(e("br",{key:"br"+li}));
      var parts=parseRich(line);
      parts.forEach(function(p,pi){
        var key=li+"-"+pi;
        if(p.t==="h"){
          /* Espace insécable avant/après le bloc surligné */
          out.push(e("span",{key:key+"a",style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},"\u00a0"));
          out.push(e("span",{key:key,"data-seg":"h",
            style:{color:TE_WHITE,fontWeight:T.FW_HIGHLIGHT,fontFamily:"'Nunito',sans-serif",
                   WebkitTextFillColor:TE_WHITE}},p.v));
          out.push(e("span",{key:key+"b",style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},"\u00a0"));
        } else if(p.t==="u"){
          out.push(e("span",{key:key,"data-seg":"u",
            style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_UNDERLINE,
                   color:useGrad?"transparent":color,
                   WebkitTextFillColor:useGrad?"transparent":undefined}}
            ,p.v));
        } else {
          out.push(useGrad
            ? e("span",{key:key,"data-seg":"n",
                style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT,
                       color:"transparent",WebkitTextFillColor:"transparent"}},p.v)
            : e("span",{key:key,
                style:{fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT}},p.v));
        }
      });
    });
    return out;
  }

  var useGrad=(props.textMode==="grad");

  /* Surlignage */
  var H_PAD_X=fs*T.HIGHLIGHT_PAD_X;
  var H_H=fs*T.HIGHLIGHT_H;
  /* Soulignage */
  var U_TH=Math.max(3,fs*T.UNDERLINE_TH);
  var U_OFF=fs*T.UNDERLINE_OFF;

  /* Dégradé diagonal sur texte normal */
  var gradFrom=props.gradFrom||"#0098E3";
  var gradTo=props.gradTo||"#4632FF";
  var nMinX=Infinity,nMinY=Infinity,nMaxX=-Infinity,nMaxY=-Infinity;
  if(useGrad&&M.n.length){
    M.n.forEach(function(r){
      nMinX=Math.min(nMinX,r.x); nMinY=Math.min(nMinY,r.y);
      nMaxX=Math.max(nMaxX,r.x+r.w); nMaxY=Math.max(nMaxY,r.y+r.h);
    });
  }

  return e("div",{style:{position:"relative"}},

    M.h.map(function(r,i){
      var cy=r.y+r.h/2;
      return e("div",{key:"h"+i,style:{position:"absolute",
        left:r.x-H_PAD_X, top:cy-H_H/2, width:r.w+H_PAD_X*2, height:H_H,
        backgroundImage:grad, borderRadius:2, zIndex:0}});
    }),

    M.u.map(function(r,i){
      return e("div",{key:"u"+i,style:{position:"absolute",
        left:r.x, top:r.b-U_OFF, width:r.w, height:U_TH,
        backgroundImage:grad, borderRadius:U_TH/2, zIndex:0}});
    }),

    useGrad&&M.n.length?(function(){
      var spanW=nMaxX-nMinX, spanH=nMaxY-nMinY, span=spanW+spanH||1;
      return M.n.map(function(r,i){
        var t=((r.x+r.w/2-nMinX)+(r.y+r.h/2-nMinY))/span;
        t=Math.max(0,Math.min(1,t));
        /* Rectangles uniquement pour l'export html2canvas (data-grad-rect).
           En preview ils sont rendus invisibles : le texte porte la couleur
           via background-clip:text ci-dessous. */
        return e("div",{key:"ng"+i,"data-grad-rect":"1",style:{position:"absolute",
          left:r.x-1,top:r.y,width:r.w+2,height:r.h,
          background:lerpHex(gradFrom,gradTo,t),zIndex:1,
          opacity:0,pointerEvents:"none"}});
      });
    })():null,

    e("div",{ref:hostRef,"data-richhost":"1",style:{position:"relative",zIndex:2,
        fontFamily:"'Nunito',sans-serif",fontWeight:T.FW_TEXT,
        /* Mode dégradé : background-clip:text en preview.
           L'export utilise les rects data-grad-rect rendus opaques à la volée. */
        background:useGrad?undefined:undefined,
        backgroundImage:useGrad?grad:undefined,
        WebkitBackgroundClip:useGrad?"text":undefined,
        backgroundClip:useGrad?"text":undefined,
        color:useGrad?"transparent":props.color,
        WebkitTextFillColor:useGrad?"transparent":undefined,
        fontSize:fs,lineHeight:lh,textAlign:props.align}},
      props.live?e("span",{style:{display:"inline-block",
        width:fs*0.9,height:fs*0.9,borderRadius:"50%",
        background:"#E70000",marginRight:fs*0.28,
        verticalAlign:"middle",marginBottom:fs*0.08,flexShrink:0}}):null,
      renderParts(props.text,useGrad,props.color))
  );
}

/* ─── Flèche de navigation (carrousel) ─────────────────────────────────── */
var AID=0;
function NavMark(p){

/* ═══ IndexedDB ════════════════════════════════════════════════════════════
   DB_VERSION passe à 5 pour créer le store splitscreen_saves, propre à ce
   générateur (indépendant de latestnews_saves).
   ⚠ La même valeur doit être reportée dans les autres générateurs,
   sinon leurs sauvegardes cassent silencieusement.
   ══════════════════════════════════════════════════════════════════════════ */
var DB_NAME="wie_db",DB_VERSION=5,STORE="splitscreen_saves";
function openDB(ok,ko){var q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=function(ev){var db=ev.target.result;["saves","citation_saves","latestnews_saves","carrousel_saves","splitscreen_saves"].forEach(function(s){if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:"name"});});};q.onsuccess=function(ev){ok(ev.target.result);};q.onerror=function(){ko&&ko();};}
function dbAll(cb){openDB(function(db){var q=db.transaction(STORE,"readonly").objectStore(STORE).getAll();q.onsuccess=function(ev){var a=ev.target.result||[];a.sort(function(x,y){return y.date>x.date?1:-1;});cb(a);};q.onerror=function(){cb([]);};},function(){cb([]);});}
function dbPut(en,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(en);t.oncomplete=cb||function(){};});}
function dbDel(n,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE)["delete"](n);t.oncomplete=cb||function(){};});}
function dbPutAll(a,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite"),s=t.objectStore(STORE);a.forEach(function(x){s.put(x);});t.oncomplete=cb||function(){};});}

var BG_DIR="../../templates/split-screen/";
var BG_DEFAULT_FILE="template.png";
function bgCandidates(k){
  return [BG_DIR+BG_DEFAULT_FILE];

function tryLoad(cands,cb){
  var i=0;
  (function next(){
    if(i>=cands.length) return cb(null);
    var u=cands[i++], im=new Image();
    im.onload=function(){cb(u);};
    im.onerror=next;
    im.src=u;
  })();
}

/* ═══ DRAG IMAGE ═══════════════════════════════════════════════════════════
   Affiche l'image de fond dans un conteneur overflow:hidden.
   L'image est positionnée par object-position (%) controllée par drag.
   Le zoom est un scale supplémentaire (100% = cover normal).
   Le drag reçoit l'offset en px sur la carte et le convertit en %.
   ══════════════════════════════════════════════════════════════════════════ */
function DragImage(props){
  var dragRef=useRef(null);
  var dragging=useRef(false);
  var last=useRef({x:0,y:0});
  var natRef=useRef({w:0,h:0});

  function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

  function onDown(ev){
    if(!props.src) return;
    ev.preventDefault();
    dragging.current=true;
    var pt=ev.touches?ev.touches[0]:ev;
    last.current={x:pt.clientX,y:pt.clientY};
  }
  function onMove(ev){
    if(!dragging.current) return;
    ev.preventDefault();
    var pt=ev.touches?ev.touches[0]:ev;
    var dx=pt.clientX-last.current.x;
    var dy=pt.clientY-last.current.y;
    last.current={x:pt.clientX,y:pt.clientY};
    /* Dimensions de l'image après cover + zoom, en px preview */
    var cw=props.w, ch=props.h;
    var nat=natRef.current;
    var zf=(props.zoom||100)/100;
    var iw,ih;
    if(nat.w>0&&nat.h>0){
      var ir=nat.w/nat.h, cr=cw/ch;
      if(ir>cr){ih=ch;iw=ih*ir;}else{iw=cw;ih=iw/ir;}
    } else {
      iw=cw; ih=ch;
    }
    iw*=zf; ih*=zf;
    /* Plage de déplacement réelle en px */
    var rangeX=Math.max(0,iw-cw);
    var rangeY=Math.max(0,ih-ch);
    /* Convertir drag px → delta % */
    var dPctX=rangeX>0 ? dx/rangeX*100 : 0;
    var dPctY=rangeY>0 ? dy/rangeY*100 : 0;
    var pctX=clamp(props.x - dPctX, 0, 100);
    var pctY=clamp(props.y - dPctY, 0, 100);
    props.onChange(pctX,pctY);
  }
  function onUp(){ dragging.current=false; }

  useEffect(function(){
    /* Charger les dimensions naturelles de l'image pour calcul du drag */
    if(props.src){
      var im=new Image();
      im.onload=function(){natRef.current={w:im.naturalWidth,h:im.naturalHeight};};
      im.src=props.src;
    } else {
      natRef.current={w:0,h:0};
    }
  },[props.src]);

  useEffect(function(){
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onUp);
    return function(){
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
      window.removeEventListener("touchmove",onMove);
      window.removeEventListener("touchend",onUp);
    };
  });

  var zoom=props.zoom||100;
  var zf=zoom/100;
  var cw=props.w, ch=props.h;
  var nat=natRef.current;
  var iw,ih;
  if(nat.w>0&&nat.h>0){
    var ir=nat.w/nat.h, cr=cw/ch;
    if(ir>cr){ih=ch;iw=ih*ir;}else{iw=cw;ih=iw/ir;}
  } else {
    iw=cw; ih=ch;
  }
  iw*=zf; ih*=zf;
  /* Position left/top en px depuis les % x/y */
  var rangeX=Math.max(0,iw-cw);
  var rangeY=Math.max(0,ih-ch);
  var left=(cw-iw)/2 + rangeX*(1-props.x/100);
  var top =(ch-ih)/2 + rangeY*(1-props.y/100);

  return e("div",{ref:dragRef,
    style:{position:"absolute",inset:0,overflow:"hidden",
      cursor:props.src?"grab":"default"},
    onMouseDown:onDown,
    onTouchStart:onDown},
    props.src?e("img",{src:props.src,alt:"",
      style:{position:"absolute",
        width:iw+"px", height:ih+"px",
        left:left+"px", top:top+"px",
        filter:props.blur>0?"blur("+Math.round(props.blur)+"px)":"none",
        userSelect:"none",pointerEvents:"none"}}):null
  );
}

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],setSt=a0[1];
  var a1=useState([]),saves=a1[0],setSaves=a1[1];
  var a2=useState(""),sname=a2[0],setSname=a2[1];
  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  /* Dimensions naturelles de l'image de fond pour calculer le zoom max */
  var a4=useState({w:0,h:0}); var bgNat=a4[0],setBgNat=a4[1];
  var cardRef=useRef(null),impRef=useRef(null),paveRef=useRef(null);
  var phState=useState(120); var paveH=phState[0],setPaveH=phState[1];
  var bsState=useState({s:"loading",p:null}); var bgStatus=bsState[0],setBgStatus=bsState[1];
  function set(k,v){setSt(function(p){
    var c=Object.assign({},p);
    c[k]=v;
    /* Synchronisation couleur texte ↔ dégradé actif ────────────────────────
       Règle : en mode "uni", la couleur du texte doit appartenir à la gamme
       du dégradé actif ou être le gris foncé.
       → quand on change de dégradé, on met à jour textColor si elle ne
         correspond plus au nouveau dégradé (sauf si c'est le gris).
       → quand on passe en mode "grad", textColor n'est plus utilisé. */
    if(k==="grad" && p.textMode==="uni" && p.textColor!==COLOR_GREY){
      /* Passer à la couleur de fin du nouveau dégradé */
      c.textColor=GRADS[v]?GRADS[v].to:p.textColor;
    }
    return c;
  });}

  /* Changement de format : la marie-louise n'existe pas en story.
     Le fond par défaut est rechargé par la sonde ci-dessous. */
  function setFormat(k){
    setSt(function(p){
      var c=Object.assign({},p);
      c.format=k;
      if(k==="9x16") c.hasML=false;   /* charte : jamais de marie-louise en story */
      return c;
    });
  }

  /* Sonde du fond par défaut : au démarrage, puis à chaque changement de
     format, tant que l'utilisateur n'a pas déposé sa propre image. */
  useEffect(function(){
    if(st.bgCustom) return;
    var k=st.format;
    setBgStatus({s:"loading",p:null});
    tryLoad(bgCandidates(k),function(u){
      if(!u){
        setSt(function(p){
          if(p.bgCustom||p.format!==k) return p;
          var c=Object.assign({},p); c.bgImg=null; c.bgIsDefault=false; return c;
        });
        setBgStatus({s:"missing",p:null});
        return;
      }
      /* Charger en base64 pour affichage dans FileDrop, comme un vrai dépôt */
      var xhr=new XMLHttpRequest();
      xhr.open("GET",u,true);
      xhr.responseType="blob";
      xhr.onload=function(){
        var rd=new FileReader();
        rd.onload=function(ev){
          var dataUrl=ev.target.result;
          setSt(function(p){
            if(p.bgCustom||p.format!==k) return p;
            var c=Object.assign({},p);
            c.bgImg=dataUrl; c.bgIsDefault=true; return c;
          });
          setBgStatus({s:"ok",p:u});
        };
        rd.readAsDataURL(xhr.response);
      };
      xhr.onerror=function(){
        /* Fallback : URL directe si XHR bloqué (CORS, GitHub Pages) */
        setSt(function(p){
          if(p.bgCustom||p.format!==k) return p;
          var c=Object.assign({},p); c.bgImg=u; c.bgIsDefault=true; return c;
        });
        setBgStatus({s:"ok",p:u});
      };
      xhr.send();
    });
  },[st.format,st.bgCustom]);

  var G=GRADS[st.grad]||GRADS.bleu;
  var GRAD_H=gradCss(st.grad,90);    /* horizontal : cartouches et surlignages */
  var GRAD_V=gradCss(st.grad,180);   /* vertical   : fonds de bloc (charte) */

  var L=getLayout(st.format,st.hasML);
  var CARD_H=L.CARD_H, EX=L.EXPORT_SCALE;

  /* ── Rectangles Split Screen ─────────────────────────────────────────── */
  /* Selon layout et imgRatio, calcule la position de l'image et du texte.
     Le cartouche est en position fixe (comme Latest News, coin haut-gauche
     de la carte) : il est calculé séparément plus bas, avec un léger
     décalage quand la photo touche ce coin. Ici on réserve juste la place
     du cartouche dans la zone de texte quand celle-ci commence en haut. */
  function computeRects(L2,CH,layout,imgRatio){
    var m=L2.MARGIN, bt=L2.BOTTOM, rt=L2.RIGHT_MIN;
    var left=m, top=m, right=CARD_W-m, bottom=CH-bt;
    var cw=right-left, ch=bottom-top;
    var gap=Math.round(0.04*CH);        /* espace image ↔ texte */
    var badgeClear=L2.BADGE_H+gap;      /* place réservée au cartouche dans la zone de texte */
    var img,txt;
    if(layout==="bottom"){
      var ih=Math.round(ch*imgRatio);
      var imgTop=bottom-ih;
      img={x:left,y:imgTop,w:cw,h:ih};
      /* cartouche en haut du bloc texte : le texte démarre après lui */
      txt={x:left,y:top+badgeClear,w:cw,h:imgTop-gap-(top+badgeClear)};
    } else if(layout==="top"){
      var ih2=Math.round(ch*imgRatio);
      img={x:left,y:top,w:cw,h:ih2};
      /* cartouche posé sur la photo : le texte n'a pas besoin de lui laisser de place */
      var txtTop=top+ih2+gap;
      txt={x:left,y:txtTop,w:cw,h:bottom-txtTop};
    } else if(layout==="left"){
      var iw=Math.round(cw*imgRatio);
      img={x:left,y:top,w:iw,h:ch};
      /* cartouche posé sur la photo : la colonne de texte démarre en haut */
      var txtLeft=left+iw+gap;
      txt={x:txtLeft,y:top,w:CARD_W-m-rt-iw-gap,h:ch};
    } else { /* right */
      var iw2=Math.round(cw*imgRatio);
      img={x:right-iw2,y:top,w:iw2,h:ch};
      /* cartouche en haut de la colonne de texte : le texte démarre après lui */
      txt={x:left,y:top+badgeClear,w:right-iw2-gap-left,h:ch-badgeClear};
    }
    return {img:img,txt:txt};
  }
  var R=computeRects(L,CARD_H,st.layout,st.imgRatio||0.55);

  /* ── Taille du texte ────────────────────────────────────────────────── */
  var _f=st.format;
  var fs=st["fs_"+_f]||L.TEXT_DEF;
  fs=Math.max(L.TEXT_MIN,Math.min(L.TEXT_MAX,fs));
  var lh=fs*L.TEXT_LH;

  useEffect(function(){

  useEffect(function(){

       On récupère les clés pour initialiser badgeIconKey si besoin. */

          selected:st.badgeIconKey,
          custom:st.badgeIconCustom,

            setSt(function(p){var c=Object.assign({},p);c.badgeIconKey=key;c.badgeIconCustom=null;return c;});
          },
          onCustom:function(dataUri){
            setSt(function(p){var c=Object.assign({},p);c.badgeIconCustom=dataUri;return c;});
          },
        });
      }
    });
  },[]);

  /* Mettre à jour le dégradé de la galerie quand il change */
  useEffect(function(){
    var container=document.getElementById("picto-gallery-container");
    if(container&&container._pg) container._pg.setGrad(gradCss(st.grad,90));
  },[st.grad]);

  /* Lire les dimensions naturelles de l'image dès qu'elle change */
  useEffect(function(){
    if(!st.bgImg){setBgNat({w:0,h:0});return;}

    im.onload=function(){setBgNat({w:im.naturalWidth,h:im.naturalHeight});};
    im.onerror=function(){setBgNat({w:0,h:0});};

  },[st.bgImg]);

  /* Hauteur réelle du pavé, mesurée après chaque render */
  useLayoutEffect(function(){

  function save(){var n=sname.trim()||("Version "+new Date().toLocaleString("fr-FR"));dbPut({name:n,date:new Date().toISOString(),state:st},function(){dbAll(function(a){setSaves(a);});});setSname("");}
  function load(en){setSt(Object.assign({},DEFAULT,en.state));}
  function del(n){dbDel(n,function(){dbAll(function(a){setSaves(a);});});}
  function expJson(){dbAll(function(a){var b=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});var l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="split-screen-sauvegardes.json";l.click();});}
  function impJson(f){if(!f)return;var r=new FileReader();r.onload=function(ev){try{var a=JSON.parse(ev.target.result);var ok=a.filter(function(x){return x&&x.name&&x.state;});if(!ok.length)throw new Error("aucune entrée valide");dbPutAll(ok,function(){dbAll(function(m){setSaves(m);alert(ok.length+" sauvegarde(s) importée(s).");});});}catch(er){alert("Fichier invalide ("+er.message+").");}};r.readAsText(f);}

  /* ─── Export PNG ──────────────────────────────────────────────────────── */
  var doExport=useCallback(function(){
    if(!cardRef.current)return;
    setBusy(true);
    var bgW=R.img.w, bgH=R.img.h;
    var _bgX=st["bgX_"+st.format]!==undefined?st["bgX_"+st.format]:50;
    var _bgY=st["bgY_"+st.format]!==undefined?st["bgY_"+st.format]:50;
    var _bgZoom=st["bgZoom_"+st.format]||100;

    }
    preBlur(st.bgImg,bgW,bgH,st.bgBlur,function(blurred){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1";
      var cl=cardRef.current.cloneNode(true);
      cl.style.transform="none";cl.style.position="static";cl.style.width=CARD_W+"px";
      box.appendChild(cl);document.body.appendChild(box);
      if(blurred){
        /* Remplacer l'img de DragImage par le canvas preBlur déjà rendu
           (position + zoom + blur appliqués en haute résolution) */

            e("button",{onClick:function(){if(confirm("Supprimer \u00AB "+v.name+" \u00BB ?"))del(v.name);},style:{background:"#fff0f0",color:"#c0392b",border:"none",borderRadius:5,padding:"4px 8px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}},"\u00D7"));
        })),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:expJson,style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Export .json"),
        e("button",{onClick:function(){if(impRef.current)impRef.current.click();},style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Import .json"),
        e("input",{ref:impRef,type:"file",accept:".json",style:{display:"none"},onChange:function(ev){impJson(ev.target.files&&ev.target.files[0]);}}))),

    e("button",{className:"export-btn",onClick:doExport,disabled:busy},
      busy?e("span",{className:"spin"},e(DownloadIcon)):e(DownloadIcon),
      busy?"Export en cours\u2026":"Télécharger le PNG ("+FORMATS[st.format].outputW+" \u00D7 "+FORMATS[st.format].outputH+")")
  );

  return e("div",{className:"app-layout"},panel,e("div",{className:"preview-wrap"},previewWrap));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
