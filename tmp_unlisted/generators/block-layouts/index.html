<body>
<div id="root"></div>
<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useEffect=React.useEffect,useLayoutEffect=React.useLayoutEffect;
var UI=Shell.ui;

/* ═══ Constantes ═══════════════════════════════════════════════════════════ */
var BG_DIR="../../templates/block-layouts/";
function bgCandidates(k){
  var names=["TEMPLATE_BL_"+k,"TEMPLATE_BL","TEMPLATE_BACK"];
  var exts=[".png",".jpg",".jpeg",".webp"];
  var out=[]; names.forEach(function(n){exts.forEach(function(x){out.push(BG_DIR+n+x);});});
  return out;
}

/* ═══ CARTE PARTAGÉE ══════════════════════════════════════════════════════
   Visuel, mise en page et état par défaut : assets/cards/block-layouts-card.js
   Rendu à l'identique par le Carrousel. Ne rien réimplémenter ici. */
var CARD=SPGCards.get("blocklayouts");
var DEFAULT=CARD.DEFAULT;

/* ═══ APP ══════════════════════════════════════════════════════════════════
   État + carte + panneau. Le panneau est décrit dans
   assets/panneaux/block-layouts.js : aucune option n'est codée ici. */
function App(){
  var shell=Shell.useApp({pageKey:"blocklayouts",DEFAULT:DEFAULT,bgCandidates:bgCandidates});
  var st=shell.st, setSt=shell.setSt;
  var cardRef=useRef(null);
  var m=SPGPanneau.useMesures();
  var g=CARD.geometry(st), CW=g.CW, CH_=g.CH;
  var previewScale=Shell.EXPORT_MODE?1:Math.min(480/CW,(window.innerHeight-140)/CH_,1);

  var card=e(CARD.Card,{
    st:st, cardRef:cardRef, exportTarget:true,
    scale:previewScale, bgNat:shell.bgNat,
    onMeasure:m.onMeasure, onGarde:m.onGarde,
    onBgMove:function(x,y){ setSt(function(p){var c=Object.assign({},p);
      c["bgX_"+p.format]=x;c["bgY_"+p.format]=y;return c;}); }
  });

  return e("div",{className:"app-layout"},
    e(SPGPanneau.PanneauPage,{type:"blocklayouts",shell:shell,cardRef:cardRef,mesures:m.valeurs,bgDir:BG_DIR}),
    e("div",{className:"preview-wrap"},
      e("div",{style:{width:CW*previewScale,minHeight:CH_*previewScale,position:"relative",flexShrink:0}},
        e("div",{style:{width:CW,transform:"scale("+previewScale+")",transformOrigin:"top left",
          position:"absolute",top:0,left:0}},card))));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
/* Le démarrage est confié au portail : il attend que les bibliothèques ET
   tous les <script src> de la page soient prêts. Voir assets/boot-gate.js. */
SPGBoot.run(boot);
</script>
