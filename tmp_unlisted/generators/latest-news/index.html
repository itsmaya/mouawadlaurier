<script>
function boot(){

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect,
    useLayoutEffect=React.useLayoutEffect;



/* Pictos — délégués à PictoGallery (assets/pictos.js) */

/* ═══ Sauvegardes ═══════════════════════════════════════════════════════════
   Gérées par le module partagé assets/save-manager.js (IndexedDB centralisée,
   dossiers, suivi enregistré/modifié). Voir SaveManager.createStore ci-dessous
   dans App(). */


var BG_DIR="../../templates/latest-news/";
function bgCandidates(k){
  var names=["TEMPLATE_LN_"+k,"TEMPLATE_LN_"+k.toUpperCase(),"TEMPLATE_"+k];
  var exts=[".png",".jpg",".jpeg",".webp"];
  var out=[];
  for(var i=0;i<names.length;i++)
    for(var j=0;j<exts.length;j++) out.push(BG_DIR+names[i]+exts[j]);
  return out;
}

/* ═══ BLOC HELPERS ═══════════════════════════════════════════════════════ */
var BLOC_ID=0;
function newBloc(overrides){
  return Object.assign({
    id: Date.now()+(++BLOC_ID)+Math.random(),
    type:"encadre",
    text:"TotalEnergies acquires\n**Shell's renewables business**",
    inverted:false,
    liveMode:false,
    textMode:"uni",
    align:"left",
    fs_1x1:0, fs_4x5:0, fs_9x16:0,
    w_1x1:0,  w_4x5:0,  w_9x16:0
  }, overrides||{});
}

/* ═══ STATE ════════════════════════════════════════════════════════════════ */
var DEFAULT={
  format:"1x1", grad:"bleu", lowCarbon:false, firstSlide:false,
  bgMode:"photo",
  /* image : voir BG_DEFAULT_STATE dans bg-controls.js */
  hasML:false, mlStyle:"white",
  badgeIconKey:"Place",
  badgeIconCustom:null,
  badgeMain:"LATEST NEWS", badgeSub:"LEUNA, GERMANY",
  navMark:"arrow",
  b_1x1:-1, b_4x5:-1, b_9x16:-1,
  blocs:[newBloc()]
};
Object.assign(DEFAULT, BG_DEFAULT_STATE);


/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],_setSt=a0[1];
  /* Historique pour Ctrl+Z — stack des 30 derniers états */
  var historyRef=useRef([]);
  var historyIdx=useRef(-1);
  function setSt(newSt){
    _setSt(function(prev){
      var next=typeof newSt==="function"?newSt(prev):newSt;
      /* Ne pas enregistrer si identique */
      if(JSON.stringify(next)===JSON.stringify(prev)) return prev;
      /* Tronquer les états "futurs" si on a fait un undo */
      historyRef.current=historyRef.current.slice(0,historyIdx.current+1);
      historyRef.current.push(prev);
      if(historyRef.current.length>30) historyRef.current.shift();
      historyIdx.current=historyRef.current.length-1;
      return next;
    });
  }
  function undo(){
    if(historyIdx.current<0) return;
    var prev=historyRef.current[historyIdx.current];
    historyIdx.current--;
    _setSt(prev);
  }
  useEffect(function(){
    function onKey(ev){
      if((ev.ctrlKey||ev.metaKey)&&ev.key==="z"&&!ev.shiftKey){
        ev.preventDefault(); undo();
      }
    }
    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey);};
  },[]);
  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  var a4=useState({w:0,h:0}); var bgNat=a4[0],setBgNat=a4[1];
  var cardRef=useRef(null),paveRef=useRef(null);
  var phState=useState(120); var paveH=phState[0],setPaveH=phState[1];
  var bsState=useState({s:"loading",p:null}); var bgStatus=bsState[0],setBgStatus=bsState[1];
  /* Bloc actif dans le panneau */
  var abState=useState(0); var activeBloc=abState[0],setActiveBloc=abState[1];
  /* Sauvegardes : store partagé (assets/save-manager.js) */
  var saveStore=useRef(null);
  if(!saveStore.current) saveStore.current=SaveManager.createStore("latestnews",{legacy:"latestnews_saves"});
  /* State sauvegarde */
  var smId=useState(null); var currentId=smId[0],setCurrentId=smId[1];
  var smName=useState(""); var currentName=smName[0],setCurrentName=smName[1];
  var smHash=useRef(null);
  var smFolder=useRef("");
  var smDrawer=useState(false); var drawerOpen=smDrawer[0],setDrawerOpen=smDrawer[1];
  var dirty=currentId!==null && smHash.current!==null && SaveManager.hashState(st)!==smHash.current;

  /* StatusBar dans le header (slot injecté par header.js) */
  /* Ouvrir le dernier projet au lancement — ou l'état passé par Puppeteer via hash */
  useEffect(function(){
    var hash=window.location.hash;
    if(hash&&hash.indexOf("#exportkey=")===0){
      try{
        var key=hash.slice(12);
        var raw=localStorage.getItem(key);
        if(raw){
          var decoded=JSON.parse(raw);
          setSt(Object.assign({},DEFAULT,decoded));
          localStorage.removeItem(key);
          return;
        }
      }catch(e){ console.warn("Export state error",e); }
    }
    var lastId=localStorage.getItem("sm_last_id_latestnews");
    if(!lastId) return;
    saveStore.current.get(lastId,function(rec){
      if(!rec||!rec.state) return;
      setSt(normalizeLoadedState(rec.state));
      setCurrentId(rec.id); setCurrentName(rec.name);
      smFolder.current=rec.folder||"";
      smHash.current=SaveManager.hashState(normalizeLoadedState(rec.state));
    });
  },[]);

  /* StatusBar dans le header (slot injecté par header.js) */
  var statusRootRef=useRef(null);
  useEffect(function(){
    var slot=document.getElementById("sm-status-slot");
    if(!slot||!SaveManager.StatusBar) return;
    if(!statusRootRef.current){
      statusRootRef.current=ReactDOM.createRoot(slot);
    }
    statusRootRef.current.render(
      e(SaveManager.StatusBar,{
        currentId:currentId, currentName:currentName, dirty:dirty,
        onSave:function(){
          var name=currentName||("Version "+new Date().toLocaleString("fr-FR"));
          saveStore.current.save({id:currentId||undefined,name:name,folder:"",state:st},function(rec){
            if(!rec) return;
            setCurrentId(rec.id); setCurrentName(rec.name);
            smHash.current=SaveManager.hashState(st);
          });
        }
      }));
    window.smDrawerToggle=function(){ setDrawerOpen(function(o){ return !o; }); };
    window.smDownloadTrigger=function(){ doExport(); };
    if(currentId) localStorage.setItem("sm_last_id_latestnews",currentId);
  },[currentId,currentName,dirty]);

  /* Onglet actif du panneau */
  var tabState=useState("fond"); var activeTab=tabState[0],setActiveTab=tabState[1];
  var TABS=[
    {id:"fond",      label:"Fond"},
    {id:"couleurs",  label:"Couleurs"},
    {id:"cartouche", label:"Cartouche"},
    {id:"blocs",     label:"Textes"},
  ];

  function set(k,v){setSt(function(p){var c=Object.assign({},p);c[k]=v;return c;});}

  /* Helpers blocs */
  function setBloc(id,k,v){setSt(function(p){
    return Object.assign({},p,{blocs:p.blocs.map(function(b){
      return b.id===id?Object.assign({},b,typeof k==="object"?k:{[k]:v}):b;
    })});
  });}
  function addBloc(){setSt(function(p){
    var nb=newBloc();
    var arr=p.blocs.concat(nb);
    setTimeout(function(){setActiveBloc(arr.length-1);},0);
    return Object.assign({},p,{blocs:arr});
  });}
  function removeBloc(id){setSt(function(p){
    var arr=p.blocs.filter(function(b){return b.id!==id;});
    return Object.assign({},p,{blocs:arr});
  });}
  function moveBloc(fromIdx,toIdx){setSt(function(p){
    var arr=p.blocs.slice();
    var item=arr.splice(fromIdx,1)[0];
    arr.splice(toIdx,0,item);
    return Object.assign({},p,{blocs:arr});
  });}

  /* Changement de format : la marie-louise n'existe pas en story.
     Le fond par défaut est rechargé par la sonde ci-dessous. */
  function setFormat(k){
    setSt(function(p){
      var c=Object.assign({},p);
      c.format=k;
      if(k==="9x16") c.hasML=false;   /* charte : jamais de marie-louise en story */
      return c;
    });
  }

  /* Sonde du fond par défaut : au démarrage, puis à chaque changement de
     format, tant que l'utilisateur n'a pas déposé sa propre image. */
  useEffect(function(){
    if(st.bgCustom) return;
    var k=st.format;
    setBgStatus({s:"loading",p:null});
    tryLoadDefault(bgCandidates(k),
      function(dataUrl,srcUrl){
        setSt(function(p){
          if(p.bgCustom||p.format!==k) return p;
          var c=Object.assign({},p); c.bgImg=dataUrl; c.bgIsDefault=true; return c;
        });
        setBgStatus({s:"ok",p:srcUrl});
      },
      function(){
        setSt(function(p){
          if(p.bgCustom||p.format!==k) return p;
          var c=Object.assign({},p); c.bgImg=null; c.bgIsDefault=false; return c;
        });
        setBgStatus({s:"missing",p:null});
      });
  },[st.format,st.bgCustom]);

  var G=GRADS[st.grad]||GRADS.bleu;
  var GRAD_H=gradCss(st.grad,90);    /* horizontal : cartouches et surlignages */
  var GRAD_V=gradCss(st.grad,180);   /* vertical   : fonds de bloc (charte) */

  var L=getLayout(st.format,{firstSlide:st.firstSlide,hasML:st.hasML});
  var CARD_H=L.CARD_H, EX=L.EXPORT_SCALE;

  /* ── Réglages par format ─────────────────────────────────────────────
     Déclarés AVANT les bornes de position : l'ordre compte, une valeur
     undefined ici décale tout le positionnement. ─────────────────────── */
  var _f=st.format;
  var _rawB=(st["b_"+_f]!==undefined)?st["b_"+_f]:-1;

  /* ── Calcul de la hauteur totale du stack de blocs ──────────────────── */
  var BLOC_GAP=px(20);
  var markH=(st.navMark!=="none")?L.ARROW_H+L.ARROW_GAP:0;
  var BOTTOM_MIN=Math.max(L.MARGIN, st.navMark==="none"?px(100):px(50));  /* marge basse minimum selon repère */
  var BOTTOM_MAX=Math.max(BOTTOM_MIN,CARD_H-L.BADGE_TOP-L.BADGE_H-px(60)-paveH-markH);
  var bottomTarget;
  if(_rawB<0){
    bottomTarget=Math.max(BOTTOM_MIN,Math.min(BOTTOM_MAX,L.BOTTOM));
  }else{
    bottomTarget=BOTTOM_MIN+(_rawB/1000)*(BOTTOM_MAX-BOTTOM_MIN);
  }
  bottomTarget=Math.round(bottomTarget);
  var stackBottom=bottomTarget+markH;

  /* ── Rendu d'un bloc individuel ─────────────────────────────────────── */
  function blocLayout(bloc){
    var bfs=bloc["fs_"+_f]||L.TEXT_DEF;
    bfs=Math.max(L.TEXT_MIN,Math.min(L.TEXT_MAX,bfs));
    var autoW=CARD_W-L.MARGIN-L.RIGHT_MIN;
    var bwRaw=bloc["w_"+_f]||0;
    var BW=bwRaw?Math.round(CARD_W*bwRaw/100):autoW;
    BW=Math.max(Math.round(CARD_W*0.30),Math.min(CARD_W-L.MARGIN*2,BW));
    var bLeft=(bloc.align==="right")?(CARD_W-BW-L.MARGIN):L.MARGIN;

      e("div",{className:"grad-row"},

          return e("div",{key:k,title:GRADS[k].label,
            className:"grad-sw"+(st.grad===k?" on":""),
            onClick:function(){set("grad",k);},
            style:{backgroundImage:gradCss(k,90)}});
        })),
      e("div",{className:"grad-active"},
        e("i",{style:{backgroundImage:GRAD_H}}),
        G.label," — ",G.from," → ",G.to),

      e("div",{style:{height:14}}),

      /* ── Couleur du texte : liée au dégradé ───────────────────────── */
      e("label",{className:"field-label"},"Couleur du texte"),
      e("div",{className:"seg",style:{marginBottom:10}},
        [{v:"uni",l:"Couleur unie"},{v:"grad",l:"Dégradé diagonal"}].map(function(o){
          return e("button",{key:o.v,className:st.textMode===o.v?"on":"",
            onClick:function(){set("textMode",o.v);}},o.l);
        })),
      st.textMode==="uni"
        ? e(React.Fragment,null,
            /* Seulement 2 choix : couleur du dégradé actif + gris foncé */
            e("div",{style:{display:"flex",gap:8}},
              e("div",{title:G.label+" (couleur du dégradé)",
                className:"col-sw"+(st.textColor!==COLOR_GREY?" on":""),
                onClick:function(){set("textColor",G.to);},
                style:{background:GRAD_H,backgroundImage:GRAD_H,width:48,height:30,borderRadius:6,
                  cursor:"pointer",border:st.textColor!==COLOR_GREY?"2px solid #1a1a1a":"2px solid #e5e5e5"}}),
              e("div",{title:"Gris foncé #374649",
                className:"col-sw"+(st.textColor===COLOR_GREY?" on":""),
                onClick:function(){set("textColor",COLOR_GREY);},
                style:{background:COLOR_GREY,width:48,height:30,borderRadius:6,
                  cursor:"pointer",border:st.textColor===COLOR_GREY?"2px solid #1a1a1a":"2px solid #e5e5e5"}})),
            e("div",{className:"hint",style:{marginTop:6}},
              "La couleur suit automatiquement le dégradé sélectionné."))
        : e("div",{className:"hint"},
            "Le texte et les surlignages utilisent le même dégradé diagonal."),

      e("div",{style:{height:10}}),

      /* ── Bas carbone ──────────────────────────────────────────────── */
      e("label",{className:"toggle"},
        e("input",{type:"checkbox",checked:st.lowCarbon,
          onChange:function(ev){set("lowCarbon",ev.target.checked);}}),
        "Sujet énergie bas carbone"),
      e("div",{className:"hint",style:{marginTop:4}},
        "Active le contrôle charte : dégradé rouge interdit sur le bas carbone."),
      charteWarn?e("div",{className:"charte-warn"},e("b",null,"Charte : "),charteWarn):null,
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Pictogramme"),
      e("div",{id:"picto-gallery-container",key:"picto-gallery"}),


    e("div",{className:"tab-nav"},
      e("button",{className:"tab-nav-btn",onClick:function(){setActiveTab("fond");}},
        "← ","Fond"
      ),
      e("button",{className:"tab-nav-btn primary",onClick:function(){setActiveTab("cartouche");}},
        "Edit Cartouche"," →")
    )
),  /* fin onglet couleurs */

    /* Onglet Cartouche */
    e("div",{className:"panel-tab-content"+(activeTab==="cartouche"?" on":""),style:{paddingTop:16}},
      e("label",{className:"field-label"},"Titre ",e("span",{className:"hint"},"(ExtraBold)")),
      e("input",{type:"text",spellCheck:true,value:st.badgeMain,
        onChange:function(ev){set("badgeMain",ev.target.value.toUpperCase());},
        style:{textTransform:"uppercase"}}),
      e("div",{style:{height:8}}),
      e("label",{className:"field-label"},"Lieu ou précision ",e("span",{className:"hint"},"(SemiBold, optionnel)")),
      e("input",{type:"text",spellCheck:true,value:st.badgeSub,
        onChange:function(ev){set("badgeSub",ev.target.value.toUpperCase());},
        style:{textTransform:"uppercase"}}),
      e("div",{style:{height:12}}),  /* fin section cartouche */

      /* Repère de carrousel */
      e("div",{style:{marginTop:4,marginBottom:8}},
        e("label",{className:"field-label",style:{marginBottom:6}},"Repère de carrousel"),
        segBtn(st.navMark,"navMark",[{v:"arrow",l:"Flèche"},{v:"dot",l:"Point"},{v:"none",l:"Aucun"}]),
        e("div",{className:"hint",style:{marginTop:6}},
          "Flèche sur les slides intermédiaires, point sur la dernière.")),

    e("div",{className:"tab-nav"},
      e("button",{className:"tab-nav-btn",onClick:function(){setActiveTab("couleurs");}},
        "← ","Couleurs"
      ),
      e("button",{className:"tab-nav-btn primary",onClick:function(){setActiveTab("blocs");}},
        "Edit Textes"," →")
    )
),  /* fin onglet cartouche */

    /* Onglet Blocs */
    e("div",{className:"panel-tab-content"+(activeTab==="blocs"?" on":""),style:{paddingTop:16}},
      e("div",{className:"hint",style:{marginBottom:10}},
        e("b",null,"**mot**")," = surlignage  •  ",e("b",null,"__mot__")," = soulignage"),

      /* Liste des blocs avec flèches de réordonnancement */
      e("div",{style:{display:"flex",flexDirection:"column",gap:6,marginBottom:10}},
        (st.blocs||[]).map(function(bloc,idx){
          var isActive=activeBloc===idx;
          var total=(st.blocs||[]).length;
          var label=(bloc.text||"").replace(/\*\*|__/g,"").substring(0,32)||(idx===0?"Bloc 1":"Bloc "+(idx+1));
          return e("div",{key:bloc.id,
            style:{border:"1px solid "+(isActive?"#1a1a1a":"#e0e0e0"),
              borderRadius:8,overflow:"hidden",
              background:isActive?"#f9f9f7":"#fff"}},

            /* En-tête du bloc */
            e("div",{style:{display:"flex",alignItems:"center",gap:6,
                padding:"8px 10px",cursor:"pointer"},
              onClick:function(){setActiveBloc(isActive?-1:idx);}},
              /* Flèches ↑ ↓ */
              e("div",{style:{display:"flex",flexDirection:"column",gap:1},
                  onClick:function(ev){ev.stopPropagation();}},
                e("button",{disabled:idx===0,
                  onClick:function(ev){ev.stopPropagation();moveBloc(idx,idx-1);setActiveBloc(idx-1);},
                  style:{border:"none",background:"none",color:idx===0?"#ddd":"#888",
                    fontSize:10,cursor:idx===0?"default":"pointer",padding:"0 2px",
                    lineHeight:1,fontFamily:"inherit",display:"block"}},"\u25B2"),
                e("button",{disabled:idx===total-1,
                  onClick:function(ev){ev.stopPropagation();moveBloc(idx,idx+1);setActiveBloc(idx+1);},
                  style:{border:"none",background:"none",color:idx===total-1?"#ddd":"#888",
                    fontSize:10,cursor:idx===total-1?"default":"pointer",padding:"0 2px",
                    lineHeight:1,fontFamily:"inherit",display:"block"}},"\u25BC")),
              e("span",{style:{flex:1,fontSize:12,fontWeight:700,color:"#333",
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
                (bloc.type==="texte"?"✦ ":"▪ ")+label),
              e("span",{style:{fontSize:10,color:"#aaa",fontWeight:600,
                textTransform:"uppercase",letterSpacing:".05em"}},
                bloc.type==="texte"?"Texte":"Encadré"),
              e("button",{onClick:function(ev){ev.stopPropagation();
                  if(confirm("Supprimer ce bloc ?"))removeBloc(bloc.id);},
                style:{marginLeft:4,border:"none",background:"none",color:"#ccc",
                  fontSize:14,cursor:"pointer",padding:"0 2px",lineHeight:1,fontFamily:"inherit"}},
                "\u00D7")),

            /* Corps du bloc — visible si actif */
            isActive?e("div",{style:{padding:"10px 10px 14px",borderTop:"1px solid #efefef"}},

              /* Type */
              e("label",{className:"field-label",style:{marginBottom:6}},"Type de bloc"),
              e("div",{className:"seg",style:{marginBottom:10}},
                [{v:"encadre",l:"Encadré"},{v:"texte",l:"Texte surligné"}].map(function(o){
                  return e("button",{key:o.v,className:bloc.type===o.v?"on":"",
                    onClick:function(){
                      var updates={type:o.v};
                      if(st.bgMode==="photo"){
                        var stripped=bloc.text.replace(/\*\*/g,"").replace(/__/g,"").trim();
                        if(o.v==="texte"){
                          /* Fond photo + texte surligné → entourer tout le texte de ** */
                          updates.text="**"+stripped+"**";
                        } else {
                          /* Fond photo + encadré → retirer les ** */
                          updates.text=stripped;
                        }
                      }
                      setBloc(bloc.id,updates);
                    }},o.l);
                })),

              /* Inverser (tous les types) */
              e("label",{className:"toggle",style:{marginBottom:10}},
                e("input",{type:"checkbox",checked:bloc.inverted,
                  onChange:function(ev){
                    var newInv=ev.target.checked;
                    setBloc(bloc.id,{inverted:newInv});
                  }}),
                e("span",{style:{display:"inline-flex",alignItems:"center",gap:6}},
                  e("span",{style:{display:"inline-block",width:16,height:10,borderRadius:3,
                    backgroundImage:GRAD_H,flexShrink:0}}),
                  bloc.type==="encadre"
                    ?"Inverser — fond dégradé, texte blanc"
                    :"Inverser — texte dégradé, surlignage blanc")),

              /* Mode texte couleur — sur fond dégradé + bloc texte : pas d'option dégradé diagonal */
              !bloc.inverted?e(React.Fragment,null,
                e("label",{className:"field-label",style:{marginBottom:6}},"Couleur du texte"),
                e("div",{className:"seg",style:{marginBottom:10}},
                  (onGrad && bloc.type==="texte"
                    ? [{v:"uni",l:"Couleur unie"}]
                    : [{v:"uni",l:"Couleur unie"},{v:"grad",l:"Dégradé diagonal"}]
                  ).map(function(o){
                    return e("button",{key:o.v,className:bloc.textMode===o.v?"on":"",
                      onClick:function(){setBloc(bloc.id,"textMode",o.v);}},o.l);
                  }))):null,

              /* Mode LIVE par bloc */
              e("label",{className:"toggle",style:{marginBottom:10}},
                e("input",{type:"checkbox",checked:bloc.liveMode,
                  onChange:function(ev){setBloc(bloc.id,"liveMode",ev.target.checked);}}),
                e("span",{style:{display:"inline-flex",alignItems:"center",gap:6}},
                  e("span",{style:{width:10,height:10,borderRadius:"50%",background:"#E70000",
                    display:"inline-block",flexShrink:0}}),
                  "Mode LIVE — rond rouge")),

              /* Texte */
              e("label",{className:"field-label"},"Texte"),
              e("textarea",{spellCheck:true,rows:4,value:bloc.text,
                onChange:function(ev){
                  var val=ev.target.value;
                  /* Fond photo + texte surligné : maintenir les ** autour */
                  if(st.bgMode==="photo" && bloc.type==="texte"){
                    var stripped=val.replace(/\*\*/g,"").replace(/__/g,"");
                    val="**"+stripped+"**";
                  }
                  setBloc(bloc.id,"text",val);
                },
                style:{fontSize:13,lineHeight:1.5,marginBottom:4}}),
              /* Fond photo + texte surligné : surlignage automatique, non modifiable */
              (st.bgMode==="photo" && bloc.type==="texte")
                ? e("div",{className:"hint",style:{marginBottom:8,color:"#999",fontSize:11}},
                    "** Le texte est entièrement surligné sur fond photo.")
                : null,

              /* Alignement */
              e("label",{className:"field-label"},"Alignement"),
              e("div",{className:"seg",style:{marginBottom:10}},
                [{v:"left",l:"← Gauche"},{v:"right",l:"Droite →"}].map(function(o){
                  return e("button",{key:o.v,className:bloc.align===o.v?"on":"",
                    onClick:function(){setBloc(bloc.id,"align",o.v);}},o.l);
                })),

              /* Taille de police */
              (function(){
                var bfs=bloc["fs_"+_f]||L.TEXT_DEF;
                bfs=Math.max(L.TEXT_MIN,Math.min(L.TEXT_MAX,bfs));
                return e(React.Fragment,null,
                  e("label",{className:"field-label"},
                    "Taille — "+(bfs/K).toFixed(0)+" pt "+(bloc["fs_"+_f]?"":"(défaut)")),
                  e("input",{type:"range",min:L.TEXT_MIN,max:L.TEXT_MAX,step:1,value:bfs,
                    onChange:function(ev){setBloc(bloc.id,"fs_"+_f,parseInt(ev.target.value,10));}}));
              })(),

              /* Largeur */
              (function(){
                var autoW2=CARD_W-L.MARGIN-L.RIGHT_MIN;
                var bwRaw2=bloc["w_"+_f]||0;
                var BW2=bwRaw2?Math.round(CARD_W*bwRaw2/100):autoW2;
                BW2=Math.max(Math.round(CARD_W*0.30),Math.min(CARD_W-L.MARGIN*2,BW2));
                var pct=Math.round(BW2/CARD_W*100);
                return e(React.Fragment,null,
                  e("label",{className:"field-label",style:{marginTop:8}},
                    "Largeur — "+pct+"%"),
                  e("input",{type:"range",min:30,max:90,step:1,value:pct,
                    onChange:function(ev){setBloc(bloc.id,"w_"+_f,parseInt(ev.target.value,10));}}));
              })()

            ):null
          );
        })),

      /* Bouton ajouter */
      (st.blocs||[]).length<4?e("button",{onClick:addBloc,
        style:{width:"100%",padding:"8px",border:"1px dashed #ccc",borderRadius:8,
          background:"#fafafa",cursor:"pointer",fontSize:12,fontWeight:700,
          color:"#888",fontFamily:"inherit"}},
        "+ Ajouter un bloc"):
      e("div",{className:"hint",style:{textAlign:"center"}},"Maximum 4 blocs"),

      e("div",{style:{height:10}}),

      /* Position verticale */
      e("label",{className:"field-label"},
        _rawB<0?("Marge basse — "+bottomTarget+" px (auto)")
               :("Marge basse — "+bottomTarget+" px")),
      e("input",{type:"range",min:0,max:1000,step:1,
        value:_rawB<0?Math.round((bottomTarget-BOTTOM_MIN)/Math.max(1,BOTTOM_MAX-BOTTOM_MIN)*1000):_rawB,
        onChange:function(ev){set("b_"+st.format,parseInt(ev.target.value,10));}}),
      e("button",{onClick:function(){set("b_"+st.format,-1);},
        style:{marginTop:6,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:5,
          border:"1px solid #ddd",background:"#f5f5f5",cursor:"pointer",fontFamily:"inherit"}},
        "Réinitialiser position"),

    e("div",{className:"tab-nav"},
      e("button",{className:"tab-nav-btn",onClick:function(){setActiveTab("cartouche");}},
        "← ","Cartouche"
      ),
      e("button",{className:"tab-nav-btn primary",onClick:doExport,disabled:busy},
        busy?e("span",{className:"spin"},e(DownloadIcon)):e(DownloadIcon),
        busy?"Export…":"Télécharger le PNG"
      )
    )
),  /* fin onglet blocs */

  );

  /* Drawer de sauvegarde (monté hors du panneau, plein écran) */
  function doExportOne(savedState,fmt,filename){
    return new Promise(function(resolve,reject){
      var prevSt=st;
      var loadedSt=normalizeLoadedState(savedState);
      loadedSt=Object.assign({},loadedSt,{format:fmt});
      setSt(loadedSt);
      setTimeout(function(){
        var EXPORT_SERVER="http://localhost:3001";
        var outW=FORMATS[fmt].outputW, outH=FORMATS[fmt].outputH;
        fetch(EXPORT_SERVER+"/ping",{signal:AbortSignal.timeout(1500)})
          .then(function(){
            return fetch(EXPORT_SERVER+"/export",{method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({url:window.location.href.split("#")[0],
                selector:"[data-export-card]",width:outW,height:outH,
                previewWidth:CARD_W,filename:filename,scale:1})});
          }).then(function(r){ return r.blob(); })
          .catch(function(){
            return new Promise(function(res,rej){
              document.fonts.ready.then(function(){
                return window.domtoimage.toPng(cardRef.current,
                  {width:CARD_W,height:CARD_H,scale:EX,useCORS:true,imagePlaceholder:undefined});
              }).then(function(dataUrl){
                fetch(dataUrl).then(function(r){return r.blob();}).then(res).catch(rej);
              }).catch(rej);
            });
          }).then(resolve).catch(reject)
          .then(function(){ setTimeout(function(){setSt(prevSt);},100); });
      },400);
    });
  }

  var drawer=e(SaveManager.Drawer,{
    store:saveStore.current, state:st, open:drawerOpen,
    onClose:function(){setDrawerOpen(false);},
    currentId:currentId, currentName:currentName,
    onLoad:function(rec){
      setSt(normalizeLoadedState(rec.state));
      setCurrentId(rec.id); setCurrentName(rec.name);
      smFolder.current=rec.folder||"";
      smHash.current=SaveManager.hashState(normalizeLoadedState(rec.state));
    },
    onSaved:function(rec){
      setCurrentId(rec.id); setCurrentName(rec.name);
      smFolder.current=rec.folder||"";
      smHash.current=SaveManager.hashState(st);
    },
    doExportOne:doExportOne
  });

  return e("div",{className:"app-layout"},panel,e("div",{className:"preview-wrap"},previewWrap),drawer);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
