<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Récupération des projets</title>
<meta name="robots" content="noindex"/>
<link rel="stylesheet" href="../assets/fonts.css"/>
<script src="../assets/save-manager.js"></script>
<style>
:root{--nuit:#000;--encre:#12181c;--gris:#5f6367;--filet:#e6e6e6;--papier:#f7f7f7;
  --grad:linear-gradient(135deg,#0098E3 0%,#4632FF 100%);}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--papier);color:var(--encre);
  font-family:'Nunito',system-ui,sans-serif}
header{background:var(--nuit);color:#fff;height:52px;display:flex;align-items:center;padding:0 26px}
.marque{font-family:'DM Serif Display',serif;font-size:17px;line-height:.95;color:#fff;text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.carte{width:min(560px,100%);background:#fff;border:1px solid var(--filet);border-radius:16px;padding:34px;
  box-shadow:0 18px 44px rgba(0,0,0,.07);position:relative;overflow:hidden}
.carte::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--grad)}
.label{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8d8d8d}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(32px,4vw,46px);line-height:1;margin:10px 0 14px}
h1 em{font-style:italic;color:#8d8d8d}
p{font-size:14px;line-height:1.6;color:#3d4348}
.etat{margin-top:18px;font-size:14px;font-weight:700;min-height:20px}
.ok{color:#00884A}.err{color:#b3261e}
.barre{height:6px;border-radius:6px;background:#eceef2;overflow:hidden;margin-top:14px}
.barre span{display:block;height:100%;width:0;background:var(--grad);transition:width .4s ease}
.liste{list-style:none;margin:16px 0 0;display:grid;gap:6px}
.liste li{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--papier)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,.bouton{font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:10px;padding:13px 18px;cursor:pointer;border:1px solid var(--filet);background:#fff;color:var(--encre);text-decoration:none}
.prim{background:var(--grad);color:#fff;border:0}
.fichier{margin-top:24px;padding-top:18px;border-top:1px solid var(--filet);font-size:12.5px;color:var(--gris)}
</style>
</head>
<body>
<header><a class="marque" href="../index.html">Static Post<br/>Generator</a></header>
<main>
  <div class="carte">
    <span class="label">Migration</span>
    <h1>Récupération<br/><em>de tes projets</em></h1>
    <p id="intro">Cette page reçoit les projets enregistrés sur l'ancienne adresse du générateur.</p>
    <div class="barre"><span id="barre"></span></div>
    <div class="etat" id="etat"></div>
    <ul class="liste" id="liste"></ul>
    <div class="actions" id="actions"></div>
    <div class="fichier">
      Tu as une copie de secours (fichier .json) ?
      <button id="btnFichier" style="margin-left:8px;padding:8px 12px">Importer le fichier</button>
      <input type="file" id="fichier" accept=".json,application/json" style="display:none"/>
    </div>
  </div>
</main>

<script>
(function(){
/* Adresses de l'ancien générateur autorisées à envoyer des projets.
   Tout autre site est ignoré. */
var ANCIENNES = /^https?:\/\/(([a-z0-9-]+\.)*mouawadlaurier\.com|localhost|127\.0\.0\.1)(:\d+)?$/i;
/* localhost : la toute première version tournait sur l'ordinateur de chacun.
   Sans risque : une page locale ne peut qu'ajouter des projets dans ton
   propre navigateur. */

var DBX = window.SaveManager && SaveManager._db;
var NOMS = {sm_fichemetier:"Fiche métier",sm_citation:"Citation",sm_latestnews:"Latest News",
  sm_carrousel:"Carrousel",sm_splitscreen:"Split Screen",sm_blocklayouts:"Block Layouts",
  sm_totallytrue:"Totally True",sm_energytalks:"Energy Talks"};

function etat(t,cls,pct){ var e=document.getElementById("etat"); e.className="etat "+(cls||""); e.textContent=t;
  if(pct!==undefined) document.getElementById("barre").style.width=pct+"%"; }

/* ═══ Import : fusion prudente, rien n'est jamais écrasé par plus ancien ═══
   - projet absent ici            -> ajouté
   - même projet, version plus récente dans l'envoi -> mis à jour
   - même projet, déjà à jour ici -> laissé tel quel */
function importer(donnees, cb){
  if(!DBX){ cb(new Error("module de sauvegarde introuvable")); return; }
  if(!donnees || typeof donnees.stores!=="object"){ cb(new Error("données illisibles")); return; }
  var resume={ajoutes:0,misAJour:0,ignores:0,parStore:{}};
  DBX.openDB(function(db){
    var stores=Object.keys(donnees.stores).filter(function(s){ return DBX.ALL_STORES.indexOf(s)>=0; });
    var tx=db.transaction(stores.length?stores:DBX.ALL_STORES.slice(0,1),"readwrite");
    stores.forEach(function(s){
      var os=tx.objectStore(s), cle=os.keyPath;
      (donnees.stores[s]||[]).forEach(function(rec){
        if(!rec || rec[cle]===undefined) return;
        var g=os.get(rec[cle]);
        g.onsuccess=function(){
          var ici=g.result, compte=(s.indexOf("sm_")===0);   /* anciens formats : copiés, pas comptés */
          if(!ici){ os.put(rec); if(compte){ resume.ajoutes++; resume.parStore[s]=(resume.parStore[s]||0)+1; } }
          else if((rec.updatedDate||"")>(ici.updatedDate||"")){ os.put(rec); if(compte) resume.misAJour++; }
          else if(compte) resume.ignores++;
        };
      });
    });
    tx.oncomplete=function(){
      /* Préférences : seulement si elles n'existent pas encore ici. */
      try{ Object.keys(donnees.locaux||{}).forEach(function(k){
        if(localStorage.getItem(k)===null) localStorage.setItem(k, donnees.locaux[k]); }); }catch(e){}
      try{ SaveManager.emitChange && DBX.ALL_STORES.forEach(function(s){ SaveManager.emitChange(s); }); }catch(e){}
      db.close(); cb(null,resume);
    };
    tx.onerror=function(){ cb(tx.error||new Error("écriture impossible")); };
  }, function(err){ cb(err||new Error("base inaccessible")); });
}

function afficherFin(r){
  etat("Projets récupérés.","ok",100);
  document.getElementById("intro").textContent=(r.ajoutes||0)+" projet(s) ajouté(s)"+
    (r.misAJour?", "+r.misAJour+" mis à jour":"")+(r.ignores?", "+r.ignores+" déjà présent(s)":"")+".";
  document.getElementById("liste").innerHTML=Object.keys(r.parStore).filter(function(s){return NOMS[s];})
    .map(function(s){ return "<li><span>"+NOMS[s]+"</span><b>"+r.parStore[s]+"</b></li>"; }).join("");
  document.getElementById("actions").innerHTML='<a class="bouton prim" href="../index.html">Ouvrir le générateur</a>';
}

/* ═══ Réception depuis l'ancienne adresse (onglet ouvert par elle) ═══════ */
var source=window.opener;
if(source){
  etat("Connexion avec l'ancienne adresse…","",25);
  try{ source.postMessage({type:"spg-pret"},"*"); }catch(e){}
} else {
  etat("Ouvre cette page depuis l'ancienne adresse du générateur, ou importe ta copie de secours.","");
}
window.addEventListener("message",function(ev){
  if(!ANCIENNES.test(ev.origin) || !ev.data || ev.data.type!=="spg-donnees") return;
  etat("Enregistrement des projets…","",65);
  importer(ev.data.donnees,function(err,r){
    if(err){ etat("Erreur : "+err.message,"err",0);
      try{ ev.source.postMessage({type:"spg-erreur",message:err.message},ev.origin); }catch(e){}
      return; }
    afficherFin(r);
    try{ ev.source.postMessage({type:"spg-fini",resume:{ajoutes:r.ajoutes,misAJour:r.misAJour,ignores:r.ignores}},ev.origin); }catch(e){}
  });
});

/* Copie de secours : format ligne par ligne (une ligne = un projet), ou
   ancien format JSON d'un seul bloc. */
function lireCopie(t){
  if(t.indexOf('{"type":"entete"')===0){
    var d={stores:{},locaux:{}};
    t.split("\n").forEach(function(l){
      if(!l.trim()) return;
      var o=JSON.parse(l);
      if(o.type==="entete"){ d.locaux=o.locaux||{}; d.origine=o.origine; return; }
      if(o.store&&o.rec){ (d.stores[o.store]=d.stores[o.store]||[]).push(o.rec); }
    });
    return d;
  }
  return JSON.parse(t);
}

/* ═══ Copie de secours ═══════════════════════════════════════════════════ */
document.getElementById("btnFichier").onclick=function(){ document.getElementById("fichier").click(); };
document.getElementById("fichier").onchange=function(ev){
  var f=ev.target.files[0]; if(!f) return;
  etat("Lecture du fichier…","",30);
  f.text().then(function(t){
    var d=lireCopie(t);
    importer(d,function(err,r){ if(err){ etat("Erreur : "+err.message,"err",0); return; } afficherFin(r); });
  }).catch(function(){ etat("Fichier illisible : choisis la copie de secours téléchargée sur l'ancienne adresse.","err",0); });
};
})();
</script>
</body>
</html>
