<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Nunito',sans-serif;background:#f0f0f0;}
#root{min-height:100vh;}
.app-layout{min-height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px;padding-top:68px;padding-bottom:52px;}
@media(min-width:1024px){.app-layout{flex-direction:row;}}
.panel{width:100%;flex-shrink:0;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e5e5e5;padding:20px;height:fit-content;}
@media(min-width:1024px){.panel{width:400px;}}
.panel h2{font-size:14px;font-weight:700;color:#171717;margin:0 0 12px;}
.section{margin-bottom:20px;}.section:last-child{margin-bottom:0;}
label.field-label{display:block;font-size:12px;font-weight:600;color:#404040;margin-bottom:4px;}
.hint{font-size:11px;color:#737373;}
input[type=text],textarea{width:100%;font-size:14px;border:1px solid #d4d4d4;border-radius:6px;padding:8px;font-family:'Nunito',sans-serif;}
textarea{resize:vertical;}
input[type=range]{width:100%;accent-color:#2E64E8;}
.file-drop{position:relative;cursor:pointer;border-radius:8px;border:2px dashed #d4d4d4;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fafafa;height:96px;}
.file-drop.small{height:64px;}
.file-drop:hover{border-color:#a3a3a3;}
.file-drop img{width:100%;height:100%;object-fit:contain;padding:4px;}
.file-drop-empty{display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;font-size:11px;text-align:center;padding:0 6px;}
.file-drop .remove-btn{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px;border:none;cursor:pointer;display:flex;}
.export-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#171717;color:#fff;font-size:14px;font-weight:600;border-radius:8px;padding:13px;border:none;cursor:pointer;margin-top:20px;font-family:inherit;}
.export-btn:hover{background:#303030;}.export-btn:disabled{opacity:.6;cursor:default;}
.preview-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;position:sticky;top:68px;align-self:flex-start;}
/* HEADER */
.page-header{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 24px;gap:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.page-header-logo{height:19px;display:block;filter:invert(1);}
.page-header-sep{width:1px;height:18px;background:#e0e0e0;flex-shrink:0;}
.page-header-title{font-size:11px;font-weight:800;color:#111;letter-spacing:.07em;text-transform:uppercase;}
.page-header-sub{font-size:11px;font-weight:400;color:#aaa;}
.page-header-nav{margin-left:auto;display:flex;gap:8px;}
.page-header-nav a{font-size:11px;font-weight:700;color:#333;text-decoration:none;padding:5px 12px;border-radius:2px;border:1px solid #ddd;letter-spacing:.03em;text-transform:uppercase;}
.page-header-nav a:hover{background:#f5f5f5;}
/* FOOTER */
.page-footer{position:fixed;bottom:0;right:0;z-index:100;display:flex;align-items:center;gap:8px;padding:7px 14px;background:#fff;border-top:1px solid #e5e5e5;border-left:1px solid #e5e5e5;border-radius:10px 0 0 0;}
.page-footer-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.06em;text-transform:uppercase;}
.page-footer-logo{height:15px;filter:invert(1);opacity:.4;}
@keyframes spin{to{transform:rotate(360deg);}}.spin{animation:spin 1s linear infinite;display:inline-flex;}
.saves-list{max-height:190px;overflow-y:auto;border:1px solid #e5e5e5;border-radius:8px;margin-bottom:10px;}
.save-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f0f0f0;}
.save-row:last-child{border-bottom:none;}
.fmt-opt{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border:2px solid #e5e5e5;border-radius:8px;background:#fff;}
.fmt-opt.on{border-color:#2E64E8;background:#f0f5ff;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;padding:7px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid #d4d4d4;background:#fff;cursor:pointer;font-family:inherit;}
.seg button.on{background:#2E64E8;color:#fff;border-color:#2E64E8;}
.upload-hint{font-size:11px;color:#737373;background:#f8f8f8;border:1px solid #e5e5e5;border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.upload-hint b{color:#404040;}
</style>

/* ═══ PARSEUR TEXTE RICHE ═════════════════════════════════════════════════
   **mot** = surlignage fond dégradé (TotalEnergies)
   __mot__ = soulignage ligne dégradé simple
   ══════════════════════════════════════════════════════════════════════════ */
function parseRich(t){
  var out=[],re=/(\*\*[\s\S]+?\*\*|__[\s\S]+?__)/g,last=0,m;
  while((m=re.exec(t))!==null){
    if(m.index>last) out.push({t:"n",v:t.slice(last,m.index)});
    out.push(m[0].slice(0,2)==="**"?{t:"h",v:m[0].slice(2,-2)}:{t:"u",v:m[0].slice(2,-2)});
    last=re.lastIndex;
  }
  if(last<t.length) out.push({t:"n",v:t.slice(last)});
  return out;
}

/* ═══ GUILLEMETS ══════════════════════════════════════════════════════════
   qstyle="curly"   → PNG  ouvert.png / ferme.png
   qstyle="chevron" → SVG  « »  (guillemets français en dégradé TE)
   ══════════════════════════════════════════════════════════════════════════ */
var GID=0;
function GuilChevron(p){
  // « ouvrant : pointe vers la droite  ❯ ❯
  // » fermant : pointe vers la gauche  ❮ ❮  (chemins miroirs)
  var id="gc"+(++GID);
  var H=p.h, sw=Math.max(H*0.15,2);
  var gap=H*0.7;           // espace entre les deux chevrons
  var arm=H*0.4;           // longueur de chaque bras
  var VW=arm*2+gap+sw*2;  // largeur totale du SVG
  var cx1=sw, cx2=sw+arm;  // premier chevron
  var cx3=sw+arm+gap, cx4=sw+arm*2+gap; // deuxième
  var yt=0, ym=H/2, yb=H;

  var d;
  if(!p.close){
    // « — deux > (ouvrant français = pointe à droite)
    d="M "+cx1+" "+yt+" L "+cx2+" "+ym+" L "+cx1+" "+yb
     +" M "+cx3+" "+yt+" L "+cx4+" "+ym+" L "+cx3+" "+yb;
  } else {
    // » — deux < (fermant français = pointe à gauche)
    d="M "+cx2+" "+yt+" L "+cx1+" "+ym+" L "+cx2+" "+yb
     +" M "+cx4+" "+yt+" L "+cx3+" "+ym+" L "+cx4+" "+yb;
  }
  return e("svg",{width:VW,height:H,viewBox:"0 0 "+VW+" "+H,
    style:{display:"inline-block",verticalAlign:"middle",overflow:"visible"}},
    e("defs",null,e("linearGradient",{id:id,x1:"0",y1:"0",x2:"1",y2:"0"},
      e("stop",{offset:"0%",stopColor:TE_G_FROM}),
      e("stop",{offset:"100%",stopColor:TE_G_TO}))),
    e("path",{d:d,fill:"none",stroke:"url(#"+id+")",strokeWidth:sw,strokeLinecap:"round",strokeLinejoin:"round"}));
}
function Guil(p){
  if(p.qstyle==="chevron") return e(GuilChevron,p);
  // curly : PNG depuis le dossier serveur
  return e("img",{src:p.close?"ferme.png":"ouvert.png",alt:"",
    style:{height:p.h+"px",width:"auto",display:"inline-block",verticalAlign:"middle"}});
}

var e=React.createElement,useState=React.useState,useRef=React.useRef,
    useCallback=React.useCallback,useEffect=React.useEffect;

/* ─── FileDrop ─────────────────────────────────────────────────────────── */
function FileDrop(p){
  var r=useRef(null);
  function take(f){if(!f||!f.type||f.type.indexOf("image/")!==0)return;var rd=new FileReader();rd.onload=function(ev){p.onChange(ev.target.result);};rd.readAsDataURL(f);}
  return e("div",{className:"file-drop"+(p.small?" small":""),
    onClick:function(){if(r.current)r.current.click();},
    onDragOver:function(ev){ev.preventDefault();},
    onDrop:function(ev){ev.preventDefault();take(ev.dataTransfer.files[0]);}},
    p.value
      ?e(React.Fragment,null,
          e("img",{src:p.value,alt:""}),
          e("button",{className:"remove-btn",onClick:function(ev){ev.stopPropagation();p.onChange(null);}},
            e("svg",{viewBox:"0 0 16 16",width:14,height:14,fill:"none",stroke:"#666",strokeWidth:2},
              e("line",{x1:4,y1:4,x2:12,y2:12}),e("line",{x1:12,y1:4,x2:4,y2:12}))))
      :e("div",{className:"file-drop-empty"},
          e("svg",{viewBox:"0 0 24 24",width:20,height:20,fill:"none",stroke:"#a3a3a3",strokeWidth:1.5},
            e("rect",{x:3,y:3,width:18,height:18,rx:3}),
            e("circle",{cx:8.5,cy:8.5,r:1.5}),e("path",{d:"M21 15l-5-5L5 21"})),
          e("span",null,p.placeholder||"Cliquer ou déposer")),
    e("input",{ref:r,type:"file",accept:"image/*",style:{display:"none"},onChange:function(ev){take(ev.target.files[0]);}}));
}

/* ═══ IndexedDB ════════════════════════════════════════════════════════════ */
var DB_NAME="wie_db",DB_VERSION=2,STORE="citation_saves";
function openDB(ok,ko){var q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=function(ev){var db=ev.target.result;if(!db.objectStoreNames.contains("saves"))db.createObjectStore("saves",{keyPath:"name"});if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"name"});};q.onsuccess=function(ev){ok(ev.target.result);};q.onerror=function(){ko&&ko();};}
function dbAll(cb){openDB(function(db){var q=db.transaction(STORE,"readonly").objectStore(STORE).getAll();q.onsuccess=function(ev){var a=ev.target.result||[];a.sort(function(x,y){return y.date>x.date?1:-1;});cb(a);};q.onerror=function(){cb([]);};},function(){cb([]);});}
function dbPut(en,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(en);t.oncomplete=cb||function(){};});}
function dbDel(n,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE)["delete"](n);t.oncomplete=cb||function(){};});}
function dbPutAll(a,cb){openDB(function(db){var t=db.transaction(STORE,"readwrite"),s=t.objectStore(STORE);a.forEach(function(x){s.put(x);});t.oncomplete=cb||function(){};});}

var DEFAULT={
  format:"1x1", quoteStyle:"curly",
  bgImg:"TEMPLATE_BACK2.png", bgBlur:0, bgDark:0,
  photo:"TEMPLATE_PERSONNE.png",
  name:"PATRICK POUYANNÉ", title:"Chairman & CEO\nof TotalEnergies",
  badge:"MORE ENERGY, LESS EMISSIONS",
  quote:"Our first challenge is to continue to **provide the energy the world needs** while __significantly reducing the emissions generated__ by our operations. One of our priorities remains **methane reduction,** with the ambition of achieving near-zero methane emissions by 2030.",
  showLogo:false, logoImg:null
};

/* ═══ APP ══════════════════════════════════════════════════════════════════ */
function App(){
  var a0=useState(DEFAULT),st=a0[0],setSt=a0[1];
  var a1=useState([]),saves=a1[0],setSaves=a1[1];
  var a2=useState(""),sname=a2[0],setSname=a2[1];
  var a3=useState(false),busy=a3[0],setBusy=a3[1];
  var cardRef=useRef(null),impRef=useRef(null);
  function set(k,v){setSt(function(p){var c=Object.assign({},p);c[k]=v;return c;});}
  var L=getLayout(st.format),CARD_H=L.CARD_H,EX=L.EXPORT_SCALE;
  useEffect(function(){dbAll(function(a){setSaves(a);});},[]); // eslint-disable-line

  function save(){var n=sname.trim()||("Version "+new Date().toLocaleString("fr-FR"));dbPut({name:n,date:new Date().toISOString(),state:st},function(){dbAll(function(a){setSaves(a);});});setSname("");}
  function load(en){setSt(Object.assign({},DEFAULT,en.state));}
  function del(n){dbDel(n,function(){dbAll(function(a){setSaves(a);});});}
  function expJson(){dbAll(function(a){var b=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});var l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="citation-sauvegardes.json";l.click();});}
  function impJson(f){if(!f)return;var r=new FileReader();r.onload=function(ev){try{var a=JSON.parse(ev.target.result);var ok=a.filter(function(x){return x&&x.name&&x.state;});if(!ok.length)throw new Error("aucune entrée valide");dbPutAll(ok,function(){dbAll(function(m){setSaves(m);alert(ok.length+" sauvegarde(s) importée(s).");});});}catch(er){alert("Fichier invalide ("+er.message+").");}};r.readAsText(f);}

  /* Export */
  var doExport=useCallback(function(){
    if(!cardRef.current)return;
    setBusy(true);
    function preBlur(src,w,h,px,done){
      if(!src||px<=0)return done(null);
      var i=new Image();
      i.onload=function(){var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.filter="blur("+px+"px)";var ir=i.naturalWidth/i.naturalHeight,cr=w/h,dw,dh;if(ir>cr){dh=h*1.06;dw=dh*ir;}else{dw=w*1.06;dh=dw/ir;}x.drawImage(i,(w-dw)/2,(h-dh)/2,dw,dh);done(c.toDataURL("image/png"));};
      i.onerror=function(){done(null);};i.src=src;
    }
    var realH=cardRef.current.getBoundingClientRect().height||CARD_H;
    preBlur(st.bgImg,CARD_W,realH,st.bgBlur,function(blurred){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1";
      var cl=cardRef.current.cloneNode(true);
      cl.style.transform="none";cl.style.position="static";cl.style.width=CARD_W+"px";
      box.appendChild(cl);document.body.appendChild(box);
      if(blurred){var bg=cl.querySelector("[data-layer=bg]");if(bg){bg.style.backgroundImage="url("+blurred+")";bg.style.filter="none";bg.style.transform="none";}}
      var captH=cl.getBoundingClientRect().height||realH;
      window.html2canvas(cl,{scale:EX,useCORS:true,backgroundColor:"#12203c",width:CARD_W,height:captH})
        .then(function(cv){var a=document.createElement("a");a.download=(st.name||"citation").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+st.format+".png";a.href=cv.toDataURL("image/png");a.click();})
        .catch(function(er){console.error(er);alert("Erreur export.");})
        .then(function(){document.body.removeChild(box);setBusy(false);});
    });
  },[st,CARD_H,EX]);

  /* Rendu texte riche */
  function richNodes(txt,fs){
    var lineH=Math.max(2,Math.round(fs*0.13)); // épaisseur trait dégradé
    var padB=Math.max(3,Math.round(fs*0.17));  // espace sous le texte
    return parseRich(txt).map(function(p,i){
      if(p.t==="h") return e("span",{key:i,style:{
        background:TE_GRAD,color:TE_WHITE,fontWeight:800,
        padding:"0.03em 0.28em 0.05em",
        WebkitBoxDecorationBreak:"clone",boxDecorationBreak:"clone",
        borderRadius:1,lineHeight:"inherit"}},p.v);
      if(p.t==="u") return e("span",{key:i,style:{
        // Ligne dégradé simple — collée sous la baseline
        backgroundImage:"linear-gradient(90deg,"+TE_G_FROM+" 0%,"+TE_G_TO+" 100%)",
        backgroundRepeat:"no-repeat",
        backgroundSize:"100% "+lineH+"px",
        backgroundPosition:"0 100%",
        paddingBottom:padB+"px",
        WebkitBoxDecorationBreak:"clone",boxDecorationBreak:"clone"}},p.v);
      return e("span",{key:i},p.v);
    });
  }

  var previewScale=Math.min(520/CARD_W,(window.innerHeight-140)/CARD_H,1);

  /* ═══ CARTE ════════════════════════════════════════════════════════════════
     Hauteur auto : le bloc blanc grandit avec le texte.
     ══════════════════════════════════════════════════════════════════════════ */
  var card=e("div",{ref:cardRef,style:{
    width:CARD_W,minHeight:CARD_H,position:"relative",
    fontFamily:"'Nunito',sans-serif",background:"#12203c",overflow:"hidden"}},

    e("div",{"data-layer":"bg",style:{position:"absolute",inset:0,
      backgroundImage:st.bgImg?"url("+st.bgImg+")":"none",
      backgroundSize:"cover",backgroundPosition:"center",
      filter:st.bgBlur>0?"blur("+st.bgBlur+"px)":"none",
      transform:st.bgBlur>0?"scale(1.06)":"none"}}),
    st.bgDark>0?e("div",{style:{position:"absolute",inset:0,background:"rgba(10,20,45,"+st.bgDark+")"}}):null,

    /* BADGE */
    e("div",{style:{position:"absolute",left:L.BADGE_X,top:L.BADGE_Y,display:"flex",alignItems:"center",gap:L.BADGE_GAP}},
      e("div",{style:{width:L.BADGE_ICON,height:L.BADGE_ICON,borderRadius:L.BADGE_RADIUS,background:TE_GRAD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
        e("svg",{viewBox:"0 0 24 24",width:L.BADGE_ICON*0.56,height:L.BADGE_ICON*0.56,fill:TE_WHITE},
          e("path",{d:"M13.5 2 L5 13.2 h5.2 L9.6 22 L19 10.4 h-5.4 z"}))),
      e("div",{style:{height:L.BADGE_H,borderRadius:L.BADGE_RADIUS,background:TE_GRAD,display:"flex",alignItems:"center",padding:"0 "+L.BADGE_PADX+"px",color:TE_WHITE,fontWeight:800,fontSize:L.BADGE_FONT,letterSpacing:".055em",textTransform:"uppercase",whiteSpace:"nowrap"}},st.badge)),

    /* PERSONNE */
    e("div",{style:{position:"absolute",left:L.PERSON_X,top:L.PERSON_Y,display:"flex",alignItems:"stretch",gap:L.PERSON_GAP}},
      e("div",{style:{width:L.PHOTO_W,height:L.PHOTO_H,borderRadius:L.PERSON_RADIUS,overflow:"hidden",flexShrink:0,background:"rgba(255,255,255,.14)"}},
        st.photo?e("img",{src:st.photo,alt:"",style:{width:"100%",height:"100%",objectFit:"cover",display:"block"}}):e("div",{style:{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:"rgba(255,255,255,.4)",fontSize:10,fontWeight:700,letterSpacing:".08em"}},"PHOTO")),
      e("div",{style:{height:L.PHOTO_H,borderRadius:L.PERSON_RADIUS,background:TE_GRAD,display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 "+L.PERSON_PADX+"px"}},
        e("div",{style:{color:TE_WHITE,fontWeight:900,fontSize:L.NAME_FONT,lineHeight:1.18,letterSpacing:".01em",whiteSpace:"nowrap"}},st.name),
        e("div",{style:{color:TE_WHITE,fontWeight:400,fontSize:L.TITLE_FONT,lineHeight:1.3,whiteSpace:"pre-line",marginTop:2}},st.title))),

    /* BLOC CITATION */
    e("div",{style:{position:"absolute",left:L.QUOTE_X,top:L.QUOTE_Y,width:L.QUOTE_W,background:TE_WHITE,borderRadius:L.QUOTE_RADIUS,padding:L.QUOTE_PAD,paddingBottom:L.QUOTE_PAD+8,boxSizing:"border-box"}},
      e("div",{style:{color:TE_TEXT,fontSize:L.QUOTE_FONT,lineHeight:L.QUOTE_LH,fontWeight:600}},
        e("span",{style:{display:"inline-block",marginRight:L.QUOTE_FONT*0.38,verticalAlign:"-0.08em",lineHeight:0,flexShrink:0}},
          e(Guil,{qstyle:st.quoteStyle,w:L.GUIL_W,h:L.GUIL_H,close:false})),
        richNodes(st.quote,L.QUOTE_FONT),
        e("span",{style:{display:"inline-block",marginLeft:L.QUOTE_FONT*0.38,verticalAlign:"-0.08em",lineHeight:0}},
          e(Guil,{qstyle:st.quoteStyle,w:L.GUIL_W,h:L.GUIL_H,close:true}))),
      (st.showLogo&&st.logoImg)?e("div",{style:{marginTop:14,textAlign:"right"}},
        e("img",{src:st.logoImg,alt:"",style:{height:L.LOGO_H,objectFit:"contain"}})):null)
  );

  var previewWrap=e("div",{style:{width:CARD_W*previewScale,minHeight:CARD_H*previewScale,position:"relative",flexShrink:0}},
    e("div",{style:{width:CARD_W,transform:"scale("+previewScale+")",transformOrigin:"top left",position:"absolute",top:0,left:0}},card));

  /* ═══ PANNEAU ═══════════════════════════════════════════════════════════ */
  function segBtn(val,key,opts){
    return e("div",{className:"seg"},opts.map(function(o){
      return e("button",{key:o.v,className:val===o.v?"on":"",onClick:function(){set(key,o.v);}},o.l);
    }));
  }

  var panel=e("div",{className:"panel"},

    e("div",{className:"section"},e("h2",null,"Format"),
      e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        Object.keys(FORMATS).map(function(k){
          var f=FORMATS[k],on=st.format===k;
          return e("label",{key:k,className:"fmt-opt"+(on?" on":"")},
            e("input",{type:"radio",name:"fmt",checked:on,onChange:function(){set("format",k);},style:{accentColor:"#2E64E8"}}),
            e("div",null,
              e("div",{style:{fontWeight:700,fontSize:13,color:on?"#2E64E8":"#171717"}},f.label),
              e("div",{className:"hint"},f.outputW+" × "+f.outputH+" px")));
        }))),

    e("div",{className:"section"},e("h2",null,"Badge"),
      e("input",{type:"text",value:st.badge,onChange:function(ev){set("badge",ev.target.value);}})),

    e("div",{className:"section"},e("h2",null,"Image de fond"),
      e("div",{className:"upload-hint"},
        "Format idéal : ",e("b",null,"PNG/JPG, 1080×1080 ou 1080×1350 px")," • Défaut : TEMPLATE_BACK2.png"),
      e(FileDrop,{value:st.bgImg,onChange:function(v){set("bgImg",v);},placeholder:"Photo de fond (ou vide = template)"}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Flou ("+st.bgBlur+" px)"),
      e("input",{type:"range",min:0,max:12,step:0.5,value:st.bgBlur,onChange:function(ev){set("bgBlur",parseFloat(ev.target.value));}}),
      e("label",{className:"field-label"},"Assombrissement ("+Math.round(st.bgDark*100)+" %)"),
      e("input",{type:"range",min:0,max:0.7,step:0.05,value:st.bgDark,onChange:function(ev){set("bgDark",parseFloat(ev.target.value));}})),

    e("div",{className:"section"},e("h2",null,"Personne"),
      e("div",{className:"upload-hint"},
        "Format idéal : ",e("b",null,"PNG fond transparent, portrait 3:4 (~400×530 px)")," • Défaut : TEMPLATE_PERSONNE.png"),
      e(FileDrop,{value:st.photo,onChange:function(v){set("photo",v);},placeholder:"Portrait (ou vide = template)",small:true}),
      e("div",{style:{height:10}}),
      e("label",{className:"field-label"},"Nom"),
      e("input",{type:"text",value:st.name,onChange:function(ev){set("name",ev.target.value);}}),
      e("div",{style:{height:8}}),
      e("label",{className:"field-label"},"Fonction ",e("span",{className:"hint"},"(Entrée = retour à la ligne)")),
      e("textarea",{rows:2,value:st.title,onChange:function(ev){set("title",ev.target.value);}})),

    e("div",{className:"section"},e("h2",null,"Guillemets"),
      e("label",{className:"field-label"},"Style"),
      segBtn(st.quoteStyle,"quoteStyle",[{v:"curly",l:"“ ”  English"},{v:"chevron",l:"« »  Français"}])),

    e("div",{className:"section"},e("h2",null,"Citation"),
      e("div",{className:"upload-hint",style:{marginBottom:6}},
        e("b",null,"**mot**")," = surlignage dégradé  •  ",
        e("b",null,"__mot__")," = soulignage ligne dégradé"),
      e("textarea",{rows:8,value:st.quote,onChange:function(ev){set("quote",ev.target.value);},style:{fontSize:13,lineHeight:1.5}})),

    e("div",{className:"section"},e("h2",null,"Logo TotalEnergies"),
      e("label",{style:{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,cursor:"pointer"}},
        e("input",{type:"checkbox",checked:st.showLogo,onChange:function(ev){set("showLogo",ev.target.checked);},style:{accentColor:"#2E64E8"}}),
        "Afficher le logo en bas du bloc citation"),
      st.showLogo?e("div",{style:{marginTop:10}},
        e(FileDrop,{value:st.logoImg,onChange:function(v){set("logoImg",v);},placeholder:"Logo (PNG transparent)",small:true})):null),

    e("div",{className:"section"},e("h2",null,"Sauvegardes"),
      e("div",{style:{display:"flex",gap:8,marginBottom:10}},
        e("input",{type:"text",value:sname,placeholder:"Nom de la version…",onChange:function(ev){setSname(ev.target.value);},style:{flex:1,fontSize:13,padding:"6px 8px"}}),
        e("button",{onClick:save,style:{background:"#2E64E8",color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit"}},"Sauvegarder")),
      saves.length===0?e("div",{className:"hint",style:{marginBottom:10}},"Aucune sauvegarde."):
        e("div",{className:"saves-list"},saves.map(function(v,i){
          return e("div",{key:i,className:"save-row"},
            e("div",{style:{flex:1,minWidth:0}},
              e("div",{style:{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},v.name),
              e("div",{className:"hint"},new Date(v.date).toLocaleString("fr-FR"))),
            e("button",{onClick:function(){load(v);},style:{background:"#f0f5ff",color:"#2E64E8",border:"none",borderRadius:5,padding:"4px 10px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}},"Charger"),
            e("button",{onClick:function(){if(confirm("Supprimer « "+v.name+" » ?"))del(v.name);},style:{background:"#fff0f0",color:"#c0392b",border:"none",borderRadius:5,padding:"4px 8px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}},"×"));
        })),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:expJson,style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Export .json"),
        e("button",{onClick:function(){if(impRef.current)impRef.current.click();},style:{flex:1,background:"#f5f5f5",border:"1px solid #ddd",borderRadius:6,padding:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}},"Import .json"),
        e("input",{ref:impRef,type:"file",accept:".json",style:{display:"none"},onChange:function(ev){impJson(ev.target.files&&ev.target.files[0]);}}))),

    e("button",{className:"export-btn",onClick:doExport,disabled:busy},
      busy?e("span",{className:"spin"},e(DownloadIcon)):e(DownloadIcon),
      busy?"Export en cours…":"Télécharger le PNG ("+FORMATS[st.format].outputW+" × "+FORMATS[st.format].outputH+")")
  );

  return e("div",{className:"app-layout"},panel,e("div",{className:"preview-wrap"},previewWrap));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
} // end boot()
</script>
</body>
</html>
